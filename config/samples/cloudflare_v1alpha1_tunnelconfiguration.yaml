apiVersion: kflare.dev/v1alpha1
kind: TunnelConfiguration
metadata:
  name: example-tunnel-config
  namespace: default
spec:
  # The Tunnel (same namespace) whose ingress rules this resource owns.
  tunnelRef:
    name: example-tunnel
  # Each hostname also needs a DNS record that points at the tunnel: a
  # DNSRecord with tunnelRef (see cloudflare_v1alpha1_dnsrecord_tunnel.yaml).
  ingress:
    - hostname: app.example.com
      service: http://my-app.default.svc.cluster.local:80
    - hostname: api.example.com
      path: ^/v1/
      service: https://my-api.default.svc.cluster.local:443
      originRequest:
        originServerName: api.example.com
  # Requests that match no rule. Defaults to http_status:404.
  defaultService: http_status:404
