# The credentials the other kinds use, through their accountRef (or their
# zone's). It is cluster-scoped, and its Secret holds an API token with the
# permissions of the kinds you use (docs/deploy.md):
#
#   kubectl -n kflare-system create secret generic cloudflare-token \
#     --from-literal=CF_API_TOKEN=<your API token>
apiVersion: kflare.dev/v1alpha1
kind: CloudflareAccount
metadata:
  name: my-account
spec:
  accountID: <your account ID>
  tokenSecretRef:
    name: cloudflare-token
    namespace: kflare-system
  # Which namespaces' resources may use this account. Unset, every namespace's
  # may. Set it on a shared cluster, or when the cluster serves several accounts.
  # allowedNamespaces:
  #   from: Selector
  #   selector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: my-team
