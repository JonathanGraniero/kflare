apiVersion: kflare.dev/v1alpha1
kind: WorkerScript
metadata:
  name: example-worker
  namespace: default
spec:
  name: example-worker            # script name in Cloudflare (immutable)
  accountRef:
    name: my-account
  format: module
  compatibilityDate: "2024-09-23"
  # Inline code; use scriptConfigMapRef: {name, key} to read it from a ConfigMap instead.
  script: |
    export default {
      async fetch(request, env) {
        return new Response(`${env.GREETING} from kflare`);
      },
    };
  bindings:
    - name: GREETING
      plainText: Hello
    - name: API_KEY               # read from Secret example-worker-secrets, key api-key
      secretKeyRef:
        name: example-worker-secrets
        key: api-key
