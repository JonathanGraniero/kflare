apiVersion: kflare.dev/v1alpha1
kind: DNSRecord
metadata:
  name: mx-record
  namespace: default
  annotations:
    kflare.dev/deletion-policy: retain
spec:
  zoneRef:
    name: example-zone  # must reference an existing Zone CR in the same namespace
  name: example.com
  type: MX
  content: mail.example.com
  priority: 10
  ttl: 300
