# permissions for end users to edit cloudflareaccounts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: cloudflareaccount-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: cloudflare-operator
    app.kubernetes.io/part-of: cloudflare-operator
    app.kubernetes.io/managed-by: kustomize
  name: cloudflareaccount-editor-role
rules:
- apiGroups:
  - cloudflare.cloudflare.k8s.io
  resources:
  - cloudflareaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloudflare.cloudflare.k8s.io
  resources:
  - cloudflareaccounts/status
  verbs:
  - get
