# permissions for end users to view cloudflareaccounts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: cloudflareaccount-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: cloudflare-operator
    app.kubernetes.io/part-of: cloudflare-operator
    app.kubernetes.io/managed-by: kustomize
  name: cloudflareaccount-viewer-role
rules:
- apiGroups:
  - cloudflare.cloudflare.k8s.io
  resources:
  - cloudflareaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cloudflare.cloudflare.k8s.io
  resources:
  - cloudflareaccounts/status
  verbs:
  - get
