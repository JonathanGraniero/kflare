---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dnsrecords.kflare.dev
spec:
  group: kflare.dev
  names:
    categories:
    - kflare
    kind: DNSRecord
    listKind: DNSRecordList
    plural: dnsrecords
    shortNames:
    - cfrecord
    singular: dnsrecord
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Record Name
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.content
      name: Content
      type: string
    - jsonPath: .status.cloudflareMetadata.recordID
      name: Record ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DNSRecord is the Schema for the dnsrecords API.
          It represents a DNS record within a Cloudflare-managed zone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DNSRecordSpec defines the desired state of DNSRecord.
            properties:
              comment:
                description: Comment is an optional free-text annotation for the record.
                type: string
              content:
                description: |-
                  Content is the DNS record content (e.g. an IP address for A records,
                  a hostname for CNAME/MX). Set exactly one of content, data and
                  tunnelRef: record types such as SRV, LOC and CAA use data instead.
                minLength: 1
                type: string
              data:
                description: |-
                  Data holds structured record data for types that require it (SRV, LOC, CAA).
                  The JSON structure must match the Cloudflare API schema for the given record type.
                  Set exactly one of content, data and tunnelRef.
                  Cloudflare derives the record content from it, so content drift is not
                  corrected while data is set.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              name:
                description: |-
                  Name is the fully-qualified DNS record name (e.g. "www.example.com").
                  Immutable after creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              priority:
                description: |-
                  Priority is the record priority, used for MX, SRV and URI records.
                  When unset, kflare leaves the priority Cloudflare chose unchanged.
                type: integer
              proxied:
                description: |-
                  Proxied controls whether Cloudflare proxies traffic through its network for this record.
                  Only applicable to A, AAAA, and CNAME records. Defaults to false (DNS only),
                  or to true with a tunnelRef, which cannot be unproxied.
                type: boolean
              tags:
                description: Tags are optional labels attached to the record in Cloudflare.
                items:
                  type: string
                type: array
              ttl:
                description: |-
                  TTL is the time-to-live in seconds: 1 for automatic (the default), or
                  30-86400. Cloudflare only accepts values below 60 on Enterprise zones,
                  and a proxied record always has an automatic TTL.
                maximum: 86400
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: ttl must be 1 (automatic) or between 30 and 86400
                  rule: self == 1 || self >= 30
              tunnelRef:
                description: |-
                  TunnelRef points the record at a Tunnel in the same namespace: kflare
                  sets its content to the tunnel's hostname, <tunnel ID>.cfargotunnel.com,
                  and corrects it when the tunnel is recreated with a new ID. Only for
                  CNAME records, which are then proxied: a tunnel carries traffic only
                  through Cloudflare's proxy, and only for records in the tunnel's
                  account, so the Tunnel must use the Zone's CloudflareAccount. The Tunnel
                  waits for the records that point at it before it is deleted.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              type:
                description: Type is the DNS record type. Immutable after creation.
                enum:
                - A
                - AAAA
                - CNAME
                - MX
                - NS
                - OPENPGPKEY
                - PTR
                - TXT
                - CAA
                - CERT
                - DNSKEY
                - DS
                - HTTPS
                - LOC
                - NAPTR
                - SMIMEA
                - SRV
                - SSHFP
                - SVCB
                - TLSA
                - URI
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
              zoneRef:
                description: |-
                  ZoneRef references the Zone, in the same namespace, the DNS record
                  belongs to.
                  Immutable after creation.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: zoneRef is immutable
                  rule: self == oldSelf
            required:
            - name
            - type
            - zoneRef
            type: object
            x-kubernetes-validations:
            - message: set exactly one of content, data and tunnelRef
              rule: '(has(self.content) ? 1 : 0) + (has(self.data) ? 1 : 0) + (has(self.tunnelRef)
                ? 1 : 0) == 1'
            - message: tunnelRef needs type CNAME
              rule: '!has(self.tunnelRef) || self.type == ''CNAME'''
            - message: 'a record with a tunnelRef must be proxied: an unproxied one
                resolves to an address the internet cannot reach'
              rule: '!has(self.tunnelRef) || !has(self.proxied) || self.proxied'
            - message: 'a proxied record takes ttl 1 (automatic): Cloudflare ignores
                any other'
              rule: '!(has(self.tunnelRef) || (has(self.proxied) && self.proxied))
                || !has(self.ttl) || self.ttl == 1'
          status:
            description: DNSRecordStatus defines the observed state of DNSRecord.
            properties:
              cloudflareMetadata:
                description: CloudflareMetadata holds identifiers and metadata returned
                  by the Cloudflare API.
                properties:
                  proxiable:
                    description: Proxiable indicates whether this record type supports
                      Cloudflare proxying.
                    type: boolean
                  recordID:
                    description: RecordID is the Cloudflare DNS record identifier.
                    type: string
                  zoneID:
                    description: |-
                      ZoneID is the Cloudflare zone the DNS record belongs to (denormalized
                      from the Zone status).
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the DNS record state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
