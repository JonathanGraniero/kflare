---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: ratelimitrules.kflare.dev
spec:
  group: kflare.dev
  names:
    categories:
    - kflare
    kind: RateLimitRule
    listKind: RateLimitRuleList
    plural: ratelimitrules
    shortNames:
    - cfratelimit
    singular: ratelimitrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.ratelimit.period
      name: Period
      type: integer
    - jsonPath: .spec.ratelimit.requestsPerPeriod
      name: Requests
      type: integer
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .status.cloudflareMetadata.ruleID
      name: Rule ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RateLimitRule is the Schema for the ratelimitrules API.
          It manages one rate limiting rule in a zone, in its http_ratelimit phase:
          the rule counts the requests its expression matches, and once a client
          sends more than requestsPerPeriod of them in a period, the action applies
          to the client's matching requests for the mitigation timeout. A Free plan
          allows one rate limiting rule, counted per IP address over 10 seconds,
          with the block action.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RateLimitRuleSpec defines the desired state of RateLimitRule: the fields
              every rule kind shares, its action, the parameters of its actions, and the
              rule's own fields it sets.
            properties:
              action:
                description: |-
                  Action is what Cloudflare does with a client's matching requests once it
                  is over the rate. Free plans can only block.

                    - block: blocks them, with Cloudflare's response or the rule's.
                    - challenge: issues an interactive challenge.
                    - js_challenge: issues a JavaScript challenge.
                    - managed_challenge: issues the challenge Cloudflare picks for the visitor.
                    - log: only logs them (Enterprise plans).
                enum:
                - block
                - challenge
                - js_challenge
                - managed_challenge
                - log
                type: string
              description:
                description: Description is shown with the rule in the Cloudflare
                  dashboard.
                maxLength: 4096
                type: string
              enabled:
                default: true
                description: Enabled turns the rule on or off without deleting it.
                type: boolean
              expression:
                description: |-
                  Expression selects the requests the rule applies to, in Cloudflare's
                  Rules language, for example `http.request.uri.path eq "/admin"`.
                  Cloudflare validates it; the fields and operators it may use depend on
                  the zone's plan.
                maxLength: 4096
                minLength: 1
                type: string
              priority:
                description: |-
                  Priority orders the rules kflare manages in a zone and phase: lower runs
                  first, and rules with the same priority run in order of namespace and
                  name. Rules created outside kflare keep their place.
                format: int32
                type: integer
              ratelimit:
                description: |-
                  Ratelimit is the rule's rate limit: what requests are counted by, over
                  what period, how many a client may send, and for how long the action
                  applies once the client sends more.
                properties:
                  characteristics:
                    description: |-
                      Characteristics are what requests are counted by: requests that share
                      all of them share a counter. Cloudflare counts per data center, so they
                      list cf.colo.id, and at least one other field: ip.src counts per client
                      IP address, the only choice on Free plans; higher plans can count by
                      other fields, such as http.request.headers["x-api-key"].
                    items:
                      minLength: 1
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  countingExpression:
                    description: |-
                      CountingExpression counts other requests than those the rule matches,
                      for example only the failed logins among the login requests. It
                      defaults to the rule's expression. Free plans cannot set it.
                    minLength: 1
                    type: string
                  mitigationTimeout:
                    description: |-
                      MitigationTimeout is how long, in seconds, the action applies once a
                      client is over the rate. It must be at least the period, or 0 to
                      throttle instead: apply the action only to the requests over the rate
                      (Enterprise plans). Free plans can only use 10.
                    format: int64
                    type: integer
                  period:
                    description: |-
                      Period is how long, in seconds, requests are counted for. Cloudflare
                      accepts set periods between 10 seconds and an hour, and the zone's plan
                      narrows them: Free plans can only count for 10 seconds.
                    format: int64
                    minimum: 0
                    type: integer
                  requestsPerPeriod:
                    description: |-
                      RequestsPerPeriod is how many matching requests a client can send in a
                      period before the action applies.
                    format: int64
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  requestsToOrigin:
                    description: |-
                      RequestsToOrigin counts only the requests that reach the origin,
                      leaving out those served from Cloudflare's cache.
                    type: boolean
                required:
                - characteristics
                - period
                type: object
                x-kubernetes-validations:
                - message: requestsPerPeriod is required
                  rule: has(self.requestsPerPeriod)
                - message: mitigationTimeout is required
                  rule: has(self.mitigationTimeout)
                - message: mitigationTimeout must be 0 or at least the period
                  rule: '!has(self.mitigationTimeout) || self.mitigationTimeout ==
                    0 || self.mitigationTimeout >= self.period'
                - message: characteristics must list cf.colo.id
                  rule: '''cf.colo.id'' in self.characteristics'
                - message: characteristics must list a field besides cf.colo.id
                  rule: self.characteristics.exists(c, c != 'cf.colo.id')
              response:
                description: Response replaces Cloudflare's response to the requests
                  a block rule blocks.
                properties:
                  content:
                    description: Content is the response body.
                    maxLength: 30720
                    minLength: 1
                    type: string
                  contentType:
                    description: ContentType is the response's content type.
                    enum:
                    - text/html
                    - text/plain
                    - application/json
                    - text/xml
                    type: string
                  statusCode:
                    description: StatusCode is the response's HTTP status code.
                    format: int64
                    maximum: 499
                    minimum: 400
                    type: integer
                required:
                - content
                - contentType
                - statusCode
                type: object
              zoneRef:
                description: |-
                  ZoneRef references the Zone, in the same namespace, the rule belongs to.
                  Immutable after creation.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: zoneRef is immutable
                  rule: self == oldSelf
            required:
            - action
            - expression
            - zoneRef
            type: object
            x-kubernetes-validations:
            - message: response is allowed only with action block
              rule: '!has(self.response) || self.action == ''block'''
            - message: ratelimit is required
              rule: has(self.ratelimit)
          status:
            description: RulesetRuleStatus is the observed state of a rule.
            properties:
              cloudflareMetadata:
                description: CloudflareMetadata identifies the rule in Cloudflare.
                properties:
                  ref:
                    description: |-
                      Ref is the rule's ref, which kflare derives from the resource's kind,
                      namespace and name. kflare finds the rule it manages by its ref.
                    type: string
                  ruleID:
                    description: RuleID is the rule's Cloudflare ID.
                    type: string
                  rulesetID:
                    description: RulesetID is the zone's entry point ruleset for the
                      rule's phase.
                    type: string
                  version:
                    description: |-
                      Version is the rule's version, which Cloudflare increments whenever the
                      rule changes.
                    type: string
                  zoneID:
                    description: ZoneID is the Cloudflare zone the rule is in.
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the rule's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
