---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: zones.kflare.dev
spec:
  group: kflare.dev
  names:
    kind: Zone
    listKind: ZoneList
    plural: zones
    shortNames:
    - cfzone
    singular: zone
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Domain
      type: string
    - jsonPath: .status.cloudflareMetadata.zoneID
      name: Zone ID
      type: string
    - jsonPath: .status.cloudflareMetadata.plan
      name: Plan
      type: string
    - jsonPath: .status.cloudflareMetadata.status
      name: CF Status
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Zone is the Schema for the zones API.
          It represents a DNS zone managed in Cloudflare.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZoneSpec defines the desired state of Zone.
            properties:
              accountRef:
                description: |-
                  AccountRef references the CloudflareAccount that owns this zone.
                  Immutable after creation.
                properties:
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      TODO: Add other useful fields. apiVersion, kind, uid?
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: accountRef is immutable
                  rule: self == oldSelf
              name:
                description: Name is the domain (e.g. "example.com"). Immutable after
                  creation.
                pattern: ^([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              plan:
                description: |-
                  Plan is the zone's billing plan: free, pro, business, or enterprise.
                  When unset, kflare leaves the plan alone. When set, kflare subscribes
                  the zone to it, which bills the account's default payment method.
                  Enterprise cannot be bought through the API; set it only for a zone
                  that is already on Enterprise. Downgrades take effect at the end of
                  the billing period and show up in status.cloudflareMetadata.pendingPlan.
                enum:
                - free
                - pro
                - business
                - enterprise
                type: string
              type:
                default: full
                description: 'Type is the zone type: "full" (Cloudflare manages DNS)
                  or "partial" (proxy only).'
                enum:
                - full
                - partial
                type: string
            required:
            - accountRef
            - name
            type: object
          status:
            description: ZoneStatus defines the observed state of Zone.
            properties:
              cloudflareMetadata:
                description: CloudflareMetadata holds identifiers and metadata returned
                  by the Cloudflare API.
                properties:
                  nameServers:
                    description: NameServers are the authoritative name servers assigned
                      by Cloudflare.
                    items:
                      type: string
                    type: array
                  pendingPlan:
                    description: |-
                      PendingPlan is a plan change Cloudflare has scheduled for the end of
                      the billing period, such as a downgrade.
                    type: string
                  plan:
                    description: Plan is the zone's current billing plan (free, pro,
                      business or enterprise).
                    type: string
                  status:
                    description: |-
                      Status is the zone activation status as reported by Cloudflare
                      (active, pending, initializing, moved, deactivated).
                    type: string
                  zoneID:
                    description: ZoneID is the Cloudflare zone identifier.
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the zone state.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
