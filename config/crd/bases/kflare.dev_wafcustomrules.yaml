---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: wafcustomrules.kflare.dev
spec:
  group: kflare.dev
  names:
    categories:
    - kflare
    kind: WAFCustomRule
    listKind: WAFCustomRuleList
    plural: wafcustomrules
    shortNames:
    - cfwaf
    singular: wafcustomrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .status.cloudflareMetadata.ruleID
      name: Rule ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WAFCustomRule is the Schema for the wafcustomrules API.
          It manages one WAF custom rule in a zone, in its
          http_request_firewall_custom phase: the rule blocks or challenges the
          requests its expression matches, or lets them skip other security
          features. A Free plan allows five custom rules.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WAFCustomRuleSpec defines the desired state of WAFCustomRule: the fields
              every rule kind shares, its action, the parameters of its actions, and the
              rule's own fields it sets.
            properties:
              action:
                description: |-
                  Action is what Cloudflare does with the requests the rule matches. Free
                  plans can take every action but log.

                    - block: blocks them, with Cloudflare's block page or the rule's response.
                    - challenge: issues an interactive challenge.
                    - js_challenge: issues a JavaScript challenge.
                    - managed_challenge: issues the challenge Cloudflare picks for the visitor.
                    - skip: lets them skip the security features its parameters name.
                    - log: only logs them (Enterprise plans).
                enum:
                - block
                - challenge
                - js_challenge
                - managed_challenge
                - skip
                - log
                type: string
              description:
                description: Description is shown with the rule in the Cloudflare
                  dashboard.
                maxLength: 4096
                type: string
              enabled:
                default: true
                description: Enabled turns the rule on or off without deleting it.
                type: boolean
              expression:
                description: |-
                  Expression selects the requests the rule applies to, in Cloudflare's
                  Rules language, for example `http.request.uri.path eq "/admin"`.
                  Cloudflare validates it; the fields and operators it may use depend on
                  the zone's plan.
                maxLength: 4096
                minLength: 1
                type: string
              logging:
                description: |-
                  Logging says whether a skip rule records the requests it matches in
                  Security Events. Cloudflare logs them unless enabled is false.
                properties:
                  enabled:
                    description: Enabled logs the requests the skip rule matches.
                    type: boolean
                required:
                - enabled
                type: object
              phase:
                description: |-
                  Phase, set to current, skips the rest of the phase: the zone's custom
                  rules after this one, and the custom rulesets the phase runs after
                  them. It can be combined with products, but not with phases or
                  ruleset.
                enum:
                - current
                type: string
              phases:
                description: |-
                  Phases skips later security phases: rate limiting rules
                  (http_ratelimit), managed rules (http_request_firewall_managed) and
                  Super Bot Fight Mode (http_request_sbfm).
                items:
                  enum:
                  - http_ratelimit
                  - http_request_firewall_managed
                  - http_request_sbfm
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              priority:
                description: |-
                  Priority orders the rules kflare manages in a zone and phase: lower runs
                  first, and rules with the same priority run in order of namespace and
                  name. Rules created outside kflare keep their place.
                format: int32
                type: integer
              products:
                description: |-
                  Products skips security features of the previous generation: zone
                  lockdown (zoneLockdown), user agent blocking (uaBlock), browser
                  integrity check (bic), hotlink protection (hot), security level
                  (securityLevel), the previous rate limiting (rateLimit) and the
                  previous managed rules (waf).
                items:
                  enum:
                  - bic
                  - hot
                  - rateLimit
                  - securityLevel
                  - uaBlock
                  - waf
                  - zoneLockdown
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              response:
                description: |-
                  Response replaces Cloudflare's block page for a block rule. It needs a
                  Pro plan or higher: Free zones are not entitled to a custom response.
                properties:
                  content:
                    description: Content is the response body, of at most 2,048 bytes.
                    maxLength: 2048
                    minLength: 1
                    type: string
                  contentType:
                    description: ContentType is the response's content type.
                    enum:
                    - text/html
                    - text/plain
                    - application/json
                    - text/xml
                    type: string
                  statusCode:
                    description: StatusCode is the response's HTTP status code, from
                      400 to 499.
                    format: int64
                    maximum: 499
                    minimum: 400
                    type: integer
                required:
                - content
                - contentType
                - statusCode
                type: object
              ruleset:
                description: |-
                  Ruleset, set to current, skips the zone's custom rules that run after
                  this one.
                enum:
                - current
                type: string
              zoneRef:
                description: |-
                  ZoneRef references the Zone, in the same namespace, the rule belongs to.
                  Immutable after creation.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: zoneRef is immutable
                  rule: self == oldSelf
            required:
            - action
            - expression
            - zoneRef
            type: object
            x-kubernetes-validations:
            - message: response is allowed only with action block
              rule: '!has(self.response) || self.action == ''block'''
            - message: phase is allowed only with action skip
              rule: '!has(self.phase) || self.action == ''skip'''
            - message: phases is allowed only with action skip
              rule: '!has(self.phases) || self.action == ''skip'''
            - message: products is allowed only with action skip
              rule: '!has(self.products) || self.action == ''skip'''
            - message: ruleset is allowed only with action skip
              rule: '!has(self.ruleset) || self.action == ''skip'''
            - message: action skip must set at least one of phase, phases, products
                and ruleset
              rule: self.action != 'skip' || (has(self.phase) || has(self.phases)
                || has(self.products) || has(self.ruleset))
            - message: logging is allowed only with action skip
              rule: '!has(self.logging) || self.action == ''skip'''
            - message: phase cannot be used with phases
              rule: '!has(self.phase) || !has(self.phases)'
            - message: phase cannot be used with ruleset
              rule: '!has(self.phase) || !has(self.ruleset)'
          status:
            description: RulesetRuleStatus is the observed state of a rule.
            properties:
              cloudflareMetadata:
                description: CloudflareMetadata identifies the rule in Cloudflare.
                properties:
                  ref:
                    description: |-
                      Ref is the rule's ref, which kflare derives from the resource's kind,
                      namespace and name. kflare finds the rule it manages by its ref.
                    type: string
                  ruleID:
                    description: RuleID is the rule's Cloudflare ID.
                    type: string
                  rulesetID:
                    description: RulesetID is the zone's entry point ruleset for the
                      rule's phase.
                    type: string
                  version:
                    description: |-
                      Version is the rule's version, which Cloudflare increments whenever the
                      rule changes.
                    type: string
                  zoneID:
                    description: ZoneID is the Cloudflare zone the rule is in.
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the rule's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
