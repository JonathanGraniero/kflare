---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: configurationrules.kflare.dev
spec:
  group: kflare.dev
  names:
    kind: ConfigurationRule
    listKind: ConfigurationRuleList
    plural: configurationrules
    shortNames:
    - cfconfig
    singular: configurationrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .status.cloudflareMetadata.ruleID
      name: Rule ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConfigurationRule is the Schema for the configurationrules API.
          It manages one configuration rule in a zone: settings, such as the SSL
          mode or the security level, changed for the requests its expression
          matches.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ConfigurationRuleSpec defines the desired state of ConfigurationRule: the
              fields every rule kind shares, and the parameters of its set_config action.
            properties:
              automaticHTTPSRewrites:
                description: AutomaticHTTPSRewrites rewrites links to HTTP URLs in
                  HTML responses to HTTPS.
                type: boolean
              bic:
                description: |-
                  BIC turns Browser Integrity Check on or off: it challenges requests whose
                  headers spammers and bots commonly abuse.
                type: boolean
              contentConverter:
                description: |-
                  ContentConverter converts content, such as HTML to Markdown, for the
                  clients that ask for it. Free plans may only turn it off.
                type: boolean
              description:
                description: Description is shown with the rule in the Cloudflare
                  dashboard.
                maxLength: 4096
                type: string
              disableRUM:
                description: DisableRUM turns Real User Monitoring off. It takes only
                  true.
                enum:
                - true
                type: boolean
              disableZaraz:
                description: DisableZaraz turns Zaraz off. It takes only true.
                enum:
                - true
                type: boolean
              emailObfuscation:
                description: EmailObfuscation hides the email addresses in HTML responses
                  from bots.
                type: boolean
              enabled:
                default: true
                description: Enabled turns the rule on or off without deleting it.
                type: boolean
              expression:
                description: |-
                  Expression selects the requests the rule applies to, in Cloudflare's
                  Rules language, for example `http.request.uri.path eq "/admin"`.
                  Cloudflare validates it; the fields and operators it may use depend on
                  the zone's plan.
                maxLength: 4096
                minLength: 1
                type: string
              fonts:
                description: Fonts serves the page's Google Fonts from Cloudflare
                  (Cloudflare Fonts).
                type: boolean
              hotlinkProtection:
                description: HotlinkProtection stops other sites from embedding the
                  zone's images.
                type: boolean
              opportunisticEncryption:
                description: |-
                  OpportunisticEncryption lets browsers fetch HTTP URLs over an encrypted
                  connection.
                type: boolean
              polish:
                description: |-
                  Polish is how Cloudflare optimizes images: off, lossless, lossy or webp.
                  Free plans may only turn it off; quote off in YAML, which would read it
                  as a boolean.
                enum:
                - "off"
                - lossless
                - lossy
                - webp
                type: string
              priority:
                description: |-
                  Priority orders the rules kflare manages in a zone and phase: lower runs
                  first, and rules with the same priority run in order of namespace and
                  name. Rules created outside kflare keep their place.
                format: int32
                type: integer
              redirectsForAITraining:
                description: |-
                  RedirectsForAITraining redirects verified AI training crawlers to the
                  canonical URLs the HTML response names. Free plans may only turn it off.
                type: boolean
              requestBodyBuffering:
                description: |-
                  RequestBodyBuffering is how much of a request's body Cloudflare buffers
                  before the origin gets it: none, standard or full.
                enum:
                - none
                - standard
                - full
                type: string
              responseBodyBuffering:
                description: |-
                  ResponseBodyBuffering is how much of a response's body Cloudflare buffers:
                  none or standard.
                enum:
                - none
                - standard
                type: string
              rocketLoader:
                description: RocketLoader loads the page's JavaScript without blocking
                  its rendering.
                type: boolean
              securityLevel:
                description: |-
                  SecurityLevel is how readily Cloudflare challenges visitors by their IP
                  address's reputation, from essentially_off to under_attack. Free plans
                  may not turn it off.
                enum:
                - "off"
                - essentially_off
                - low
                - medium
                - high
                - under_attack
                type: string
              serverSideExcludes:
                description: |-
                  ServerSideExcludes hides the content an HTML response marks with SSE tags
                  from suspicious visitors.
                type: boolean
              ssl:
                description: |-
                  SSL is how Cloudflare connects to the origin: off, flexible (HTTP), full
                  (HTTPS, any certificate), strict (HTTPS, a valid certificate) or
                  origin_pull. Free plans may not use origin_pull; quote off in YAML.
                enum:
                - "off"
                - flexible
                - full
                - strict
                - origin_pull
                type: string
              webmcpEnabled:
                description: |-
                  WebmcpEnabled serves the WebMCP bridge script, which exposes the page's
                  tools to browser AI agents.
                type: boolean
              webmcpPacks:
                description: |-
                  WebmcpPacks are the WebMCP tool packs to turn on for the requests the rule
                  matches, at most 100. They do not serve the bridge script itself. Unset,
                  the packs stay as they are: kflare does not send an empty list, which
                  would turn them all off.
                items:
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9._:/@-]+$
                  type: string
                maxItems: 100
                type: array
                x-kubernetes-list-type: set
              zoneRef:
                description: |-
                  ZoneRef references the Zone, in the same namespace, the rule belongs to.
                  Immutable after creation.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: zoneRef is immutable
                  rule: self == oldSelf
            required:
            - expression
            - zoneRef
            type: object
            x-kubernetes-validations:
            - message: must set at least one of automaticHTTPSRewrites, bic, contentConverter,
                disableRUM, disableZaraz, emailObfuscation, fonts, hotlinkProtection,
                opportunisticEncryption, polish, redirectsForAITraining, requestBodyBuffering,
                responseBodyBuffering, rocketLoader, securityLevel, serverSideExcludes,
                ssl, webmcpEnabled and webmcpPacks
              rule: has(self.automaticHTTPSRewrites) || has(self.bic) || has(self.contentConverter)
                || has(self.disableRUM) || has(self.disableZaraz) || has(self.emailObfuscation)
                || has(self.fonts) || has(self.hotlinkProtection) || has(self.opportunisticEncryption)
                || has(self.polish) || has(self.redirectsForAITraining) || has(self.requestBodyBuffering)
                || has(self.responseBodyBuffering) || has(self.rocketLoader) || has(self.securityLevel)
                || has(self.serverSideExcludes) || has(self.ssl) || has(self.webmcpEnabled)
                || has(self.webmcpPacks)
          status:
            description: RulesetRuleStatus is the observed state of a rule.
            properties:
              cloudflareMetadata:
                description: CloudflareMetadata identifies the rule in Cloudflare.
                properties:
                  ref:
                    description: |-
                      Ref is the rule's ref, which kflare derives from the resource's kind,
                      namespace and name. kflare finds the rule it manages by its ref.
                    type: string
                  ruleID:
                    description: RuleID is the rule's Cloudflare ID.
                    type: string
                  rulesetID:
                    description: RulesetID is the zone's entry point ruleset for the
                      rule's phase.
                    type: string
                  version:
                    description: |-
                      Version is the rule's version, which Cloudflare increments whenever the
                      rule changes.
                    type: string
                  zoneID:
                    description: ZoneID is the Cloudflare zone the rule is in.
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the rule's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
