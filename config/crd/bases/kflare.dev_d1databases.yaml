              jurisdiction:
                description: |-
                  Specify the location to restrict the D1 database to run and store data. If this
                  option is present, the location hint is ignored.
                enum:
                - eu
                - fedramp
                - us
                type: string
                x-kubernetes-validations:
                - message: jurisdiction is immutable
                  rule: self == oldSelf
              name:
                description: |-
                  Name is the database's name in Cloudflare, unique within the
                  account. It cannot change.
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              primaryLocationHint:
                description: |-
                  PrimaryLocationHint asks Cloudflare to create the database's primary
