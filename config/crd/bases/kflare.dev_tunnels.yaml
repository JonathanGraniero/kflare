---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tunnels.kflare.dev
spec:
  group: kflare.dev
  names:
    kind: Tunnel
    listKind: TunnelList
    plural: tunnels
    shortNames:
    - cftunnel
    singular: tunnel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Tunnel
      type: string
    - jsonPath: .status.cloudflareMetadata.tunnelID
      name: Tunnel ID
      type: string
    - jsonPath: .status.cloudflareMetadata.status
      name: CF Status
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Tunnel is the Schema for the tunnels API.
          It represents a remotely-managed Cloudflare Tunnel and the Secret holding
          the token a cloudflared connector needs to run it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TunnelSpec defines the desired state of Tunnel.
            properties:
              accountRef:
                description: |-
                  AccountRef references the CloudflareAccount that owns this tunnel.
                  Immutable after creation.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: accountRef is immutable
                  rule: self == oldSelf
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef names the Secret, in the Tunnel's namespace, that
                  receives the tunnel token under the TUNNEL_TOKEN key. kflare creates the
                  Secret and owns it, so it is deleted together with the Tunnel. An existing
                  Secret that kflare does not own is never overwritten.
                properties:
                  name:
                    description: Name of the Secret, in the same namespace as the
                      Tunnel.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              name:
                description: Name is the tunnel name in Cloudflare. Immutable after
                  creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
            required:
            - accountRef
            - credentialsSecretRef
            - name
            type: object
          status:
            description: TunnelStatus defines the observed state of Tunnel.
            properties:
              cloudflareMetadata:
                description: CloudflareMetadata holds identifiers and metadata returned
                  by the Cloudflare API.
                properties:
                  status:
                    description: |-
                      Status is the tunnel health reported by Cloudflare at the last reconcile
                      (inactive, degraded, healthy, or down).
                    type: string
                  tunnelID:
                    description: TunnelID is the Cloudflare tunnel identifier (a UUID).
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the tunnel state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsSecretName:
                description: |-
                  CredentialsSecretName is the Secret the token was last written to. When
                  spec.credentialsSecretRef changes, kflare deletes this Secret after
                  writing the new one.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
