                description: |-
                  ManagedRequestHeaders turns managed request transforms on or off, by
                  ID. A Free zone has add_client_certificate_headers,
                  add_visitor_location_headers, remove_visitor_ip_headers and
                  add_waf_credential_check_status_header. Transforms the list leaves out
                  keep their state.
