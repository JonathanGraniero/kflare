      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TunnelConfiguration is the Schema for the tunnelconfigurations API.
          It owns the complete ingress configuration of one remotely-managed Tunnel.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TunnelConfigurationSpec defines the desired state of TunnelConfiguration.
            properties:
              defaultService:
                default: http_status:404
                description: |-
                  DefaultService handles requests that match no ingress rule. kflare
                  appends it as the final catch-all rule that Cloudflare requires.
                minLength: 1
                type: string
              ingress:
                description: |-
                  Ingress maps public hostnames to the services cloudflared forwards them
                  to. Rules are matched in order; the first match wins.
                items:
                  description: |-
                    TunnelIngressRule routes requests for a hostname (and optionally a path) to
                    a service reachable from cloudflared.
                  properties:
                    hostname:
                      description: |-
                        Hostname to match, such as "app.example.com" or "*.example.com".
                        Requests only reach the tunnel once the hostname has a proxied CNAME
                        record pointing at <tunnelID>.cfargotunnel.com.
                      minLength: 1
                      type: string
                    originRequest:
                      description: OriginRequest tunes how cloudflared connects to
                        the service.
                      properties:
                        disableChunkedEncoding:
                          description: |-
                            DisableChunkedEncoding turns off chunked transfer encoding, which some
                            WSGI servers need.
                          type: boolean
                        http2Origin:
                          description: HTTP2Origin makes cloudflared connect to the
                            origin over HTTP/2.
                          type: boolean
                        httpHostHeader:
                          description: HTTPHostHeader overrides the Host header sent
                            to the origin.
                          type: string
                        noTLSVerify:
                          description: NoTLSVerify disables verification of the origin's
                            TLS certificate.
                          type: boolean
                        originServerName:
                          description: OriginServerName is the hostname expected on
                            the origin's TLS certificate.
                          type: string
                      type: object
                    path:
                      description: Path is a regular expression matched against the
                        request path.
                      type: string
                    service:
                      description: |-
                        Service is where cloudflared sends matching requests, for example
                        "http://my-service.my-namespace:80", "tcp://db:5432" or "http_status:404".
                      minLength: 1
                      type: string
                  required:
                  - hostname
                  - service
                  type: object
                minItems: 1
                type: array
              tunnelRef:
                description: |-
                  TunnelRef references the Tunnel, in the same namespace, whose ingress
                  rules this resource manages. Immutable after creation.
                properties:
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      TODO: Add other useful fields. apiVersion, kind, uid?
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: tunnelRef is immutable
                  rule: self == oldSelf
            required:
            - ingress
            - tunnelRef
            type: object
          status:
            description: TunnelConfigurationStatus defines the observed state of TunnelConfiguration.
            properties:
              cloudflareMetadata:
                description: CloudflareMetadata holds identifiers and metadata returned
                  by the Cloudflare API.
                properties:
                  tunnelID:
                    description: TunnelID is the Cloudflare tunnel this configuration
                      was last written to.
                    type: string
                  version:
                    description: |-
                      Version is the configuration version Cloudflare reported after the last
                      sync. cloudflared picks up each new version automatically.
                    type: integer
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the configuration state.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
