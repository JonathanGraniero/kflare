---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: transformrules.kflare.dev
spec:
  group: kflare.dev
  names:
    kind: TransformRule
    listKind: TransformRuleList
    plural: transformrules
    shortNames:
    - cftransform
    singular: transformrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .status.cloudflareMetadata.ruleID
      name: Rule ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TransformRule is the Schema for the transformrules API.
          It manages one transform rule in a zone: a rewrite of the URL a request
          reaches the origin with, or a change to its request or response headers.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TransformRuleSpec defines the desired state of TransformRule: the fields
              every rule kind shares, and the parameters of its rewrite action.
            properties:
              description:
                description: Description is shown with the rule in the Cloudflare
                  dashboard.
                maxLength: 4096
                type: string
              enabled:
                default: true
                description: Enabled turns the rule on or off without deleting it.
                type: boolean
              expression:
                description: |-
                  Expression selects the requests the rule applies to, in Cloudflare's
                  Rules language, for example `http.request.uri.path eq "/admin"`.
                  Cloudflare validates it; the fields and operators it may use depend on
                  the zone's plan.
                maxLength: 4096
                minLength: 1
                type: string
              headers:
                description: |-
                  Headers are the headers the rule changes, with types requestHeaders and
                  responseHeaders. Cloudflare allows 30 in a rule (2026-10).
                items:
                  description: TransformRuleHeader is an item of headers in a TransformRule.
                  properties:
                    expression:
                      description: |-
                        Expression computes the header's value in Cloudflare's Rules language,
                        for set and add, for example `ip.src`.
                      minLength: 1
                      type: string
                    name:
                      description: Name is the header's name.
                      minLength: 1
                      type: string
                    operation:
                      description: |-
                        Operation is what the rule does to the header: set replaces its value,
                        adding the header when the request or response has none; add adds a
                        header even when one is there, in responses only; remove removes it.
                      enum:
                      - add
                      - set
                      - remove
                      type: string
                    value:
                      description: |-
                        Value is the header's value, a static string, for set and add. Set
                        exactly one of value and expression, or neither for remove.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - operation
                  type: object
                  x-kubernetes-validations:
                  - message: 'must be one of: operation add with value; operation
                      add with expression; operation set with value; operation set
                      with expression; operation remove'
                    rule: (self.operation == 'add' && !has(self.expression) && has(self.value))
                      || (self.operation == 'add' && has(self.expression) && !has(self.value))
                      || (self.operation == 'set' && !has(self.expression) && has(self.value))
                      || (self.operation == 'set' && has(self.expression) && !has(self.value))
                      || (self.operation == 'remove' && !has(self.expression) && !has(self.value))
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              priority:
                description: |-
                  Priority orders the rules kflare manages in a zone and phase: lower runs
                  first, and rules with the same priority run in order of namespace and
                  name. Rules created outside kflare keep their place.
                format: int32
                type: integer
              type:
                description: |-
                  Type is what the rule transforms, which picks the Rulesets phase its rule
                  is in:

                    - urlRewrite: rewrites the URL's path or query, with uri (phase
                      http_request_transform)
                    - requestHeaders: sets or removes headers of the request to the origin,
                      with headers (phase http_request_late_transform)
                    - responseHeaders: adds, sets or removes headers of the response to the
                      visitor, with headers (phase http_response_headers_transform)

                  Immutable.
                enum:
                - urlRewrite
                - requestHeaders
                - responseHeaders
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
              uri:
                description: |-
                  URI rewrites the URL the request reaches the origin with: its path, its
                  query, or both, with type urlRewrite. The visitor's URL does not change.
                properties:
                  path:
                    description: |-
                      Path rewrites the URL's path, to a static value or to what an
                      expression computes.
                    properties:
                      expression:
                        description: |-
                          Expression computes the new path, for example
                          `concat("/new", http.request.uri.path)`. Free plans cannot use
                          regex_replace.
                        minLength: 1
                        type: string
                      value:
                        description: Value is the new path, which starts with a slash.
                        minLength: 1
                        pattern: ^/
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: must set exactly one of expression and value
                      rule: '(has(self.expression) ? 1 : 0) + (has(self.value) ? 1
                        : 0) == 1'
                  query:
                    description: |-
                      Query rewrites the URL's query string, to a static value or to what an
                      expression computes.
                    properties:
                      expression:
                        description: Expression computes the new query string.
                        minLength: 1
                        type: string
                      value:
                        description: |-
                          Value is the new query string, without its question mark. An empty one
                          removes the query string.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: must set exactly one of expression and value
                      rule: '(has(self.expression) ? 1 : 0) + (has(self.value) ? 1
                        : 0) == 1'
                type: object
                x-kubernetes-validations:
                - message: must set at least one of path and query
                  rule: has(self.path) || has(self.query)
              zoneRef:
                description: |-
                  ZoneRef references the Zone, in the same namespace, the rule belongs to.
                  Immutable after creation.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: zoneRef is immutable
                  rule: self == oldSelf
            required:
            - expression
            - type
            - zoneRef
            type: object
            x-kubernetes-validations:
            - message: must set at least one of headers and uri
              rule: has(self.headers) || has(self.uri)
            - message: type urlRewrite takes uri and no headers
              rule: self.type != 'urlRewrite' || (has(self.uri) && !has(self.headers))
            - message: types requestHeaders and responseHeaders take headers and no
                uri
              rule: self.type == 'urlRewrite' || (has(self.headers) && !has(self.uri))
            - message: operation add is for response headers only
              rule: self.type != 'requestHeaders' || !has(self.headers) || self.headers.all(h,
                h.operation != 'add')
          status:
            description: RulesetRuleStatus is the observed state of a rule.
            properties:
              cloudflareMetadata:
                description: CloudflareMetadata identifies the rule in Cloudflare.
                properties:
                  ref:
                    description: |-
                      Ref is the rule's ref, which kflare derives from the resource's kind,
                      namespace and name. kflare finds the rule it manages by its ref.
                    type: string
                  ruleID:
                    description: RuleID is the rule's Cloudflare ID.
                    type: string
                  rulesetID:
                    description: RulesetID is the zone's entry point ruleset for the
                      rule's phase.
                    type: string
                  version:
                    description: |-
                      Version is the rule's version, which Cloudflare increments whenever the
                      rule changes.
                    type: string
                  zoneID:
                    description: ZoneID is the Cloudflare zone the rule is in.
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the rule's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
