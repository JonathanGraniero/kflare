# golangci-lint v2 configuration (see GOLANGCI_LINT_VERSION in the Makefile).
version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck # includes the former gosimple and stylecheck
    - unconvert
    - unparam
    - unused
  exclusions:
    generated: lax
    rules:
      - path: api/*
        linters:
          - lll
      - path: internal/*
        linters:
          - dupl
          - lll
      # Repeated literals in test fixtures read better inline than as constants.
      - path: _test\.go
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
