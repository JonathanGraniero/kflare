# The kinds kflare-gen generates, one entry each; `make codegen` writes their API types
# (api/v1alpha1/zz_generated.<kind>_types.go), controllers and envtest tables
# (internal/controller/zz_generated.<kind>.go and _test.go), samples and registration. Every field of a kind's
# cloudflare-go v7 service (the params of New and the object Get returns) becomes a field of the kind unless the entry
# ignores it, with the reason. Field names are the API's, as in the SDK's json, path and query tags. Lengths, patterns,
# ranges, defaults, integers and page sizes come from the OpenAPI subset in generator/openapi; an entry that replaces a
# field's validation says why. See CLAUDE.md, "Code generator (kflare-gen)".
kinds:
  - kind: KVNamespace
    service: kv.NamespaceService
    scope: account
    shortName: cfkv
    noun: KV namespace
    doc: |
      KVNamespace is the Schema for the kvnamespaces API.
      It represents a Cloudflare Workers KV namespace. Deleting it deletes the
      namespace and all of its data, unless the retain deletion policy is set.
    id:
      field: id
      status: namespaceID
      doc: |
        NamespaceID is the Cloudflare KV namespace identifier. WorkerScripts
        bind the namespace by this ID.
    claimLabel: kflare.dev/kv-namespace-id
    adopt:
      by: title
    dependents:
      - kind: WorkerScript
        refs: boundKVNamespaces
        reason: >-
          Cloudflare deletes a namespace a Worker is bound to, but every later upload of that Worker then fails.
    sample:
      title: example-kv
    fields:
      title:
        doc: |
          Title is the namespace's title in Cloudflare, unique within the
          account. Changing it renames the namespace in place; its ID and data
          are kept.
        printColumn: Title
        validation:
          minLength: 1
          maxLength: 512
          reason: >-
            The spec gives no minimum, and Cloudflare refuses an empty title (10019, "title is required"; verified live
            2026-10-14).
    ignore:
      jurisdiction: Not sent by the controller, and restricting a namespace to a jurisdiction is not verified live yet.
      supports_url_encoding: Not observed by the controller yet.

  - kind: D1Database
    service: d1.DatabaseService
    scope: account
    shortName: cfd1
    noun: D1 database
    doc: |
      D1Database is the Schema for the d1databases API.
      It represents a Cloudflare D1 database. Deleting it deletes the
      database and all of its data, unless the retain deletion policy is set.
    id:
      field: uuid
      status: databaseID
      doc: |
        DatabaseID is the D1 database's identifier, which a Worker's D1
        binding names.
    claimLabel: kflare.dev/d1-database-id
    adopt:
      by: name
    sample:
      name: example-db
    fields:
      name:
        doc: |
          Name is the database's name in Cloudflare, unique within the
          account. It cannot change.
        printColumn: Name
      primary_location_hint:
        doc: |
          PrimaryLocationHint asks Cloudflare to create the database's primary
          in this region, if it is available there; without it, Cloudflare
          picks a region close to kflare's manager. Cloudflare does not report
          it back, so it takes effect only when kflare creates the database.
      version:
        doc: |
          Version is the D1 backend the database runs on, such as production.
    ignore:
      read_replication: >-
        A nested object, which kflare-gen cannot map yet. A new database has read replication disabled (verified live
        2026-10-15).
      created_at: A time, which kflare-gen cannot map yet.
      file_size: A number in the OpenAPI spec, not an integer.
      num_tables: Deprecated in cloudflare-go v7, which says the count is no longer accurate.

# The rule kinds kflare-gen generates: each resource manages one rule in a zone's entry point ruleset for a Rulesets
# phase, through the shared rule controller (internal/controller/rulesetrule_controller.go). A rule kind's spec holds
# the fields every rule kind shares (RulesetRuleSpec) and the parameters of its action, which kflare-gen builds from
# cloudflare-go v7's rule type for the action and the rule's OpenAPI schema; field paths are the API's names, with []
# for the items of a list or map. Each entry rule says what Cloudflare refuses, and gives a spec it refuses.
ruleKinds:
  - kind: CacheRule
    rule: rulesets.SetCacheSettingsRuleParam
    shortName: cfcache
    noun: cache rule
    doc: |
      CacheRule is the Schema for the cacherules API.
      It manages one cache rule in a zone: how Cloudflare caches the responses
      to the requests its expression matches, at the edge and in browsers.
    phase: http_request_cache_settings
    samples:
      - expression: 'http.request.uri.path.extension in {"css" "js" "png" "jpg" "svg" "woff2"}'
        description: Cache static assets, whose names carry their version, for a day
        cache: true
        edgeTTL:
          mode: override_origin
          default: 86400
          statusCodeTTL:
            - statusCode: 404
              value: 60
            - statusCodeRange:
                from: 500
              value: 0
        browserTTL:
          mode: override_origin
          default: 3600
        cacheKey:
          customKey:
            queryString:
              exclude:
                all: true
        vary:
          default:
            action: passthrough
          headers:
            - name: accept
              action: normalize
              mediaTypes: [image/avif, image/webp]
    tests:
      - expression: 'starts_with(http.request.uri.path, "/media/")'
        description: The settings the sample leaves out
        cache: false
        edgeTTL:
          mode: bypass_by_default
        browserTTL:
          mode: bypass
        cacheKey:
          cacheByDeviceType: true
          cacheDeceptionArmor: true
          ignoreQueryStringsOrder: true
        cacheReserve:
          eligible: true
          minimumFileSize: 1024
        originCacheControl: true
        originErrorPagePassthru: true
        respectStrongEtags: true
        serveStale:
          disableStaleWhileUpdating: true
        additionalCacheablePorts: [8443, 8080]
        originRangeRequests:
          mode: 'on'
        vary:
          default:
            action: normalize
          headers:
            - name: accept-language
              action: passthrough
              languages: [fr, en]
      - expression: 'starts_with(http.request.uri.path, "/archive/")'
        cacheReserve:
          eligible: false
    fields:
      cache:
        doc: |
          Cache makes the response eligible for Cloudflare's cache. Whether it is
          cached still depends on its cache control headers and the zone's other
          cache settings.
      browser_ttl:
        doc: |
          BrowserTTL is how long browsers cache the response. A purge does not
          reach browsers, so a long one can leave them with stale content.
        rules:
          - rule: "(self.mode == 'override_origin') == has(self.default)"
            message: set default with mode override_origin, and only with it
            reason: >-
              Cloudflare refuses override_origin without a default, and a default in another mode (20108), verified
              live on 2026-10-16.
            invalid:
              expression: 'true'
              browserTTL:
                mode: respect_origin
                default: 60
      browser_ttl.mode:
        doc: |
          Mode is where the browser TTL comes from: respect_origin keeps the
          origin's, override_origin sets default's, bypass_by_default bypasses
          the browser cache unless the origin says otherwise, and bypass always
          bypasses it.
      browser_ttl.default:
        doc: Default is the browser TTL, in seconds, with mode override_origin.
      edge_ttl:
        doc: |
          EdgeTTL is how long Cloudflare's edge caches the response.
        rules:
          - rule: "(self.mode == 'override_origin') == has(self.default)"
            message: set default with mode override_origin, and only with it
            reason: >-
              Cloudflare refuses override_origin without a default, and a default in another mode (20107), verified
              live on 2026-10-16.
            invalid:
              expression: 'true'
              edgeTTL:
                mode: override_origin
      edge_ttl.mode:
        doc: |
          Mode is where the edge TTL comes from: respect_origin keeps the
          origin's, override_origin sets default's, and bypass_by_default does
          not cache unless the origin says otherwise.
      edge_ttl.default:
        doc: Default is the edge TTL, in seconds, with mode override_origin.
      edge_ttl.status_code_ttl:
        doc: |
          StatusCodeTTL sets the edge TTL of responses by their status code,
          each item for one code or a range of them. Cloudflare refuses ranges
          that overlap.
      edge_ttl.status_code_ttl[].value:
        doc: |
          Value is the TTL, in seconds: 0 for no-cache, -1 for no-store.
      edge_ttl.status_code_ttl[].status_code_range:
        doc: |
          StatusCodeRange is the range of status codes the TTL is for: from
          and to, each optional, a range without one is open on that side.
        rules:
          - rule: '!has(self.from) || !has(self.to) || self.from < self.to'
            message: from is below to
            reason: Cloudflare refuses a range whose from is not below its to (20110), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              edgeTTL:
                mode: respect_origin
                statusCodeTTL:
                  - statusCodeRange:
                      from: 500
                      to: 500
                    value: 1
      cache_key.custom_key:
        doc: |
          CustomKey changes the request's parts the cache key holds. Free
          plans may only leave out the query string.
        rules:
          - rule: has(self.queryString)
            message: customKey sets queryString
            reason: >-
              Cloudflare refuses an empty custom key ("not entitled to use the custom cache key override", verified
              live on 2026-10-16), and kflare leaves out its other parts.
            invalid:
              expression: 'true'
              cacheKey:
                customKey: {}
      cache_key.custom_key.query_string:
        doc: QueryString leaves the query string out of the cache key.
        rules:
          - rule: has(self.exclude)
            message: queryString sets exclude
            reason: >-
              Cloudflare refuses an empty query string key ("not entitled to use the custom cache key override",
              verified live on 2026-10-16), and kflare leaves out include.
            invalid:
              expression: 'true'
              cacheKey:
                customKey:
                  queryString: {}
      cache_key.custom_key.query_string.exclude.all:
        doc: All leaves every query string parameter out of the cache key.
      origin_range_requests.mode:
        doc: |
          Mode is whether Cloudflare fetches a large asset from the origin in
          ranges: on, off, or default, the zone's behavior without the rule.
          Quote on and off in YAML, which would read them as booleans.
      cache_reserve:
        doc: |
          CacheReserve makes the response eligible for Cache Reserve, which
          needs the Cache Reserve add-on to take effect; Free zones accept and
          store it.
        rules:
          - rule: self.eligible || !has(self.minimumFileSize)
            message: minimumFileSize needs eligible
            reason: Cloudflare refuses a minimum file size without eligible (20197), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              cacheReserve:
                eligible: false
                minimumFileSize: 1024
      origin_cache_control:
        doc: |
          OriginCacheControl makes Cloudflare follow RFC 7234 strictly.
          Cloudflare's documentation lists it for Enterprise plans; Free zones
          accept and store it.
      additional_cacheable_ports:
        doc: |
          AdditionalCacheablePorts are more ports Cloudflare caches responses
          on. Cloudflare's documentation lists them for Enterprise plans; Free
          zones accept and store them.
      vary:
        doc: |
          Vary is how a response's Vary header shapes the cache key: default for
          every header, and headers for some of them.
        rules:
          - rule: '!has(self.headers) || has(self.default)'
            message: headers need a default
            reason: Cloudflare refuses headers without a default (20289), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              vary:
                headers:
                  - name: accept
                    action: normalize
      vary.headers:
        key: name
        keyDoc: Name is the request header's name, in lower case.
        keyValidation:
          minLength: 1
          pattern: ^[^A-Z]+$
          reason: Cloudflare refuses a header name with a capital (20289), verified live on 2026-10-16.
        doc: |
          Headers are what the cache key takes from some request headers, at
          most 50.
      vary.headers[]:
        rules:
          - rule: "!has(self.languages) || self.name == 'accept-language'"
            message: languages are for the accept-language header only
            reason: Cloudflare refuses languages on another header (20289), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              vary:
                default:
                  action: normalize
                headers:
                  - name: accept
                    action: normalize
                    languages: [en]
          - rule: "!has(self.mediaTypes) || self.name == 'accept'"
            message: mediaTypes are for the accept header only
            reason: Cloudflare refuses media types on another header (20289), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              vary:
                default:
                  action: normalize
                headers:
                  - name: x-example
                    action: normalize
                    mediaTypes: [image/webp]
    ignore:
      read_timeout: >-
        Free plans are not entitled to an extended read timeout (verified live on 2026-10-16); add it once a plan that
        is can check it.
      shared_dictionary: >-
        Free plans are not entitled to shared dictionaries (verified live on 2026-10-16); add it once a plan that is
        can check it.
      strip_etags: Cloudflare refuses it in http_request_cache_settings (20250), verified live on 2026-10-16.
      strip_last_modified: Cloudflare refuses it in http_request_cache_settings (20250), verified live on 2026-10-16.
      strip_set_cookie: Cloudflare refuses it in http_request_cache_settings (20250), verified live on 2026-10-16.
      cache_key.custom_key.cookie: &customKey >-
        Free plans may only leave the whole query string out of a custom cache key (verified live on 2026-10-16); add
        it once a plan that may can check it.
      cache_key.custom_key.header: *customKey
      cache_key.custom_key.host: *customKey
      cache_key.custom_key.user: *customKey
      cache_key.custom_key.query_string.include: *customKey
      cache_key.custom_key.query_string.exclude.list: *customKey
      logging: Only skip rules log (20018 on a cache rule, verified live on 2026-10-16).
      ratelimit: Rate limits are refused in http_request_cache_settings (20131, verified live on 2026-10-16).
      exposed_credential_check: Refused in http_request_cache_settings (20189, verified live on 2026-10-16).
  - kind: ConfigurationRule
    rule: rulesets.SetConfigRuleParam
    shortName: cfconfig
    noun: configuration rule
    doc: |
      ConfigurationRule is the Schema for the configurationrules API.
      It manages one configuration rule in a zone: settings, such as the SSL
      mode or the security level, changed for the requests its expression
      matches.
    phase: http_config_settings
    samples:
      - expression: 'starts_with(http.request.uri.path, "/admin/")'
        description: Challenge more readily, and leave scripts alone, on the admin pages
        securityLevel: high
        bic: true
        rocketLoader: false
        ssl: strict
    tests:
      - expression: 'starts_with(http.request.uri.path, "/static/")'
        description: The settings the sample leaves out
        automaticHTTPSRewrites: true
        emailObfuscation: true
        fonts: true
        hotlinkProtection: true
        opportunisticEncryption: false
        serverSideExcludes: true
        webmcpEnabled: true
        webmcpPacks: [mcp-server-client, c2pa]
        contentConverter: false
        redirectsForAITraining: false
        disableRUM: true
        disableZaraz: true
        polish: 'off'
        requestBodyBuffering: full
        responseBodyBuffering: standard
    fields:
      automatic_https_rewrites:
        doc: AutomaticHTTPSRewrites rewrites links to HTTP URLs in HTML responses to HTTPS.
      bic:
        doc: |
          BIC turns Browser Integrity Check on or off: it challenges requests whose
          headers spammers and bots commonly abuse.
      content_converter:
        doc: |
          ContentConverter converts content, such as HTML to Markdown, for the
          clients that ask for it. Free plans may only turn it off.
      disable_rum:
        doc: DisableRUM turns Real User Monitoring off. It takes only true.
      disable_zaraz:
        doc: DisableZaraz turns Zaraz off. It takes only true.
      email_obfuscation:
        doc: EmailObfuscation hides the email addresses in HTML responses from bots.
      fonts:
        doc: Fonts serves the page's Google Fonts from Cloudflare (Cloudflare Fonts).
      hotlink_protection:
        doc: HotlinkProtection stops other sites from embedding the zone's images.
      opportunistic_encryption:
        doc: |
          OpportunisticEncryption lets browsers fetch HTTP URLs over an encrypted
          connection.
      polish:
        doc: |
          Polish is how Cloudflare optimizes images: off, lossless, lossy or webp.
          Free plans may only turn it off; quote off in YAML, which would read it
          as a boolean.
      redirects_for_ai_training:
        doc: |
          RedirectsForAITraining redirects verified AI training crawlers to the
          canonical URLs the HTML response names. Free plans may only turn it off.
      request_body_buffering:
        doc: |
          RequestBodyBuffering is how much of a request's body Cloudflare buffers
          before the origin gets it: none, standard or full.
      response_body_buffering:
        doc: |
          ResponseBodyBuffering is how much of a response's body Cloudflare buffers:
          none or standard.
      rocket_loader:
        doc: RocketLoader loads the page's JavaScript without blocking its rendering.
      security_level:
        doc: |
          SecurityLevel is how readily Cloudflare challenges visitors by their IP
          address's reputation, from essentially_off to under_attack. Free plans
          may not turn it off.
      server_side_excludes:
        doc: |
          ServerSideExcludes hides the content an HTML response marks with SSE tags
          from suspicious visitors.
      ssl:
        doc: |
          SSL is how Cloudflare connects to the origin: off, flexible (HTTP), full
          (HTTPS, any certificate), strict (HTTPS, a valid certificate) or
          origin_pull. Free plans may not use origin_pull; quote off in YAML.
      webmcp_enabled:
        doc: |
          WebmcpEnabled serves the WebMCP bridge script, which exposes the page's
          tools to browser AI agents.
      webmcp_packs:
        doc: |
          WebmcpPacks are the WebMCP tool packs to turn on for the requests the rule
          matches, at most 100. They do not serve the bridge script itself. Unset,
          the packs stay as they are: kflare does not send an empty list, which
          would turn them all off.
    ignore:
      autominify: >-
        Cloudflare retired Auto Minify in August 2024, per its documentation; the API still accepts the setting.
      disable_apps: >-
        Cloudflare Apps are deprecated, and Cloudflare refuses the setting (20251; false: 20114), verified live on
        2026-10-17.
      disable_pay_per_crawl: >-
        Free plans are not entitled to it, and it takes only true (20114), verified live on 2026-10-17; add it once a
        plan that is can check it.
      mirage: Mirage is deprecated, and Free plans are not entitled to it (verified live on 2026-10-17).
      sxg: >-
        Signed Exchanges are deprecated, and Cloudflare refuses the setting either way (20259), verified live on
        2026-10-17.
      logging: Only skip rules log (20018 on a configuration rule, verified live on 2026-10-17).
      ratelimit: Rate limits are refused in http_config_settings (20131, verified live on 2026-10-17).
      exposed_credential_check: Refused in http_config_settings (20189, verified live on 2026-10-17).
  - kind: OriginRule
    rule: rulesets.RouteRuleParam
    shortName: cforigin
    noun: origin rule
    doc: |
      OriginRule is the Schema for the originrules API.
      It manages one origin rule in a zone: the requests its expression
      matches reach the origin on another destination port.
    phase: http_request_origin
    samples:
      - expression: 'starts_with(http.request.uri.path, "/api/")'
        description: Send API requests to the origin's port 8443
        origin:
          port: 8443
    fields:
      origin:
        doc: |
          Origin is where Cloudflare sends the requests the rule matches. Free
          plans may only change the destination port.
      origin.port:
        doc: |
          Port is the destination port Cloudflare connects to the origin on,
          from 1 to 65535, in place of the request's own.
    ignore:
      host_header: &enterprise >-
        Free plans are not entitled to Host header, origin host (DNS record) or SNI overrides, which Cloudflare's
        documentation lists for Enterprise plans (verified live on 2026-10-18); add them once a plan that is can check
        them.
      origin.host: *enterprise
      sni: *enterprise
      logging: Only skip rules log (20018 on an origin rule, verified live on 2026-10-18).
      ratelimit: Rate limits are refused in http_request_origin (20131, verified live on 2026-10-18).
      exposed_credential_check: Refused in http_request_origin (20189, verified live on 2026-10-18).
  - kind: RedirectRule
    rule: rulesets.RedirectRuleParam
    shortName: cfredirect
    noun: redirect rule
    doc: |
      RedirectRule is the Schema for the redirectrules API.
      It manages one single redirect in a zone: Cloudflare answers the requests
      its expression matches with a redirect to a URL, a static one or one an
      expression computes.
    phase: http_request_dynamic_redirect
    samples:
      - expression: 'http.host eq "www.example.com"'
        description: Send www.example.com to example.com, keeping the path and query
        fromValue:
          targetURL:
            expression: 'concat("https://example.com", http.request.uri.path)'
          statusCode: 301
          preserveQueryString: true
    fields:
      from_value:
        doc: |
          FromValue redirects the requests the rule matches to a URL: targetURL's,
          with statusCode.
      from_value.target_url:
        doc: |
          TargetURL is the URL requests are redirected to: a static value, or what
          an expression computes for each request.
      from_value.target_url.value:
        doc: |
          Value is a static URL, such as `https://example.com/new`. Cloudflare
          takes it as given, a relative URL too.
      from_value.target_url.expression:
        doc: |
          Expression computes the URL in Cloudflare's Rules language, such as
          `concat("https://example.com", http.request.uri.path)`. Free plans
          cannot use regex_replace; wildcard_replace works on every plan.
      from_value.status_code:
        doc: |
          StatusCode is the redirect's status: 301 or 308 for a permanent
          redirect, 302, 303 or 307 for a temporary one. Unset, Cloudflare
          redirects with 301.
      from_value.preserve_query_string:
        doc: |
          PreserveQueryString keeps the request's query string on the URL
          redirected to. Unset, the query string is dropped.
    ignore:
      from_list: >-
        Bulk Redirects look requests up in a redirect list, in the account-level http_request_redirect phase; Cloudflare
        refuses from_list in http_request_dynamic_redirect (20080), verified live on 2026-10-15.
      logging: Only skip rules log (20018 on a redirect rule, verified live on 2026-10-15).
      ratelimit: Rate limits are refused in http_request_dynamic_redirect (20131, verified live on 2026-10-15).
      exposed_credential_check: Refused in http_request_dynamic_redirect (20189, verified live on 2026-10-15).
  - kind: TransformRule
    rule: rulesets.RewriteRuleParam
    shortName: cftransform
    noun: transform rule
    doc: |
      TransformRule is the Schema for the transformrules API.
      It manages one transform rule in a zone: a rewrite of the URL a request
      reaches the origin with, or a change to its request or response headers.
    typeDoc: |
      Type is what the rule transforms, which picks the Rulesets phase its rule
      is in:
    types:
      - name: urlRewrite
        phase: http_request_transform
        doc: rewrites the URL's path or query, with uri
      - name: requestHeaders
        phase: http_request_late_transform
        doc: sets or removes headers of the request to the origin, with headers
      - name: responseHeaders
        phase: http_response_headers_transform
        doc: adds, sets or removes headers of the response to the visitor, with headers
    samples:
      - type: urlRewrite
        expression: 'http.request.uri.path eq "/old"'
        description: Serve /old from /new
        uri:
          path:
            value: /new
      - type: requestHeaders
        expression: 'starts_with(http.request.uri.path, "/api/")'
        description: Tell the origin which country a request comes from
        headers:
          - name: x-visitor-country
            operation: set
            expression: ip.src.country
      - type: responseHeaders
        expression: 'true'
        description: Keep pages out of frames and stop revealing the server's stack
        headers:
          - name: x-frame-options
            operation: set
            value: DENY
          - name: x-powered-by
            operation: remove
    fields:
      headers:
        key: name
        keyDoc: Name is the header's name.
        doc: |
          Headers are the headers the rule changes, with types requestHeaders and
          responseHeaders. Cloudflare allows 30 in a rule (2026-10).
      headers[].operation:
        doc: |
          Operation is what the rule does to the header: set replaces its value,
          adding the header when the request or response has none; add adds a
          header even when one is there, in responses only; remove removes it.
      headers[].value:
        doc: |
          Value is the header's value, a static string, for set and add. Set
          exactly one of value and expression, or neither for remove.
      headers[].expression:
        doc: |
          Expression computes the header's value in Cloudflare's Rules language,
          for set and add, for example `ip.src`.
      uri:
        doc: |
          URI rewrites the URL the request reaches the origin with: its path, its
          query, or both, with type urlRewrite. The visitor's URL does not change.
      uri.path:
        doc: |
          Path rewrites the URL's path, to a static value or to what an
          expression computes.
      uri.path.value:
        doc: Value is the new path, which starts with a slash.
        validation:
          minLength: 1
          pattern: ^/
          reason: Cloudflare refuses a path that does not start with a slash (20089), verified live on 2026-10-15.
      uri.path.expression:
        doc: |
          Expression computes the new path, for example
          `concat("/new", http.request.uri.path)`. Free plans cannot use
          regex_replace.
      uri.query:
        doc: |
          Query rewrites the URL's query string, to a static value or to what an
          expression computes.
      uri.query.value:
        doc: |
          Value is the new query string, without its question mark. An empty one
          removes the query string.
      uri.query.expression:
        doc: Expression computes the new query string.
    rules:
      - rule: "self.type != 'urlRewrite' || (has(self.uri) && !has(self.headers))"
        message: type urlRewrite takes uri and no headers
        reason: Cloudflare refuses header rewrites in http_request_transform (20086), verified live on 2026-10-15.
        invalid:
          type: urlRewrite
          expression: 'true'
          headers:
            - name: x-example
              operation: set
              value: '1'
      - rule: "self.type == 'urlRewrite' || (has(self.headers) && !has(self.uri))"
        message: types requestHeaders and responseHeaders take headers and no uri
        reason: Cloudflare refuses URI rewrites in the header phases (20088), verified live on 2026-10-15.
        invalid:
          type: responseHeaders
          expression: 'true'
          uri:
            path:
              value: /new
      - rule: "self.type != 'requestHeaders' || !has(self.headers) || self.headers.all(h, h.operation != 'add')"
        message: operation add is for response headers only
        reason: Cloudflare refuses add on a request header (20087), verified live on 2026-10-15.
        invalid:
          type: requestHeaders
          expression: 'true'
          headers:
            - name: x-example
              operation: add
              value: '1'
    ignore:
      logging: Only skip rules log (20018 on a transform rule, verified live on 2026-10-15).
      ratelimit: Rate limits are refused in the transform phases (20131, verified live on 2026-10-15).
      exposed_credential_check: Refused in the transform phases (20189, verified live on 2026-10-15).
