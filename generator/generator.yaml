# The kinds kflare-gen generates, one entry each; `make codegen` writes their API types
# (api/v1alpha1/zz_generated.<kind>_types.go), controllers and envtest tables
# (internal/controller/zz_generated.<kind>.go and _test.go), samples and registration. Every field of a kind's
# cloudflare-go v7 service (the params of New and the object Get returns) becomes a field of the kind unless the entry
# ignores it, with the reason. Field names are the API's, as in the SDK's json, path and query tags. Lengths, patterns,
# ranges, defaults, integers and page sizes come from the OpenAPI subset in generator/openapi; an entry that replaces a
# field's validation says why. See CLAUDE.md, "Code generator (kflare-gen)".
kinds:
  - kind: KVNamespace
    service: kv.NamespaceService
    scope: account
    shortName: cfkv
    noun: KV namespace
    doc: |
      KVNamespace is the Schema for the kvnamespaces API.
      It represents a Cloudflare Workers KV namespace. Deleting it deletes the
      namespace and all of its data, unless the retain deletion policy is set.
    id:
      field: id
      status: namespaceID
      doc: |
        NamespaceID is the Cloudflare KV namespace identifier. WorkerScripts
        bind the namespace by this ID.
    claimLabel: kflare.dev/kv-namespace-id
    adopt:
      by: title
    dependents:
      - kind: WorkerScript
        refs: boundKVNamespaces
        reason: >-
          Cloudflare deletes a namespace a Worker is bound to, but every later upload of that Worker then fails.
    sample:
      title: example-kv
    fields:
      title:
        doc: |
          Title is the namespace's title in Cloudflare, unique within the
          account. Changing it renames the namespace in place; its ID and data
          are kept.
        printColumn: Title
        validation:
          minLength: 1
          maxLength: 512
          reason: >-
            The spec gives no minimum, and Cloudflare refuses an empty title (10019, "title is required"; verified live
            2026-10-14).
    ignore:
      jurisdiction: Not sent by the controller, and restricting a namespace to a jurisdiction is not verified live yet.
      supports_url_encoding: Not observed by the controller yet.

  - kind: D1Database
    service: d1.DatabaseService
    scope: account
    shortName: cfd1
    noun: D1 database
    doc: |
      D1Database is the Schema for the d1databases API.
      It represents a Cloudflare D1 database. Deleting it deletes the
      database and all of its data, unless the retain deletion policy is set.
    id:
      field: uuid
      status: databaseID
      doc: |
        DatabaseID is the D1 database's identifier, which a Worker's D1
        binding names.
    claimLabel: kflare.dev/d1-database-id
    adopt:
      by: name
    sample:
      name: example-db
    fields:
      name:
        doc: |
          Name is the database's name in Cloudflare, unique within the
          account. It cannot change.
        printColumn: Name
      primary_location_hint:
        doc: |
          PrimaryLocationHint asks Cloudflare to create the database's primary
          in this region, if it is available there; without it, Cloudflare
          picks a region close to kflare's manager. Cloudflare does not report
          it back, so it takes effect only when kflare creates the database.
      version:
        doc: |
          Version is the D1 backend the database runs on, such as production.
    ignore:
      read_replication: >-
        A nested object, which kflare-gen cannot map yet. A new database has read replication disabled (verified live
        2026-10-15).
      created_at: A time, which kflare-gen cannot map yet.
      file_size: A number in the OpenAPI spec, not an integer.
      num_tables: Deprecated in cloudflare-go v7, which says the count is no longer accurate.

# The rule kinds kflare-gen generates: each resource manages one rule in a zone's entry point ruleset for a Rulesets
# phase, through the shared rule controller (internal/controller/rulesetrule_controller.go). A rule kind's spec holds
# the fields every rule kind shares (RulesetRuleSpec) and the parameters of its action, which kflare-gen builds from
# cloudflare-go v7's rule type for the action and the rule's OpenAPI schema; field paths are the API's names, with []
# for the items of a list or map. Each entry rule says what Cloudflare refuses, and gives a spec it refuses.
ruleKinds:
  - kind: RedirectRule
    rule: rulesets.RedirectRuleParam
    shortName: cfredirect
    noun: redirect rule
    doc: |
      RedirectRule is the Schema for the redirectrules API.
      It manages one single redirect in a zone: Cloudflare answers the requests
      its expression matches with a redirect to a URL, a static one or one an
      expression computes.
    phase: http_request_dynamic_redirect
    samples:
      - expression: 'http.host eq "www.example.com"'
        description: Send www.example.com to example.com, keeping the path and query
        fromValue:
          targetURL:
            expression: 'concat("https://example.com", http.request.uri.path)'
          statusCode: 301
          preserveQueryString: true
    fields:
      from_value:
        doc: |
          FromValue redirects the requests the rule matches to a URL: targetURL's,
          with statusCode.
      from_value.target_url:
        doc: |
          TargetURL is the URL requests are redirected to: a static value, or what
          an expression computes for each request.
      from_value.target_url.value:
        doc: |
          Value is a static URL, such as `https://example.com/new`. Cloudflare
          takes it as given, a relative URL too.
      from_value.target_url.expression:
        doc: |
          Expression computes the URL in Cloudflare's Rules language, such as
          `concat("https://example.com", http.request.uri.path)`. Free plans
          cannot use regex_replace; wildcard_replace works on every plan.
      from_value.status_code:
        doc: |
          StatusCode is the redirect's status: 301 or 308 for a permanent
          redirect, 302, 303 or 307 for a temporary one. Unset, Cloudflare
          redirects with 301.
      from_value.preserve_query_string:
        doc: |
          PreserveQueryString keeps the request's query string on the URL
          redirected to. Unset, the query string is dropped.
    ignore:
      from_list: >-
        Bulk Redirects look requests up in a redirect list, in the account-level http_request_redirect phase; Cloudflare
        refuses from_list in http_request_dynamic_redirect (20080), verified live on 2026-10-15.
      logging: Only skip rules log (20018 on a redirect rule, verified live on 2026-10-15).
      ratelimit: Rate limits are refused in http_request_dynamic_redirect (20131, verified live on 2026-10-15).
      exposed_credential_check: Refused in http_request_dynamic_redirect (20189, verified live on 2026-10-15).
  - kind: TransformRule
    rule: rulesets.RewriteRuleParam
    shortName: cftransform
    noun: transform rule
    doc: |
      TransformRule is the Schema for the transformrules API.
      It manages one transform rule in a zone: a rewrite of the URL a request
      reaches the origin with, or a change to its request or response headers.
    typeDoc: |
      Type is what the rule transforms, which picks the Rulesets phase its rule
      is in:
    types:
      - name: urlRewrite
        phase: http_request_transform
        doc: rewrites the URL's path or query, with uri
      - name: requestHeaders
        phase: http_request_late_transform
        doc: sets or removes headers of the request to the origin, with headers
      - name: responseHeaders
        phase: http_response_headers_transform
        doc: adds, sets or removes headers of the response to the visitor, with headers
    samples:
      - type: urlRewrite
        expression: 'http.request.uri.path eq "/old"'
        description: Serve /old from /new
        uri:
          path:
            value: /new
      - type: requestHeaders
        expression: 'starts_with(http.request.uri.path, "/api/")'
        description: Tell the origin which country a request comes from
        headers:
          - name: x-visitor-country
            operation: set
            expression: ip.src.country
      - type: responseHeaders
        expression: 'true'
        description: Keep pages out of frames and stop revealing the server's stack
        headers:
          - name: x-frame-options
            operation: set
            value: DENY
          - name: x-powered-by
            operation: remove
    fields:
      headers:
        key: name
        keyDoc: Name is the header's name.
        doc: |
          Headers are the headers the rule changes, with types requestHeaders and
          responseHeaders. Cloudflare allows 30 in a rule (2026-10).
      headers[].operation:
        doc: |
          Operation is what the rule does to the header: set replaces its value,
          adding the header when the request or response has none; add adds a
          header even when one is there, in responses only; remove removes it.
      headers[].value:
        doc: |
          Value is the header's value, a static string, for set and add. Set
          exactly one of value and expression, or neither for remove.
      headers[].expression:
        doc: |
          Expression computes the header's value in Cloudflare's Rules language,
          for set and add, for example `ip.src`.
      uri:
        doc: |
          URI rewrites the URL the request reaches the origin with: its path, its
          query, or both, with type urlRewrite. The visitor's URL does not change.
      uri.path:
        doc: |
          Path rewrites the URL's path, to a static value or to what an
          expression computes.
      uri.path.value:
        doc: Value is the new path, which starts with a slash.
        validation:
          minLength: 1
          pattern: ^/
          reason: Cloudflare refuses a path that does not start with a slash (20089), verified live on 2026-10-15.
      uri.path.expression:
        doc: |
          Expression computes the new path, for example
          `concat("/new", http.request.uri.path)`. Free plans cannot use
          regex_replace.
      uri.query:
        doc: |
          Query rewrites the URL's query string, to a static value or to what an
          expression computes.
      uri.query.value:
        doc: |
          Value is the new query string, without its question mark. An empty one
          removes the query string.
      uri.query.expression:
        doc: Expression computes the new query string.
    rules:
      - rule: "self.type != 'urlRewrite' || (has(self.uri) && !has(self.headers))"
        message: type urlRewrite takes uri and no headers
        reason: Cloudflare refuses header rewrites in http_request_transform (20086), verified live on 2026-10-15.
        invalid:
          type: urlRewrite
          expression: 'true'
          headers:
            - name: x-example
              operation: set
              value: '1'
      - rule: "self.type == 'urlRewrite' || (has(self.headers) && !has(self.uri))"
        message: types requestHeaders and responseHeaders take headers and no uri
        reason: Cloudflare refuses URI rewrites in the header phases (20088), verified live on 2026-10-15.
        invalid:
          type: responseHeaders
          expression: 'true'
          uri:
            path:
              value: /new
      - rule: "self.type != 'requestHeaders' || !has(self.headers) || self.headers.all(h, h.operation != 'add')"
        message: operation add is for response headers only
        reason: Cloudflare refuses add on a request header (20087), verified live on 2026-10-15.
        invalid:
          type: requestHeaders
          expression: 'true'
          headers:
            - name: x-example
              operation: add
              value: '1'
    ignore:
      logging: Only skip rules log (20018 on a transform rule, verified live on 2026-10-15).
      ratelimit: Rate limits are refused in the transform phases (20131, verified live on 2026-10-15).
      exposed_credential_check: Refused in the transform phases (20189, verified live on 2026-10-15).
