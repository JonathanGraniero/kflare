# The kinds kflare-gen generates, one entry each; `make codegen` writes their API types
# (api/v1alpha1/zz_generated.<kind>_types.go), controllers and envtest tables
# (internal/controller/zz_generated.<kind>.go and _test.go), samples and registration. Every field of a kind's
# cloudflare-go v7 service (the params of New and the object Get returns) becomes a field of the kind unless the entry
# ignores it, with the reason. Field names are the API's, as in the SDK's json, path and query tags. Lengths, patterns,
# ranges, defaults, integers and page sizes come from the OpenAPI subset in generator/openapi; an entry that replaces a
# field's validation says why. See generator/CLAUDE.md, and CLAUDE.md's "Adding a kind" for the steps.
kinds:
  - kind: KVNamespace
    service: kv.NamespaceService
    scope: account
    shortName: cfkv
    noun: KV namespace
    doc: |
      KVNamespace is the Schema for the kvnamespaces API.
      It represents a Cloudflare Workers KV namespace. Deleting it deletes the
      namespace and all of its data, unless the retain deletion policy is set.
    id:
      field: id
      status: namespaceID
      doc: |
        NamespaceID is the Cloudflare KV namespace identifier. WorkerScripts
        bind the namespace by this ID.
    claimLabel: kflare.dev/kv-namespace-id
    adopt:
      by: title
    dependents:
      - kind: WorkerScript
        refs: boundKVNamespaces
        reason: >-
          Cloudflare deletes a namespace a Worker is bound to, but every later upload of that Worker then fails.
    sample:
      title: example-kv
    fields:
      title:
        doc: |
          Title is the namespace's title in Cloudflare, unique within the
          account. Changing it renames the namespace in place; its ID and data
          are kept.
        printColumn: Title
        validation:
          minLength: 1
          maxLength: 512
          reason: >-
            The spec gives no minimum, and Cloudflare refuses an empty title (10019, "title is required"; verified live
            2026-10-14).
    ignore:
      jurisdiction: Not sent by the controller, and restricting a namespace to a jurisdiction is not verified live yet.
      mode: Not sent by the controller, and KV Instant namespaces (cloudflare-go v7.13.0) are not verified live yet.
      supports_url_encoding: Not observed by the controller yet.

  - kind: D1Database
    service: d1.DatabaseService
    scope: account
    shortName: cfd1
    noun: D1 database
    doc: |
      D1Database is the Schema for the d1databases API.
      It represents a Cloudflare D1 database. Deleting it deletes the
      database and all of its data, unless the retain deletion policy is set.
    id:
      field: uuid
      status: databaseID
      doc: |
        DatabaseID is the D1 database's identifier, which a Worker's D1
        binding names.
    claimLabel: kflare.dev/d1-database-id
    adopt:
      by: name
    sample:
      name: example-db
    fields:
      name:
        doc: |
          Name is the database's name in Cloudflare, unique within the
          account. It cannot change.
        printColumn: Name
      primary_location_hint:
        doc: |
          PrimaryLocationHint asks Cloudflare to create the database's primary
          in this region, if it is available there; without it, Cloudflare
          picks a region close to kflare's manager. Cloudflare does not report
          it back, so it takes effect only when kflare creates the database.
      version:
        doc: |
          Version is the D1 backend the database runs on, such as production.
    ignore:
      read_replication: >-
        A nested object, which kflare-gen cannot map yet. A new database has read replication disabled (verified live
        2026-10-15).
      created_at: A time, which kflare-gen cannot map yet.
      file_size: A number in the OpenAPI spec, not an integer.
      num_tables: Deprecated in cloudflare-go v7, which says the count is no longer accurate.

  - kind: R2Bucket
    service: r2.BucketService
    scope: account
    shortName: cfr2
    noun: R2 bucket
    doc: |
      R2Bucket is the Schema for the r2buckets API.
      It represents a Cloudflare R2 bucket. Deleting it deletes the bucket,
      unless the retain deletion policy is set; kflare never deletes objects,
      so a bucket that still holds any is kept and reported as BucketNotEmpty.
    id:
      field: name
      status: bucketName
      printColumn: Bucket
      doc: |
        BucketName is the name of the bucket kflare created or adopted, which
        a WorkerScript's R2 binding names.
    claimLabel: kflare.dev/r2-bucket-name
    adopt:
      by: name
    dependents:
      - kind: WorkerScript
        refs: boundR2Buckets
        reason: >-
          Cloudflare deletes a bucket a Worker is bound to, but every later upload of that Worker then fails (10085).
    deletionBlockers:
      - code: 10008
        reason: BucketNotEmpty
        message: "still holds objects, which kflare never deletes: empty it"
        why: Cloudflare refuses to delete a bucket that holds objects (409, 10008; verified live 2026-10-07).
    sample:
      name: example-bucket
    fields:
      name:
        doc: |
          Name is the bucket's name in Cloudflare, unique within the account
          and its jurisdiction: 3 to 63 lowercase letters, digits and hyphens,
          starting and ending with a letter or digit. Buckets cannot be
          renamed, so it is immutable.
        validation:
          pattern: ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$
          reason: >-
            Names are 3 to 63 characters, not up to 64 as the spec says, and the spec's pattern has no end anchor, so it
            passes a name that ends in a hyphen. Cloudflare took 63 characters and refused 64, a trailing hyphen, a
            capital and an underscore (10005; verified live 2026-10-14).
      locationHint:
        doc: |
          LocationHint asks Cloudflare to place a new bucket near a region:
          wnam, enam, weur, eeur, apac or oc. It is only a hint, and only used
          when kflare creates the bucket: an adopted bucket stays where it is,
          and so does a bucket in the eu or us jurisdiction.
          status.cloudflareMetadata.location shows where the bucket is.
          Immutable after creation.
      storageClass:
        doc: |
          StorageClass is the class of the objects uploaded to the bucket
          without one of their own: Standard, or InfrequentAccess, which costs
          less to keep and more to read. Changing it changes the bucket in
          place; the objects already in it keep their class.
      cf-r2-jurisdiction:
        reportedAs: jurisdiction
        printColumn: Jurisdiction
        doc: |
          Jurisdiction is where Cloudflare keeps the bucket's objects: default,
          or eu or us, which keep them in the European Union or the United
          States (fedramp and fedramp-high need a FedRAMP account). Each
          jurisdiction has buckets of its own, so two R2Buckets can name
          buckets with the same name in different jurisdictions. WorkerScript
          binds only buckets in the default jurisdiction. Immutable after
          creation.
      creation_date:
        doc: |
          CreationDate is when Cloudflare created the bucket. It changes if the
          bucket is deleted outside kflare and created again.
      location:
        printColumn: Location
        doc: |
          Location is the region Cloudflare placed the bucket in, for example
          WEUR.

  # Cloudflare's PUT replaces a route: without a script, it clears it (verified live 2026-10-05 and 2026-10-29).
  - kind: WorkerRoute
    service: workers.RouteService
    scope: zone
    shortName: cfroute
    noun: Worker route
    doc: |
      WorkerRoute is the Schema for the workerroutes API.
      It routes requests matching a URL pattern in a zone to a WorkerScript,
      or, without one, excludes the pattern from a broader route.
    id:
      field: id
      status: routeID
      printColumn: Route ID
      doc: RouteID is the Cloudflare route identifier.
    claimLabel: kflare.dev/route-id
    adopt:
      by: pattern
    sample:
      pattern: example.com/api/*
      script: example-worker
    fields:
      pattern:
        printColumn: Pattern
        doc: |
          Pattern selects the requests the route applies to, such as
          "example.com/api/*" or "*.example.com/*". It has no scheme or port,
          may start with "*" (any subdomain) and end with "*" (any path), and
          its hostname must be in the zone. Patterns are unique within a zone.
        validation:
          maxLength: 1024
          pattern: ^\*?[A-Za-z0-9.-]+(/\S*)?$
          reason: >-
            The spec bounds the pattern in no way. Cloudflare refuses an empty pattern, one with a port and one
            outside the zone (10022), but stores a scheme as it is given (verified live 2026-10-29), so the pattern
            keeps to a host, with an optional leading wildcard, and a path, as Cloudflare's docs write routes and as
            WorkerRoute did before kflare-gen; it needs a character of the host, so an empty pattern is refused too.
            1,024 characters is that WorkerRoute's bound.
      script:
        ref:
          kind: WorkerScript
          field: name
        printColumn: Worker
        doc: |
          WorkerScriptRef references the WorkerScript, in the same namespace
          and the zone's account, that handles matching requests. The route
          waits until the WorkerScript has uploaded its Worker: Cloudflare
          refuses a route to a Worker that does not exist (10019). Omit it to
          exclude the pattern from a broader route, so that no Worker runs for
          it.

  # Cloudflare replaces a list's items in a bulk operation of its own, which its hooks run: see iplist_hooks.go.
  - kind: IPList
    service: rules.ListService
    scope: account
    shortName: cfiplist
    noun: IP list
    doc: |
      IPList is the Schema for the iplists API.
      It manages a custom IP list in a Cloudflare account. Rule expressions in
      the account's zones refer to it as $<name>, for example
      `ip.src in $office_ips`.
    id:
      field: id
      status: listID
      printColumn: List ID
      doc: ListID is the Cloudflare list identifier.
    claimLabel: kflare.dev/ip-list-id
    adopt:
      by: name
    deletionBlockers:
      - code: 10041
        reason: ListInUse
        message: "is used by a rule: remove it from the rules' expressions"
        why: >-
          Cloudflare refuses to delete a list that a rule's expression uses (400, 10041; verified live 2026-10-13).
    sample:
      name: example_ips
      description: Addresses of example.com's offices.
    fixed:
      kind: ip
    fields:
      name:
        printColumn: Name
        doc: |
          Name is the list's name, unique in the account among lists of every
          kind: lowercase letters, digits and underscores, at most 50
          characters. Immutable, because Cloudflare cannot rename a list.
        validation:
          pattern: ^[a-z0-9_]{1,50}$
          reason: >-
            Cloudflare refuses capitals in a list name (10029; verified live 2026-10-13), which the spec's pattern
            allows.
      description:
        clearable: true
        doc: Description is shown with the list in the Cloudflare dashboard.
    ignore:
      created_on: Not observed by the controller.
      modified_on: Not observed by the controller. It changes with every replacement of the items.
      num_items: A number in the OpenAPI spec, not an integer. The hooks record the count they read, in numItems.
      num_referencing_filters: A number in the OpenAPI spec, not an integer.
    hooks:
      api: true
      specExtras: IPListSpecExtras
      metadataExtras: IPListMetadataExtras
      sampleExtras:
        items:
          - ip: 192.0.2.1
            comment: Head office
          - ip: 198.51.100.0/24
            comment: Branch office
          - ip: 2001:db8::/48
      tableExtras: {}
      columns:
        - name: Items
          type: integer
          path: .status.cloudflareMetadata.numItems

  # Cloudflare keeps a deleted tunnel readable, and a tunnel's token and connections in services of their own: see
  # tunnel_hooks.go.
  - kind: Tunnel
    service: zero_trust.TunnelCloudflaredService
    scope: account
    shortName: cftunnel
    noun: tunnel
    doc: |
      Tunnel is the Schema for the tunnels API.
      It represents a remotely-managed Cloudflare Tunnel and the Secret holding
      the token a cloudflared connector needs to run it.
    id:
      field: id
      status: tunnelID
      printColumn: Tunnel ID
      doc: TunnelID is the Cloudflare tunnel identifier (a UUID).
    claimLabel: kflare.dev/tunnel-id
    adopt:
      by: name
    dependents:
      - kind: TunnelConfiguration
        refs: configuredTunnels
        reason: >-
          A TunnelConfiguration resets the tunnel's ingress rules through its Tunnel when it is deleted.
      - kind: DNSRecord
        refs: recordTunnels
        reason: A DNSRecord that points at the tunnel would route its hostname to nothing.
    sample:
      name: example-tunnel
    fixed:
      config_src: cloudflare
    fields:
      name:
        printColumn: Tunnel
        doc: |
          Name is the tunnel's name in Cloudflare. Changing it renames the
          tunnel in place.
        validation:
          minLength: 1
          reason: The spec gives no minimum, and a tunnel without a name cannot be found to adopt.
      status:
        printColumn: CF Status
        doc: |
          Status is the tunnel health reported by Cloudflare at the last
          reconcile (inactive, degraded, healthy, or down).
    ignore:
      account_tag: The account's ID, which accountRef already gives.
      connections: Deprecated in cloudflare-go v7, which says the field will start returning an empty array.
      conns_active_at: A time, which kflare-gen cannot map yet.
      conns_inactive_at: A time, which kflare-gen cannot map yet.
      created_at: A time, which kflare-gen cannot map yet.
      deleted_at: A time, which kflare-gen cannot map yet. The hooks read it, to tell a deleted tunnel.
      metadata: Free-form, which kflare-gen cannot map.
      remote_config: Deprecated in cloudflare-go v7, in favor of config_src.
      tun_type: Always cfd_tunnel for this service.
      tunnel_secret: >-
        The password of a locally-managed tunnel. kflare's tunnels are remotely managed: cloudflared authenticates with
        the token, which the hooks write to a Secret.
    hooks:
      api: true
      specExtras: TunnelSpecExtras
      statusExtras: TunnelStatusExtras
      sampleExtras:
        credentialsSecretRef:
          name: example-tunnel-token

  # A DNS record's calls take its body as a union of its types, and a set's records share a name: see
  # dnsrecord_hooks.go. Edit, unlike Update, leaves a priority Cloudflare chose alone.
  - kind: DNSRecord
    service: dns.RecordService
    scope: zone
    shortName: cfrecord
    noun: DNS record
    doc: |
      DNSRecord is the Schema for the dnsrecords API.
      It represents a DNS record within a Cloudflare-managed zone.
    id:
      field: id
      status: recordID
      printColumn: Record ID
      doc: RecordID is the Cloudflare DNS record identifier.
    claimLabel: kflare.dev/record-id
    adopt:
      by: name
    update: Edit
    sample:
      name: www.example.com
      type: A
      content: 192.0.2.1
      comment: The web server.
    fields:
      name:
        immutable: true
        printColumn: Record Name
        doc: |
          Name is the fully-qualified DNS record name (e.g. "www.example.com").
          Immutable after creation.
        validation:
          minLength: 1
          reason: The spec's union gives no minimum, and Cloudflare refuses an empty name.
      type:
        immutable: true
        printColumn: Type
        doc: Type is the DNS record type. Immutable after creation.
      content:
        printColumn: Content
        doc: |
          Content is the DNS record content (e.g. an IP address for A records,
          a hostname for CNAME/MX). Set exactly one of content, data and
          tunnelRef: record types such as SRV, LOC and CAA use data instead.
        validation:
          minLength: 1
          reason: The spec's union gives no minimum, and a record's content is never empty.
      comment:
        clearable: true
        doc: Comment is an optional free-text annotation for the record.
      proxiable:
        doc: Proxiable indicates whether this record type supports Cloudflare proxying.
    ignore:
      ttl: In the extras, with its own rules; dnsRecordNewBody and dnsRecordEditBody send it.
      data: Free-form in cloudflare-go v7, so it is in the extras, as JSON.
      priority: A number in the OpenAPI spec, not an integer, so it is in the extras.
      proxied: In the extras, since a tunnelRef implies it.
      tags: Free-form in cloudflare-go v7, so it is in the extras.
      private_routing: Not sent by the controller, and not verified live yet.
      settings: Free-form in cloudflare-go v7, and not verified live yet.
      include_shadow_metadata: A query parameter for what a response holds, which kflare does not read.
      comment_modified_on: A time, which kflare-gen cannot map yet.
      created_on: A time, which kflare-gen cannot map yet.
      meta: Free-form, which kflare-gen cannot map.
      modified_on: A time, which kflare-gen cannot map yet.
      tags_modified_on: A time, which kflare-gen cannot map yet.
    hooks:
      params: true
      specExtras: DNSRecordSpecExtras

# The rule kinds kflare-gen generates: each resource manages one rule in a zone's entry point ruleset for a Rulesets
# phase, through the shared rule controller (internal/controller/rulesetrule_controller.go). A rule kind's spec holds
# the fields every rule kind shares (RulesetRuleSpec) and the parameters of its action, which kflare-gen builds from
# cloudflare-go v7's rule type for the action and the rule's OpenAPI schema; field paths are the API's names, with []
# for the items of a list or map. Each entry rule says what Cloudflare refuses, and gives a spec it refuses.
ruleKinds:
  - kind: CacheRule
    rule: rulesets.SetCacheSettingsRuleParam
    shortName: cfcache
    noun: cache rule
    doc: |
      CacheRule is the Schema for the cacherules API.
      It manages one cache rule in a zone: how Cloudflare caches the responses
      to the requests its expression matches, at the edge and in browsers.
    phase: http_request_cache_settings
    samples:
      - expression: 'http.request.uri.path.extension in {"css" "js" "png" "jpg" "svg" "woff2"}'
        description: Cache static assets, whose names carry their version, for a day
        cache: true
        edgeTTL:
          mode: override_origin
          default: 86400
          statusCodeTTL:
            - statusCode: 404
              value: 60
            - statusCodeRange:
                from: 500
              value: 0
        browserTTL:
          mode: override_origin
          default: 3600
        cacheKey:
          customKey:
            queryString:
              exclude:
                all: true
        vary:
          default:
            action: passthrough
          headers:
            - name: accept
              action: normalize
              mediaTypes: [image/avif, image/webp]
    tests:
      - expression: 'starts_with(http.request.uri.path, "/media/")'
        description: The settings the sample leaves out
        cache: false
        edgeTTL:
          mode: bypass_by_default
        browserTTL:
          mode: bypass
        cacheKey:
          cacheByDeviceType: true
          cacheDeceptionArmor: true
          ignoreQueryStringsOrder: true
        cacheReserve:
          eligible: true
          minimumFileSize: 1024
        originCacheControl: true
        originErrorPagePassthru: true
        respectStrongEtags: true
        serveStale:
          disableStaleWhileUpdating: true
        additionalCacheablePorts: [8443, 8080]
        originRangeRequests:
          mode: 'on'
        vary:
          default:
            action: normalize
          headers:
            - name: accept-language
              action: passthrough
              languages: [fr, en]
      - expression: 'starts_with(http.request.uri.path, "/archive/")'
        cacheReserve:
          eligible: false
    fields:
      cache:
        doc: |
          Cache makes the response eligible for Cloudflare's cache. Whether it is
          cached still depends on its cache control headers and the zone's other
          cache settings.
      browser_ttl:
        doc: |
          BrowserTTL is how long browsers cache the response. A purge does not
          reach browsers, so a long one can leave them with stale content.
        rules:
          - rule: "(self.mode == 'override_origin') == has(self.default)"
            message: set default with mode override_origin, and only with it
            reason: >-
              Cloudflare refuses override_origin without a default, and a default in another mode (20108), verified
              live on 2026-10-16.
            invalid:
              expression: 'true'
              browserTTL:
                mode: respect_origin
                default: 60
      browser_ttl.mode:
        doc: |
          Mode is where the browser TTL comes from: respect_origin keeps the
          origin's, override_origin sets default's, bypass_by_default bypasses
          the browser cache unless the origin says otherwise, and bypass always
          bypasses it.
      browser_ttl.default:
        doc: Default is the browser TTL, in seconds, with mode override_origin.
      edge_ttl:
        doc: |
          EdgeTTL is how long Cloudflare's edge caches the response.
        rules:
          - rule: "(self.mode == 'override_origin') == has(self.default)"
            message: set default with mode override_origin, and only with it
            reason: >-
              Cloudflare refuses override_origin without a default, and a default in another mode (20107), verified
              live on 2026-10-16.
            invalid:
              expression: 'true'
              edgeTTL:
                mode: override_origin
      edge_ttl.mode:
        doc: |
          Mode is where the edge TTL comes from: respect_origin keeps the
          origin's, override_origin sets default's, and bypass_by_default does
          not cache unless the origin says otherwise.
      edge_ttl.default:
        doc: Default is the edge TTL, in seconds, with mode override_origin.
      edge_ttl.status_code_ttl:
        doc: |
          StatusCodeTTL sets the edge TTL of responses by their status code,
          each item for one code or a range of them. Cloudflare refuses ranges
          that overlap.
      edge_ttl.status_code_ttl[].value:
        doc: |
          Value is the TTL, in seconds: 0 for no-cache, -1 for no-store.
      edge_ttl.status_code_ttl[].status_code_range:
        doc: |
          StatusCodeRange is the range of status codes the TTL is for: from
          and to, each optional, a range without one is open on that side.
        rules:
          - rule: '!has(self.from) || !has(self.to) || self.from < self.to'
            message: from is below to
            reason: Cloudflare refuses a range whose from is not below its to (20110), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              edgeTTL:
                mode: respect_origin
                statusCodeTTL:
                  - statusCodeRange:
                      from: 500
                      to: 500
                    value: 1
      cache_key.custom_key:
        doc: |
          CustomKey changes the request's parts the cache key holds. Free
          plans may only leave out the query string.
        rules:
          - rule: has(self.queryString)
            message: customKey sets queryString
            reason: >-
              Cloudflare refuses an empty custom key ("not entitled to use the custom cache key override", verified
              live on 2026-10-16), and kflare leaves out its other parts.
            invalid:
              expression: 'true'
              cacheKey:
                customKey: {}
      cache_key.custom_key.query_string:
        doc: QueryString leaves the query string out of the cache key.
        rules:
          - rule: has(self.exclude)
            message: queryString sets exclude
            reason: >-
              Cloudflare refuses an empty query string key ("not entitled to use the custom cache key override",
              verified live on 2026-10-16), and kflare leaves out include.
            invalid:
              expression: 'true'
              cacheKey:
                customKey:
                  queryString: {}
      cache_key.custom_key.query_string.exclude.all:
        doc: All leaves every query string parameter out of the cache key.
      origin_range_requests.mode:
        doc: |
          Mode is whether Cloudflare fetches a large asset from the origin in
          ranges: on, off, or default, the zone's behavior without the rule.
          Quote on and off in YAML, which would read them as booleans.
      cache_reserve:
        doc: |
          CacheReserve makes the response eligible for Cache Reserve, which
          needs the Cache Reserve add-on to take effect; Free zones accept and
          store it.
        rules:
          - rule: self.eligible || !has(self.minimumFileSize)
            message: minimumFileSize needs eligible
            reason: Cloudflare refuses a minimum file size without eligible (20197), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              cacheReserve:
                eligible: false
                minimumFileSize: 1024
      origin_cache_control:
        doc: |
          OriginCacheControl makes Cloudflare follow RFC 7234 strictly.
          Cloudflare's documentation lists it for Enterprise plans; Free zones
          accept and store it.
      additional_cacheable_ports:
        doc: |
          AdditionalCacheablePorts are more ports Cloudflare caches responses
          on. Cloudflare's documentation lists them for Enterprise plans; Free
          zones accept and store them.
      vary:
        doc: |
          Vary is how a response's Vary header shapes the cache key: default for
          every header, and headers for some of them.
        rules:
          - rule: '!has(self.headers) || has(self.default)'
            message: headers need a default
            reason: Cloudflare refuses headers without a default (20289), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              vary:
                headers:
                  - name: accept
                    action: normalize
      vary.headers:
        key: name
        keyDoc: Name is the request header's name, in lower case.
        keyValidation:
          minLength: 1
          pattern: ^[^A-Z]+$
          reason: Cloudflare refuses a header name with a capital (20289), verified live on 2026-10-16.
        doc: |
          Headers are what the cache key takes from some request headers, at
          most 50.
      vary.headers[]:
        rules:
          - rule: "!has(self.languages) || self.name == 'accept-language'"
            message: languages are for the accept-language header only
            reason: Cloudflare refuses languages on another header (20289), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              vary:
                default:
                  action: normalize
                headers:
                  - name: accept
                    action: normalize
                    languages: [en]
          - rule: "!has(self.mediaTypes) || self.name == 'accept'"
            message: mediaTypes are for the accept header only
            reason: Cloudflare refuses media types on another header (20289), verified live on 2026-10-16.
            invalid:
              expression: 'true'
              vary:
                default:
                  action: normalize
                headers:
                  - name: x-example
                    action: normalize
                    mediaTypes: [image/webp]
    ignore:
      read_timeout: >-
        Free plans are not entitled to an extended read timeout (verified live on 2026-10-16); add it once a plan that
        is can check it.
      shared_dictionary: >-
        Free plans are not entitled to shared dictionaries (verified live on 2026-10-16); add it once a plan that is
        can check it.
      strip_etags: Cloudflare refuses it in http_request_cache_settings (20250), verified live on 2026-10-16.
      strip_last_modified: Cloudflare refuses it in http_request_cache_settings (20250), verified live on 2026-10-16.
      strip_set_cookie: Cloudflare refuses it in http_request_cache_settings (20250), verified live on 2026-10-16.
      cache_key.custom_key.cookie: &customKey >-
        Free plans may only leave the whole query string out of a custom cache key (verified live on 2026-10-16); add
        it once a plan that may can check it.
      cache_key.custom_key.header: *customKey
      cache_key.custom_key.host: *customKey
      cache_key.custom_key.user: *customKey
      cache_key.custom_key.query_string.include: *customKey
      cache_key.custom_key.query_string.exclude.list: *customKey
      logging: Only skip rules log (20018 on a cache rule, verified live on 2026-10-16).
      ratelimit: Rate limits are refused in http_request_cache_settings (20131, verified live on 2026-10-16).
      exposed_credential_check: Refused in http_request_cache_settings (20189, verified live on 2026-10-16).
  - kind: ConfigurationRule
    rule: rulesets.SetConfigRuleParam
    shortName: cfconfig
    noun: configuration rule
    doc: |
      ConfigurationRule is the Schema for the configurationrules API.
      It manages one configuration rule in a zone: settings, such as the SSL
      mode or the security level, changed for the requests its expression
      matches.
    phase: http_config_settings
    samples:
      - expression: 'starts_with(http.request.uri.path, "/admin/")'
        description: Challenge more readily, and leave scripts alone, on the admin pages
        securityLevel: high
        bic: true
        rocketLoader: false
        ssl: strict
    tests:
      - expression: 'starts_with(http.request.uri.path, "/static/")'
        description: The settings the sample leaves out
        automaticHTTPSRewrites: true
        emailObfuscation: true
        fonts: true
        hotlinkProtection: true
        opportunisticEncryption: false
        serverSideExcludes: true
        webmcpEnabled: true
        webmcpPacks: [mcp-server-client, c2pa]
        contentConverter: false
        redirectsForAITraining: false
        disableRUM: true
        disableZaraz: true
        polish: 'off'
        requestBodyBuffering: full
        responseBodyBuffering: standard
    fields:
      automatic_https_rewrites:
        doc: AutomaticHTTPSRewrites rewrites links to HTTP URLs in HTML responses to HTTPS.
      bic:
        doc: |
          BIC turns Browser Integrity Check on or off: it challenges requests whose
          headers spammers and bots commonly abuse.
      content_converter:
        doc: |
          ContentConverter converts content, such as HTML to Markdown, for the
          clients that ask for it. Free plans may only turn it off.
      disable_rum:
        doc: DisableRUM turns Real User Monitoring off. It takes only true.
      disable_zaraz:
        doc: DisableZaraz turns Zaraz off. It takes only true.
      email_obfuscation:
        doc: EmailObfuscation hides the email addresses in HTML responses from bots.
      fonts:
        doc: Fonts serves the page's Google Fonts from Cloudflare (Cloudflare Fonts).
      hotlink_protection:
        doc: HotlinkProtection stops other sites from embedding the zone's images.
      opportunistic_encryption:
        doc: |
          OpportunisticEncryption lets browsers fetch HTTP URLs over an encrypted
          connection.
      polish:
        doc: |
          Polish is how Cloudflare optimizes images: off, lossless, lossy or webp.
          Free plans may only turn it off; quote off in YAML, which would read it
          as a boolean.
      redirects_for_ai_training:
        doc: |
          RedirectsForAITraining redirects verified AI training crawlers to the
          canonical URLs the HTML response names. Free plans may only turn it off.
      request_body_buffering:
        doc: |
          RequestBodyBuffering is how much of a request's body Cloudflare buffers
          before the origin gets it: none, standard or full.
      response_body_buffering:
        doc: |
          ResponseBodyBuffering is how much of a response's body Cloudflare buffers:
          none or standard.
      rocket_loader:
        doc: RocketLoader loads the page's JavaScript without blocking its rendering.
      security_level:
        doc: |
          SecurityLevel is how readily Cloudflare challenges visitors by their IP
          address's reputation, from essentially_off to under_attack. Free plans
          may not turn it off.
      server_side_excludes:
        doc: |
          ServerSideExcludes hides the content an HTML response marks with SSE tags
          from suspicious visitors.
      ssl:
        doc: |
          SSL is how Cloudflare connects to the origin: off, flexible (HTTP), full
          (HTTPS, any certificate), strict (HTTPS, a valid certificate) or
          origin_pull. Free plans may not use origin_pull; quote off in YAML.
      webmcp_enabled:
        doc: |
          WebmcpEnabled serves the WebMCP bridge script, which exposes the page's
          tools to browser AI agents.
      webmcp_packs:
        doc: |
          WebmcpPacks are the WebMCP tool packs to turn on for the requests the rule
          matches, at most 100. They do not serve the bridge script itself. Unset,
          the packs stay as they are: kflare does not send an empty list, which
          would turn them all off.
    ignore:
      autominify: >-
        Cloudflare retired Auto Minify in August 2024, per its documentation; the API still accepts the setting.
      disable_apps: >-
        Cloudflare Apps are deprecated, and Cloudflare refuses the setting (20251; false: 20114), verified live on
        2026-10-17.
      disable_pay_per_crawl: >-
        Free plans are not entitled to it, and it takes only true (20114), verified live on 2026-10-17; add it once a
        plan that is can check it.
      mirage: Mirage is deprecated, and Free plans are not entitled to it (verified live on 2026-10-17).
      sxg: >-
        Signed Exchanges are deprecated, and Cloudflare refuses the setting either way (20259), verified live on
        2026-10-17.
      logging: Only skip rules log (20018 on a configuration rule, verified live on 2026-10-17).
      ratelimit: Rate limits are refused in http_config_settings (20131, verified live on 2026-10-17).
      exposed_credential_check: Refused in http_config_settings (20189, verified live on 2026-10-17).
  - kind: ManagedRuleset
    rule: rulesets.ExecuteRuleParam
    shortName: cfmanaged
    noun: managed ruleset deployment
    doc: |
      ManagedRuleset is the Schema for the managedrulesets API.
      It deploys a Cloudflare managed ruleset to a zone, as an execute rule in
      its http_request_firewall_managed phase; the expression selects the
      requests the ruleset inspects, and "true" selects every request.
      Cloudflare deploys its Free Managed Ruleset to Free zones by default, but
      only while the zone has no rules of its own in the phase: as soon as any
      rule is there, only what the rules deploy runs. To turn a managed ruleset
      off, keep its ManagedRuleset and set enabled to false.
    phase: http_request_firewall_managed
    samples:
      - expression: 'true'
        description: Free Managed Ruleset, the WordPress rules only logging
        id: 77454fe2d30c4220b5701f6fdfb893ba
        overrides:
          categories:
            - category: wordpress
              action: log
          rules:
            - id: 7dfd111a6bad4b86bf3522cce6c5792f
              enabled: false
    tests:
      # Another ruleset than the sample's, which the same zone deploys at once.
      - expression: 'http.request.uri.path ne "/health"'
        id: efb7b8c949ac4650a09736fc376e9aee
        overrides:
          enabled: false
          action: managed_challenge
    conflicts:
      - code: 20014
        reason: RulesetConflict
        why: >-
          A zone deploys a managed ruleset at most once, and Cloudflare refuses a second execute rule for it ("more
          than one rule is trying to execute the same managed ruleset", verified live on 2026-10-14). The other rule
          may be another ManagedRuleset's that is going, as when one is replaced by another of another name.
    fields:
      id:
        doc: |
          ID is the managed ruleset to deploy. Free plans can deploy the Cloudflare
          Free Managed Ruleset, 77454fe2d30c4220b5701f6fdfb893ba; higher plans also
          the Cloudflare Managed Ruleset, efb7b8c949ac4650a09736fc376e9aee, and the
          OWASP Core Ruleset, 4814384a9e5d4991b9815dcfc25d2f1f. Cloudflare always
          runs the ruleset's latest version. A zone can deploy a ruleset only once.
        printColumn: Ruleset
      overrides:
        doc: |
          Overrides change what the ruleset's rules do. An override for a rule takes
          precedence over one for a category the rule is tagged with, which takes
          precedence over the overrides for the whole ruleset.
      overrides.action:
        doc: Action replaces the action of every rule of the ruleset.
        validation: &overrideActions
          enum: [block, challenge, js_challenge, managed_challenge, log]
          reason: >-
            The spec takes any lowercase name; Cloudflare refuses skip as an override's action (20067), verified live
            on 2026-10-14, and the managed rules' own actions are these.
      overrides.categories:
        doc: |
          Categories override the rules tagged with a category, such as wordpress
          or log4j, each listed once. Cloudflare refuses a category none of the
          ruleset's rules has (20235).
        listMapKey: category
      overrides.categories[].action:
        doc: Action replaces the action of the category's rules.
        validation: *overrideActions
      overrides.rules:
        doc: Rules override single rules of the ruleset, by ID, each listed once.
        listMapKey: id
      overrides.rules[].action:
        doc: Action replaces the rule's action.
        validation: *overrideActions
    ignore:
      matched_data: Payload logging; Free plans are not entitled to it (verified live on 2026-10-14).
      overrides.sensitivity_level: &ddos >-
        Only for DDoS phases, as the API description says; Cloudflare refuses it on the whole ruleset in this phase
        (20069, verified live on 2026-10-14).
      overrides.categories[].sensitivity_level: *ddos
      overrides.rules[].sensitivity_level: *ddos
      overrides.rules[].score_threshold: >-
        Accepted on Free, but only the OWASP Core Ruleset, which Free plans cannot deploy, scores requests (verified
        live on 2026-10-14); add it once a plan that can deploy it can check it.
      logging: Only skip rules log (20018 on an execute rule, verified live on 2026-10-14).
      ratelimit: >-
        Rate limits belong to the http_ratelimit phase's rules; not verified live in this phase, so not sent.
      exposed_credential_check: >-
        Exposed credentials checks belong to custom rules on paid plans; not verified live in this phase, so not
        sent.
  - kind: RateLimitRule
    actions:
      - action: block
        rule: rulesets.BlockRuleParam
        doc: blocks them, with Cloudflare's response or the rule's.
      - action: challenge
        doc: issues an interactive challenge.
      - action: js_challenge
        doc: issues a JavaScript challenge.
      - action: managed_challenge
        rule: rulesets.ManagedChallengeRuleParam
        doc: issues the challenge Cloudflare picks for the visitor.
      - action: log
        rule: rulesets.LogRuleParam
        doc: only logs them (Enterprise plans).
    actionDoc: |
      Action is what Cloudflare does with a client's matching requests once it
      is over the rate. Free plans can only block.
    shortName: cfratelimit
    noun: rate limiting rule
    doc: |
      RateLimitRule is the Schema for the ratelimitrules API.
      It manages one rate limiting rule in a zone, in its http_ratelimit phase:
      the rule counts the requests its expression matches, and once a client
      sends more than requestsPerPeriod of them in a period, the action applies
      to the client's matching requests for the mitigation timeout. A Free plan
      allows one rate limiting rule, counted per IP address over 10 seconds,
      with the block action.
    phase: http_ratelimit
    samples:
      - expression: 'starts_with(http.request.uri.path, "/api/")'
        description: Limit each client to 100 API requests every 10 seconds
        action: block
        ratelimit:
          characteristics: [cf.colo.id, ip.src]
          period: 10
          requestsPerPeriod: 100
          mitigationTimeout: 10
        response:
          statusCode: 429
          contentType: application/json
          content: '{"error":"rate limited, try again in 10 seconds"}'
    tests:
      # Fields Free plans are not entitled to, which the generated specs write to the fake: counting by another field,
      # a counting expression, counting only what reaches the origin, and throttling. Characteristics listed out of
      # order, which the conversion sorts.
      - expression: 'starts_with(http.request.uri.path, "/login")'
        action: managed_challenge
        ratelimit:
          characteristics: ['http.request.headers["x-api-key"]', cf.colo.id]
          period: 60
          requestsPerPeriod: 5
          mitigationTimeout: 0
          countingExpression: 'http.response.code eq 401'
          requestsToOrigin: true
      - expression: 'true'
        action: js_challenge
        ratelimit:
          characteristics: [ip.src, cf.colo.id]
          period: 10
          requestsPerPeriod: 1000000
          mitigationTimeout: 3600
      - expression: 'http.request.uri.path eq "/search"'
        action: challenge
        ratelimit:
          characteristics: [cf.colo.id, ip.src]
          period: 30
          requestsPerPeriod: 20
          mitigationTimeout: 30
      - expression: 'http.request.method eq "POST"'
        action: log
        ratelimit:
          characteristics: [cf.colo.id, ip.src]
          period: 120
          requestsPerPeriod: 300
          mitigationTimeout: 0
    rules:
      - rule: has(self.ratelimit)
        message: ratelimit is required
        reason: Cloudflare refuses a rule without a rate limit in the http_ratelimit phase (20132), verified live on 2026-10-13.
        invalid:
          expression: 'true'
          action: block
    fields:
      ratelimit:
        doc: |
          Ratelimit is the rule's rate limit: what requests are counted by, over
          what period, how many a client may send, and for how long the action
          applies once the client sends more.
        rules:
          - rule: has(self.requestsPerPeriod)
            message: requestsPerPeriod is required
            reason: >-
              Cloudflare reads a missing threshold as 0 and refuses it (20158), verified live on 2026-10-27; score
              counting, which replaces it, is not mapped (see ignore).
            invalid:
              expression: 'true'
              action: block
              ratelimit: {characteristics: [cf.colo.id, ip.src], period: 10, mitigationTimeout: 10}
          - rule: has(self.mitigationTimeout)
            message: mitigationTimeout is required
            reason: >-
              Cloudflare reads a missing timeout as 0, which throttles, and only Enterprise plans may throttle ("not
              entitled to use throttle behaviour"), verified live on 2026-10-13 and 2026-10-27: a spec that throttles
              says so with 0.
            invalid:
              expression: 'true'
              action: block
              ratelimit: {characteristics: [cf.colo.id, ip.src], period: 10, requestsPerPeriod: 100}
          - rule: '!has(self.mitigationTimeout) || self.mitigationTimeout == 0 || self.mitigationTimeout >= self.period'
            message: mitigationTimeout must be 0 or at least the period
            reason: Cloudflare refuses a timeout below the period but 0 (20156), verified live on 2026-10-13.
            invalid:
              expression: 'true'
              action: block
              ratelimit: {characteristics: [cf.colo.id, ip.src], period: 60, requestsPerPeriod: 100,
                mitigationTimeout: 10}
          - rule: '''cf.colo.id'' in self.characteristics'
            message: characteristics must list cf.colo.id
            reason: >-
              Cloudflare counts every rate limiting rule per data center and refuses a rule whose characteristics do
              not say so (20155), verified live on 2026-10-13.
            invalid:
              expression: 'true'
              action: block
              ratelimit: {characteristics: [ip.src], period: 10, requestsPerPeriod: 100, mitigationTimeout: 10}
          - rule: self.characteristics.exists(c, c != 'cf.colo.id')
            message: characteristics must list a field besides cf.colo.id
            reason: Cloudflare refuses cf.colo.id alone (20155), verified live on 2026-10-13.
            invalid:
              expression: 'true'
              action: block
              ratelimit: {characteristics: [cf.colo.id], period: 10, requestsPerPeriod: 100, mitigationTimeout: 10}
      ratelimit.characteristics:
        doc: |
          Characteristics are what requests are counted by: requests that share
          all of them share a counter. Cloudflare counts per data center, so they
          list cf.colo.id, and at least one other field: ip.src counts per client
          IP address, the only choice on Free plans; higher plans can count by
          other fields, such as http.request.headers["x-api-key"].
      ratelimit.period:
        doc: |
          Period is how long, in seconds, requests are counted for. Cloudflare
          accepts set periods between 10 seconds and an hour, and the zone's plan
          narrows them: Free plans can only count for 10 seconds.
        printColumn: Period
      ratelimit.requests_per_period:
        doc: |
          RequestsPerPeriod is how many matching requests a client can send in a
          period before the action applies.
        printColumn: Requests
        validation:
          minimum: 1
          maximum: 1000000
          reason: >-
            Cloudflare refuses a threshold above 1,000,000 (20158), verified live on 2026-10-13; the API description
            gives no maximum.
      ratelimit.mitigation_timeout:
        doc: |
          MitigationTimeout is how long, in seconds, the action applies once a
          client is over the rate. It must be at least the period, or 0 to
          throttle instead: apply the action only to the requests over the rate
          (Enterprise plans). Free plans can only use 10.
        omitZero: >-
          Cloudflare reads a missing timeout as 0: Free plans are refused either alike ("not entitled to use throttle
          behaviour"), verified live on 2026-10-13 and 2026-10-27. Leaving 0 out sends what kflare's earlier
          RateLimitRule sent; what Cloudflare returns for an explicit 0 is not verified, since only Enterprise plans
          may throttle.
      ratelimit.counting_expression:
        doc: |
          CountingExpression counts other requests than those the rule matches,
          for example only the failed logins among the login requests. It
          defaults to the rule's expression. Free plans cannot set it.
      ratelimit.requests_to_origin:
        doc: |
          RequestsToOrigin counts only the requests that reach the origin,
          leaving out those served from Cloudflare's cache.
        omitZero: >-
          Cloudflare stores false as absent: a rule written with requests_to_origin false comes back without it
          (a stored rule, verified live on 2026-10-27), and the API description gives false as the default.
      response:
        doc: Response replaces Cloudflare's response to the requests a block rule blocks.
      response.content:
        doc: Content is the response body.
        validation:
          minLength: 1
          maxLength: 30720
          reason: >-
            Cloudflare refuses a body over 30,720 bytes in a rate limiting rule (20052), verified live on 2026-10-13;
            the API description gives no maximum.
      response.content_type:
        doc: ContentType is the response's content type.
        validation:
          enum: [text/html, text/plain, application/json, text/xml]
          reason: >-
            Cloudflare takes these four content types only (20050), verified live on 2026-10-13; the API description
            takes any.
      response.status_code:
        doc: StatusCode is the response's HTTP status code.
    ignore:
      logging: Only skip rules log (20018 on a block rule, verified live on 2026-10-27).
      exposed_credential_check: Refused in http_ratelimit (20189, verified live on 2026-10-27).
      ratelimit.score_per_period: &score >-
        Score counting replaces requests_per_period (20159) and needs score_response_header_name (20161); Free plans
        are not entitled to it ("not entitled to use score fields in ratelimiting"), verified live on 2026-10-27. Add
        it once a plan that is can check it.
      ratelimit.score_response_header_name: *score
  - kind: OriginRule
    rule: rulesets.RouteRuleParam
    shortName: cforigin
    noun: origin rule
    doc: |
      OriginRule is the Schema for the originrules API.
      It manages one origin rule in a zone: the requests its expression
      matches reach the origin on another destination port.
    phase: http_request_origin
    samples:
      - expression: 'starts_with(http.request.uri.path, "/api/")'
        description: Send API requests to the origin's port 8443
        origin:
          port: 8443
    fields:
      origin:
        doc: |
          Origin is where Cloudflare sends the requests the rule matches. Free
          plans may only change the destination port.
      origin.port:
        doc: |
          Port is the destination port Cloudflare connects to the origin on,
          from 1 to 65535, in place of the request's own.
    ignore:
      host_header: &enterprise >-
        Free plans are not entitled to Host header, origin host (DNS record) or SNI overrides, which Cloudflare's
        documentation lists for Enterprise plans (verified live on 2026-10-18); add them once a plan that is can check
        them.
      origin.host: *enterprise
      sni: *enterprise
      logging: Only skip rules log (20018 on an origin rule, verified live on 2026-10-18).
      ratelimit: Rate limits are refused in http_request_origin (20131, verified live on 2026-10-18).
      exposed_credential_check: Refused in http_request_origin (20189, verified live on 2026-10-18).
  - kind: RedirectRule
    rule: rulesets.RedirectRuleParam
    shortName: cfredirect
    noun: redirect rule
    doc: |
      RedirectRule is the Schema for the redirectrules API.
      It manages one single redirect in a zone: Cloudflare answers the requests
      its expression matches with a redirect to a URL, a static one or one an
      expression computes.
    phase: http_request_dynamic_redirect
    samples:
      - expression: 'http.host eq "www.example.com"'
        description: Send www.example.com to example.com, keeping the path and query
        fromValue:
          targetURL:
            expression: 'concat("https://example.com", http.request.uri.path)'
          statusCode: 301
          preserveQueryString: true
    fields:
      from_value:
        doc: |
          FromValue redirects the requests the rule matches to a URL: targetURL's,
          with statusCode.
      from_value.target_url:
        doc: |
          TargetURL is the URL requests are redirected to: a static value, or what
          an expression computes for each request.
      from_value.target_url.value:
        doc: |
          Value is a static URL, such as `https://example.com/new`. Cloudflare
          takes it as given, a relative URL too.
      from_value.target_url.expression:
        doc: |
          Expression computes the URL in Cloudflare's Rules language, such as
          `concat("https://example.com", http.request.uri.path)`. Free plans
          cannot use regex_replace; wildcard_replace works on every plan.
      from_value.status_code:
        doc: |
          StatusCode is the redirect's status: 301 or 308 for a permanent
          redirect, 302, 303 or 307 for a temporary one. Unset, Cloudflare
          redirects with 301.
      from_value.preserve_query_string:
        doc: |
          PreserveQueryString keeps the request's query string on the URL
          redirected to. Unset, the query string is dropped.
    ignore:
      from_list: >-
        Bulk Redirects look requests up in a redirect list, in the account-level http_request_redirect phase; Cloudflare
        refuses from_list in http_request_dynamic_redirect (20080), verified live on 2026-10-15.
      logging: Only skip rules log (20018 on a redirect rule, verified live on 2026-10-15).
      ratelimit: Rate limits are refused in http_request_dynamic_redirect (20131, verified live on 2026-10-15).
      exposed_credential_check: Refused in http_request_dynamic_redirect (20189, verified live on 2026-10-15).
  - kind: TransformRule
    rule: rulesets.RewriteRuleParam
    shortName: cftransform
    noun: transform rule
    doc: |
      TransformRule is the Schema for the transformrules API.
      It manages one transform rule in a zone: a rewrite of the URL a request
      reaches the origin with, or a change to its request or response headers.
    typeDoc: |
      Type is what the rule transforms, which picks the Rulesets phase its rule
      is in:
    types:
      - name: urlRewrite
        phase: http_request_transform
        doc: rewrites the URL's path or query, with uri
      - name: requestHeaders
        phase: http_request_late_transform
        doc: sets or removes headers of the request to the origin, with headers
      - name: responseHeaders
        phase: http_response_headers_transform
        doc: adds, sets or removes headers of the response to the visitor, with headers
    samples:
      - type: urlRewrite
        expression: 'http.request.uri.path eq "/old"'
        description: Serve /old from /new
        uri:
          path:
            value: /new
      - type: requestHeaders
        expression: 'starts_with(http.request.uri.path, "/api/")'
        description: Tell the origin which country a request comes from
        headers:
          - name: x-visitor-country
            operation: set
            expression: ip.src.country
      - type: responseHeaders
        expression: 'true'
        description: Keep pages out of frames and stop revealing the server's stack
        headers:
          - name: x-frame-options
            operation: set
            value: DENY
          - name: x-powered-by
            operation: remove
    fields:
      headers:
        key: name
        keyDoc: Name is the header's name.
        doc: |
          Headers are the headers the rule changes, with types requestHeaders and
          responseHeaders. Cloudflare allows 30 in a rule (2026-10).
      headers[].operation:
        doc: |
          Operation is what the rule does to the header: set replaces its value,
          adding the header when the request or response has none; add adds a
          header even when one is there, in responses only; remove removes it.
      headers[].value:
        doc: |
          Value is the header's value, a static string, for set and add. Set
          exactly one of value and expression, or neither for remove.
      headers[].expression:
        doc: |
          Expression computes the header's value in Cloudflare's Rules language,
          for set and add, for example `ip.src`.
      uri:
        doc: |
          URI rewrites the URL the request reaches the origin with: its path, its
          query, or both, with type urlRewrite. The visitor's URL does not change.
      uri.path:
        doc: |
          Path rewrites the URL's path, to a static value or to what an
          expression computes.
      uri.path.value:
        doc: Value is the new path, which starts with a slash.
        validation:
          minLength: 1
          pattern: ^/
          reason: Cloudflare refuses a path that does not start with a slash (20089), verified live on 2026-10-15.
      uri.path.expression:
        doc: |
          Expression computes the new path, for example
          `concat("/new", http.request.uri.path)`. Free plans cannot use
          regex_replace.
      uri.query:
        doc: |
          Query rewrites the URL's query string, to a static value or to what an
          expression computes.
      uri.query.value:
        doc: |
          Value is the new query string, without its question mark. An empty one
          removes the query string.
      uri.query.expression:
        doc: Expression computes the new query string.
    rules:
      - rule: "self.type != 'urlRewrite' || (has(self.uri) && !has(self.headers))"
        message: type urlRewrite takes uri and no headers
        reason: Cloudflare refuses header rewrites in http_request_transform (20086), verified live on 2026-10-15.
        invalid:
          type: urlRewrite
          expression: 'true'
          headers:
            - name: x-example
              operation: set
              value: '1'
      - rule: "self.type == 'urlRewrite' || (has(self.headers) && !has(self.uri))"
        message: types requestHeaders and responseHeaders take headers and no uri
        reason: Cloudflare refuses URI rewrites in the header phases (20088), verified live on 2026-10-15.
        invalid:
          type: responseHeaders
          expression: 'true'
          uri:
            path:
              value: /new
      - rule: "self.type != 'requestHeaders' || !has(self.headers) || self.headers.all(h, h.operation != 'add')"
        message: operation add is for response headers only
        reason: Cloudflare refuses add on a request header (20087), verified live on 2026-10-15.
        invalid:
          type: requestHeaders
          expression: 'true'
          headers:
            - name: x-example
              operation: add
              value: '1'
    ignore:
      logging: Only skip rules log (20018 on a transform rule, verified live on 2026-10-15).
      ratelimit: Rate limits are refused in the transform phases (20131, verified live on 2026-10-15).
      exposed_credential_check: Refused in the transform phases (20189, verified live on 2026-10-15).
  - kind: WAFCustomRule
    actions:
      - action: block
        rule: rulesets.BlockRuleParam
        doc: blocks them, with Cloudflare's block page or the rule's response.
      - action: challenge
        doc: issues an interactive challenge.
      - action: js_challenge
        doc: issues a JavaScript challenge.
      - action: managed_challenge
        rule: rulesets.ManagedChallengeRuleParam
        doc: issues the challenge Cloudflare picks for the visitor.
      - action: skip
        rule: rulesets.SkipRuleParam
        doc: lets them skip the security features its parameters name.
      - action: log
        rule: rulesets.LogRuleParam
        doc: only logs them (Enterprise plans).
    actionDoc: |
      Action is what Cloudflare does with the requests the rule matches. Free
      plans can take every action but log.
    shortName: cfwaf
    noun: WAF custom rule
    doc: |
      WAFCustomRule is the Schema for the wafcustomrules API.
      It manages one WAF custom rule in a zone, in its
      http_request_firewall_custom phase: the rule blocks or challenges the
      requests its expression matches, or lets them skip other security
      features. A Free plan allows five custom rules.
    phase: http_request_firewall_custom
    samples:
      - expression: 'http.request.uri.path wildcard "/admin*" and not ip.src in {192.0.2.0/24}'
        description: Block the admin pages from outside the office
        priority: 10
        action: block
    tests:
      # A skip rule placed before the sample by its priority, as the hand-written sample's was: phases and products
      # listed out of order, which the conversion sorts, as Cloudflare keeps the order it is sent.
      - expression: 'http.request.uri.path eq "/healthz"'
        priority: 0
        action: skip
        ruleset: current
        phases: [http_request_sbfm, http_ratelimit]
        products: [waf, bic]
        logging:
          enabled: false
      - expression: 'http.request.uri.path eq "/status"'
        action: skip
        phase: current
        products: [securityLevel]
      - expression: 'starts_with(http.request.uri.path, "/login")'
        action: managed_challenge
      - expression: 'http.request.uri.path eq "/search"'
        action: challenge
      - expression: 'http.request.uri.path eq "/download"'
        action: js_challenge
      - expression: 'http.request.method eq "PUT"'
        action: log
      - expression: 'http.request.uri.path eq "/private"'
        action: block
        response:
          statusCode: 403
          contentType: text/html
          content: '<h1>Forbidden</h1>'
    rules:
      - rule: "!has(self.logging) || self.action == 'skip'"
        message: logging is allowed only with action skip
        reason: Cloudflare refuses logging on a rule of another action (20018), verified live on 2026-10-27.
        invalid:
          expression: 'true'
          action: block
          logging:
            enabled: true
      - rule: '!has(self.phase) || !has(self.phases)'
        message: phase cannot be used with phases
        reason: Cloudflare refuses a skip of both (20247), verified live on 2026-10-27.
        invalid:
          expression: 'true'
          action: skip
          phase: current
          phases: [http_ratelimit]
      - rule: '!has(self.phase) || !has(self.ruleset)'
        message: phase cannot be used with ruleset
        reason: Cloudflare refuses a skip of both (20116), verified live on 2026-10-27.
        invalid:
          expression: 'true'
          action: skip
          phase: current
          ruleset: current
    fields:
      response:
        doc: |
          Response replaces Cloudflare's block page for a block rule. It needs a
          Pro plan or higher: Free zones are not entitled to a custom response.
      response.content:
        doc: Content is the response body, of at most 2,048 bytes.
        validation:
          minLength: 1
          maxLength: 2048
          reason: >-
            Cloudflare refuses an empty body (20051) and one over 2,048 bytes (20052) in a WAF custom rule, verified
            live on 2026-10-27 (it checks the response before the plan); the API description gives no maximum.
      response.content_type:
        doc: ContentType is the response's content type.
        validation:
          enum: [text/html, text/plain, application/json, text/xml]
          reason: >-
            Cloudflare takes these four content types only (20050), verified live on 2026-10-27; the API description
            takes any.
      response.status_code:
        doc: StatusCode is the response's HTTP status code, from 400 to 499.
      phase:
        doc: |
          Phase, set to current, skips the rest of the phase: the zone's custom
          rules after this one, and the custom rulesets the phase runs after
          them. It can be combined with products, but not with phases or
          ruleset.
      phases:
        doc: |
          Phases skips later security phases: rate limiting rules
          (http_ratelimit), managed rules (http_request_firewall_managed) and
          Super Bot Fight Mode (http_request_sbfm).
      phases[]:
        validation:
          enum: [http_ratelimit, http_request_firewall_managed, http_request_sbfm]
          reason: >-
            A custom rule skips only the phases after it: Cloudflare refuses its own phase (20120), and takes these
            three, verified live on 2026-10-12 and 2026-10-27.
      products:
        doc: |
          Products skips security features of the previous generation: zone
          lockdown (zoneLockdown), user agent blocking (uaBlock), browser
          integrity check (bic), hotlink protection (hot), security level
          (securityLevel), the previous rate limiting (rateLimit) and the
          previous managed rules (waf).
      ruleset:
        doc: |
          Ruleset, set to current, skips the zone's custom rules that run after
          this one.
      logging:
        doc: |
          Logging says whether a skip rule records the requests it matches in
          Security Events. Cloudflare logs them unless enabled is false.
      logging.enabled:
        doc: Enabled logs the requests the skip rule matches.
    ignore:
      rules: >-
        Skipping single rules of rulesets belongs to the managed phase; refused in http_request_firewall_custom
        (20118, verified live on 2026-10-27).
      rulesets: >-
        Skipping rulesets belongs to the managed phase; refused in http_request_firewall_custom (20117, verified live
        on 2026-10-27).
      ratelimit: Rate limits belong to the http_ratelimit phase (20131 here, verified live on 2026-10-27).
      exposed_credential_check: >-
        Refused in a zone's http_request_firewall_custom phase (20189, verified live on 2026-10-27).

# The settings kinds kflare-gen generates: each resource configures one product's settings in a zone, which always
# exist, through the shared settings controller (internal/controller/settings_controller.go). One resource configures
# a zone's settings of a kind, and deleting it resets them. A settings kind's spec holds the fields every settings kind
# shares (SettingsSpec) and the body of its service's write, which kflare-gen builds from cloudflare-go v7's params and
# the OpenAPI schema, as for rule kinds. Each entry says what the settings hold in a zone nobody has configured
# (`unconfigured`), and how that was verified.
settingsKinds:
  - kind: ManagedTransform
    service: managed_transforms.ManagedTransformService
    shortName: cfmanagedtransform
    noun: managed transforms
    doc: |
      ManagedTransform is the Schema for the managedtransforms API.
      It turns a zone's managed transforms on and off: the request and response
      headers Cloudflare adds or removes for the zone. One ManagedTransform
      configures a zone. Deleting it turns all of the zone's managed transforms
      off, unless the retain deletion policy is set or it adopted them.
    sample:
      managedRequestHeaders:
        - id: add_visitor_location_headers
          enabled: true
      managedResponseHeaders:
        - id: remove_x-powered-by_header
          enabled: true
        - id: add_security_headers
          enabled: true
    fields:
      managed_request_headers:
        listMapKey: id
        doc: |
          ManagedRequestHeaders turns managed request transforms on or off, by
          ID. A Free zone has add_client_certificate_headers,
          add_visitor_location_headers, remove_visitor_ip_headers and
          add_waf_credential_check_status_header. Transforms the list leaves out
          keep their state.
      managed_response_headers:
        listMapKey: id
        doc: |
          ManagedResponseHeaders turns managed response transforms on or off, by
          ID. A Free zone has remove_x-powered-by_header and
          add_security_headers. Transforms the list leaves out keep their state.
    unconfigured:
      values:
        managed_request_headers[].enabled: false
        managed_response_headers[].enabled: false
      reason: >-
        Every transform is off on kflare.dev, which nobody has configured (read live on 2026-10-22 and 2026-10-23), and
        the reset turns them all off ("Disables all Managed Transforms", Cloudflare's API documentation).

# The kinds whose fields and calls stay hand-written (their <kind>_hooks.go) and on cloudflare-go v0.119, while the
# shared CRUD reconciler runs them. A Worker's upload is a multipart request whose bindings v7 types as a union of 30
# variants. A tunnel's configuration has no New or Delete. A zone's creation cannot be verified on the test account,
# and v7 has no jump_start or plan_pending. See CLAUDE.md, Generate every kind.
hookedKinds:
  - kind: Zone
    scope: account
    shortName: cfzone
    noun: zone
    doc: |
      Zone is the Schema for the zones API.
      It represents a DNS zone managed in Cloudflare.
    id:
      field: id
      status: zoneID
      doc: ZoneID is the Cloudflare zone identifier.
    claimLabel: kflare.dev/zone-id
    specExtras: ZoneSpecExtras
    metadataExtras: ZoneMetadataExtras
    columns:
      - {name: Domain, type: string, path: .spec.name}
      - {name: Zone ID, type: string, path: .status.cloudflareMetadata.zoneID}
      - {name: Plan, type: string, path: .status.cloudflareMetadata.plan}
      - {name: CF Status, type: string, path: .status.cloudflareMetadata.status}
