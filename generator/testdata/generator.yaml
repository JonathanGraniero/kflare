# Kinds for kflare-gen's golden tests, each generated from a real cloudflare-go v7 service. Regenerate the golden
# files with: go test ./generator -run TestGolden -update
#
# Only TestKVNamespace gets a controller: the shared CRUD reconciler cannot drive the list and R2 bucket services yet,
# and TestGolden checks that kflare-gen says why. The others get their types.
kinds:
  # Every field of the KV namespace service: optional create-only enums (jurisdiction, mode) and a computed bool.
  - kind: TestKVNamespace
    service: kv.NamespaceService
    scope: account
    shortName: testkv
    noun: KV namespace
    doc: TestKVNamespace exposes every field of the KV namespace service.
    id:
      field: id
      status: namespaceID
    claimLabel: kflare.dev/test-kv-namespace-id
    adopt:
      by: title
    sample:
      title: example-test-kv

  # A custom list: required create-only fields (kind, an enum, and name), an updatable optional one, computed strings.
  - kind: TestList
    service: rules.ListService
    scope: account
    shortName: testlist
    noun: list
    doc: |
      TestList is a custom list. Its numbers are left out until the OpenAPI
      spec tells that they are integers.
    id:
      field: id
      status: listID
    claimLabel: kflare.dev/test-list-id
    adopt:
      by: name
    sample:
      name: test_list
      kind: ip
    fields:
      name:
        printColumn: Name
      created_on:
        printColumn: Created
    ignore:
      num_items: A number in the OpenAPI spec, not an integer.
      num_referencing_filters: A number in the OpenAPI spec, not an integer.

  # R2Bucket's hand-written CRD, as kflare-gen generates it: TestConstraintsMatchTheHandWrittenCRDs compares the two.
  - kind: TestR2Bucket
    service: r2.BucketService
    scope: account
    shortName: testr2
    noun: R2 bucket
    doc: TestR2Bucket is R2Bucket as kflare-gen generates it.
    id:
      field: name
      status: bucketName
    claimLabel: kflare.dev/test-r2-bucket-name
    adopt:
      by: name
    sample:
      name: test-bucket
    fields:
      name:
        validation:
          pattern: ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$
          reason: >-
            Names are 3 to 63 characters, not up to 64 as the spec says, and the spec's pattern has no end anchor, so it
            passes a name that ends in a hyphen. Cloudflare took 63 characters and refused 64, a trailing hyphen, a
            capital and an underscore (10005; verified live 2026-10-14).
    ignore:
      storageClass: Testing Infrequent Access is billed usage; see Deferred in docs/design-notes.md.
      cf-r2-jurisdiction: Jurisdictions are not supported yet; see R2Bucket in docs/design-notes.md.

  # IPList's hand-written CRD, as kflare-gen generates it, without the items, which are not part of the list service.
  - kind: TestIPList
    service: rules.ListService
    scope: account
    shortName: testiplist
    noun: IP list
    doc: TestIPList is IPList as kflare-gen generates it.
    id:
      field: id
      status: listID
    claimLabel: kflare.dev/test-ip-list-id
    adopt:
      by: name
    sample:
      name: test_ips
    fixed:
      kind: ip
    fields:
      name:
        validation:
          pattern: ^[a-z0-9_]{1,50}$
          reason: >-
            Cloudflare refuses capitals in a list name (10029; verified live 2026-10-13), which the spec's pattern
            allows.
    ignore:
      num_items: A number in the OpenAPI spec, not an integer.
      num_referencing_filters: A number in the OpenAPI spec, not an integer.

# Rule kinds, each from a real cloudflare-go v7 rule type, for the shapes TransformRule does not have.
ruleKinds:
  # One phase; a required string with a pattern, nested objects, lists of objects, bools, integers, enums, and rules on
  # how many fields an object sets.
  - kind: TestExecuteRule
    rule: rulesets.ExecuteRuleParam
    shortName: testexecute
    noun: execute rule
    doc: TestExecuteRule deploys a managed ruleset, with every field of the execute rule's action parameters.
    phase: http_request_firewall_managed
    samples:
      - expression: 'true'
        id: 77454fe2d30c4220b5701f6fdfb893ba
        overrides:
          enabled: true
          categories:
            - category: wordpress
              enabled: false
          rules:
            - id: 9f7e454e4cad45abbcc40696037f70df
              action: log
              scoreThreshold: 40
    ignore:
      logging: Not mapped by rule kinds yet.
      ratelimit: Not mapped by rule kinds yet.
      exposed_credential_check: Not mapped by rule kinds yet.

  # Lists of scalars: sets of enum values and of strings with a pattern. A map of lists is ignored.
  - kind: TestSkipRule
    rule: rulesets.SkipRuleParam
    shortName: testskip
    noun: skip rule
    doc: TestSkipRule skips rules, with the skip rule's action parameters but for the map of rules.
    phase: http_request_firewall_custom
    samples:
      - expression: 'http.request.uri.path eq "/health"'
        description: Skip the health check
        phases: [http_request_sbfm, http_ratelimit]
        products: [waf]
        ruleset: current
    ignore:
      rules: A map of lists, which kflare-gen cannot map yet.
      logging: Not mapped by rule kinds yet.
      ratelimit: Not mapped by rule kinds yet.
      exposed_credential_check: Not mapped by rule kinds yet.

# Settings kinds, each from a real cloudflare-go v7 service that keeps a zone's settings.
settingsKinds:
  # Required enums, read with Get and written with Update (a PUT), reset with a Delete that returns nothing.
  - kind: TestURLNormalization
    service: url_normalization.URLNormalizationService
    shortName: testurlnormalization
    noun: URL normalization
    doc: TestURLNormalization configures how Cloudflare normalizes the URLs of a zone's requests.
    sample:
      scope: both
      type: rfc3986
    unconfigured:
      values:
        scope: incoming
        type: cloudflare
      reason: >-
        Cloudflare's defaults, as kflare.dev, which nobody has configured, holds them (read live 2026-10-22).

  # Lists of objects keyed by their IDs, read with a List that returns the settings and written with Edit (a PATCH).
  - kind: TestManagedTransform
    service: managed_transforms.ManagedTransformService
    shortName: testmanagedtransform
    noun: managed transforms
    doc: TestManagedTransform turns a zone's managed transforms on and off.
    sample:
      managedRequestHeaders:
        - id: add_visitor_location_headers
          enabled: true
      managedResponseHeaders:
        - id: add_security_headers
          enabled: true
    fields:
      managed_request_headers:
        listMapKey: id
      managed_response_headers:
        listMapKey: id
    unconfigured:
      values:
        managed_request_headers[].enabled: false
        managed_response_headers[].enabled: false
      reason: >-
        Every transform is disabled on kflare.dev, which nobody has configured (read live 2026-10-22), and the reset
        disables them all, as Cloudflare documents it.

  # Optional bools and an enum, read with Get and written with Edit (a PATCH), reset with a Delete that returns a
  # result.
  - kind: TestDNSSEC
    service: dns.DNSSECService
    shortName: testdnssec
    noun: DNSSEC
    doc: TestDNSSEC signs a zone's DNS records with DNSSEC.
    sample:
      status: active
      dnssecMultiSigner: false
    unconfigured:
      values:
        status: disabled
      reason: >-
        DNSSEC is disabled on kflare.dev, which nobody has configured (read live 2026-10-22), and the reset deletes it.
