# Default values for the kflare chart. Every key is documented here; see
# docs/deploy.md for a guided install.

# -- Number of controller replicas while autoscaling is off; ignored while it
# is on. Leader election keeps exactly one active; extra replicas only shorten
# failover.
replicaCount: 1

# A HorizontalPodAutoscaler for the controller's Deployment, which owns the
# replica count while it is on. It needs the metrics API (metrics-server).
# Leader election keeps one replica active whatever the count: the replicas it
# adds are standbys, which take over sooner when the leader goes but add no
# reconcile capacity. The leader's use is what rises with load, and the pods'
# average is what the autoscaler compares with its targets.
autoscaling:
  # -- Create the HorizontalPodAutoscaler.
  enabled: true
  # -- Fewest replicas. 2 keeps a standby at all times.
  minReplicas: 1
  # -- Most replicas.
  maxReplicas: 10
  # -- Average CPU use across the pods, as a percentage of
  # resources.requests.cpu, above which replicas are added. Empty leaves CPU
  # out.
  targetCPUUtilizationPercentage: 80
  # -- Average memory use across the pods, as a percentage of
  # resources.requests.memory, above which replicas are added. Empty (the
  # default) leaves memory out: the leader caches every Secret it watches and
  # the standbys cache nothing, so on a cluster with many Secrets a memory
  # target adds standbys that stay, as the leader's memory does not go down.
  targetMemoryUtilizationPercentage:
  # -- The autoscaler's scaling behavior (a HorizontalPodAutoscalerBehavior).
  # Replicas are added only once the pods have been above the target for 2
  # minutes, so that the bursts of a few seconds to a minute that start-up, a
  # failover or a batch of new resources cause add none, and removed after 5
  # minutes below it (Kubernetes' default). Set scaleUp to null for
  # Kubernetes' default, which adds replicas at once.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120

image:
  # -- Controller image repository.
  repository: ghcr.io/jonathangraniero/kflare
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image digest, such as sha256:0123…, run instead of the tag when set:
  # pin the digest whose signature you verified (docs/deploy.md, Verifying a
  # release).
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets for pulling the image from a private registry.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name prefix.
fullnameOverride: ""

crds:
  # -- Install and upgrade the kflare CRDs with the chart. Disable to manage
  # them yourself from config/crd/bases of the matching release.
  enabled: true
  # -- Keep the CRDs when the release is uninstalled. Deleting a CRD deletes
  # every resource of that kind, which (while the controller runs) deletes the
  # matching Cloudflare objects. Only disable this deliberately.
  keep: true

serviceAccount:
  # -- Create the controller's ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the release fullname.
  name: ""
  # -- Annotations for the ServiceAccount.
  annotations: {}

# -- Namespaces whose kflare resources this installation manages, such as
# [team-a, team-b]. The controller neither watches nor caches anything in
# other namespaces, Secrets included, and with rbac.namespaced it holds its
# permissions on Secrets in these namespaces only. It manages a
# CloudflareAccount only if the account's token Secret is in one of them, so
# list the namespace of each token Secret too. Empty manages every namespace.
# See the deploy guide's Scoping an installation.
watchNamespaces: []

# -- A label selector, in kubectl's --selector syntax, that the kflare
# resources and CloudflareAccounts this installation manages must match, such
# as kflare.dev/instance=team-a. It leaves the others alone, their finalizers
# included, so that several installations can share a cluster and its
# namespaces. Empty manages all of them.
watchSelector: ""

rbac:
  # -- Create the ClusterRole/Role and bindings the controller needs.
  create: true
  # -- With watchNamespaces, grant the controller its permissions on Secrets,
  # ConfigMaps and kflare's namespaced kinds with a Role and a RoleBinding in
  # each of those namespaces, which must exist before the chart is installed,
  # and keep its ClusterRole to what is cluster-wide: CloudflareAccounts,
  # reading Namespaces, Events and the metrics reviews. false grants
  # everything with the ClusterRole, as without watchNamespaces.
  namespaced: true
  # -- Create ClusterRoles that add read access to kflare resources to the
  # built-in `view` role, and write access to the namespaced kinds to `edit`
  # and `admin`. CloudflareAccount is never aggregated into `edit`: it points
  # the controller at a token Secret in any namespace.
  aggregateToDefaultRoles: true

# -- Run with leader election. Keep it on whenever replicaCount > 1, and when
# rolling updates can briefly run two pods.
leaderElection: true
# -- The name of the Lease, in the release namespace, that leader election
# holds. Empty: a634e97e.kflare.dev, the name earlier releases used, for an
# installation without watchNamespaces or watchSelector, so that upgrading
# it never runs two leaders at once; `<fullname>.kflare.dev` for one with
# either, so that installations sharing a namespace each have their own.
leaderElectionID: ""

# -- What deleting a kflare resource without a kflare.dev/deletion-policy
# annotation does to the Cloudflare object kflare created for it: delete it,
# or retain it. The annotation always wins, and an object kflare adopted is
# kept unless the annotation says delete.
defaultDeletionPolicy: delete

# -- How long a reconcile may run, as a duration such as 5m or 90s; 0s turns
# the timeout off. A reconcile that runs out of time, such as one waiting on a
# call that gets no answer, ends with reason APIError and is retried with
# back-off, and its controller goes on to the next resource.
reconcileTimeout: 5m
# -- How long after a successful reconcile each resource is checked against
# Cloudflare again, as a duration such as 30m or 1h, so that a change made
# outside kflare (in the dashboard, through the API, by Terraform) is
# corrected within about that long. Empty turns the checks off: a resource is
# then reconciled again only when it, or something it watches, changes, or at
# the 10-hour resync. Each check makes Cloudflare API calls, which count
# against Cloudflare's rate limit: the deploy guide's Configuration says how
# to pick an interval for the number of resources.
driftCheckInterval: ""
# -- How long after a CloudflareAccount is validated it is validated again, as
# a duration such as 1h or 30m: its API token's status and expiry are read
# from Cloudflare, and the account with the token. A token revoked, disabled
# or expired in Cloudflare then shows on its account within about that long,
# with reason TokenDisabled, TokenExpired or TerminalError. 0s turns the
# checks off. Each check makes two Cloudflare API calls per account.
tokenCheckInterval: 1h
# -- How long before its API token expires a CloudflareAccount starts to
# record a TokenExpiresSoon Warning Event at each validation, as a duration
# such as 336h (14 days). 0s records none: a token that is always close to
# its expiry, as one rotated weekly, would otherwise warn all the time. The
# metric kflare_account_token_expiry_timestamp_seconds holds each expiry
# for an alert of your own.
tokenExpiryWarning: 336h
# -- How many requests per five minutes kflare sends with one Cloudflare API
# token, unless the token's CloudflareAccount sets spec.rateLimit. Cloudflare's
# global limit is 1,200, shared with the dashboard and everything else using
# the token; past it, Cloudflare blocks every call for five minutes. 0 turns
# the pacing off, though kflare still stops when Cloudflare asks it to.
cloudflareRateLimit: 900
# -- How many resources of one kind each controller reconciles at once. One
# suits most installations. More lets reconciles that wait on Cloudflare
# overlap, which speeds up a full resync, such as after a restart or a leader
# change, when many accounts with tokens of their own have many resources of
# one kind, or when Cloudflare answers slowly. It never sends more than a
# token's rate limit allows, and the rules of one zone and phase are still
# written one at a time. The deploy guide's Scaling and resources measures it.
maxConcurrentReconciles: 1

logging:
  # -- Log level: debug, info or error.
  level: info
  # -- Log encoding: json or console.
  format: json

metrics:
  # -- Serve Prometheus metrics.
  enabled: true
  # -- Serve metrics over HTTPS, and only to callers whose bearer token the API
  # server authenticates and authorizes for get on /metrics: bind them to the
  # chart's `<fullname>-metrics-reader` ClusterRole. false serves plain HTTP
  # to anyone who can reach the port, as kflare 0.1.0 did.
  secure: true
  # -- Name of a Secret in the release namespace holding the metrics server's
  # certificate (`tls.crt`, `tls.key`, and `ca.crt` for the ServiceMonitor),
  # such as one cert-manager issues for `<fullname>-metrics.<namespace>.svc`.
  # It is reloaded when it changes. Without it, the controller uses a
  # self-signed certificate and the ServiceMonitor skips verification.
  certSecret: ""
  # -- Container port for metrics.
  port: 8080
  service:
    # -- Create a ClusterIP Service for the metrics endpoint.
    enabled: true
    # -- Service port.
    port: 8080
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor (needs its CRDs). With
    # metrics.secure, Prometheus scrapes with its own ServiceAccount token,
    # which must be bound to the metrics-reader ClusterRole.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Extra labels, e.g. to match your Prometheus' serviceMonitorSelector.
    labels: {}
    # -- The scrape's TLS settings (a Prometheus Operator TLSConfig), replacing
    # the default: verify against `ca.crt` of metrics.certSecret, or skip
    # verification without one.
    tlsConfig: {}

# A PodDisruptionBudget that lets a node drain evict one controller pod at a
# time. Only created when replicaCount is above 1, so that a single replica
# never blocks a drain.
podDisruptionBudget:
  # -- Create the PodDisruptionBudget when replicaCount > 1.
  enabled: true
  # -- Pods a disruption may take down at once (a number or a percentage).
  maxUnavailable: 1

# A NetworkPolicy for the controller pods. Off by default: the API server's
# address and port vary by cluster, and a policy that misses them cuts the
# controller off. It needs a CNI that enforces NetworkPolicies.
networkPolicy:
  # -- Create the NetworkPolicy.
  enabled: false
  # -- Sources allowed to reach the metrics port (NetworkPolicy `from` peers),
  # such as your Prometheus' namespace. Empty allows any source. Nothing else
  # may connect, but the kubelet's probes, which policies do not block.
  metricsFrom: []
  dns:
    # -- Where DNS lookups go (NetworkPolicy `to` peers), on port 53.
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
  apiServer:
    # -- Where the Kubernetes API server is (NetworkPolicy `to` peers), such as
    # an ipBlock with the control plane's addresses. Empty allows any address
    # on `apiServer.ports`.
    to: []
    # -- Ports the API server listens on. Most CNIs apply policies after
    # translating the `kubernetes` Service (443) to its endpoints, so include
    # the endpoints' port: `kubectl get endpointslices -n default -l
    # kubernetes.io/service-name=kubernetes`.
    ports:
      - 443
      - 6443
  # -- Extra egress rules (NetworkPolicy egress entries), such as one for an
  # HTTP proxy. Port 443 is always open to any address, for api.cloudflare.com:
  # a NetworkPolicy cannot select a hostname.
  extraEgress: []

# -- Container port for the /healthz and /readyz probes.
healthPort: 8081

# -- Controller resources, measured with hack/sizing (docs/deploy.md, Scaling
# and resources). The CPU request is what autoscaling's CPU target is a share
# of: an idle leader uses about 4m, and one with 5,000 resources reconciled
# every minute about 50m. The CPU limit is above every burst measured but
# one of a few seconds, and Go runs 2 threads under it. The leader caches
# every Secret in the namespaces it watches (watchNamespaces; the whole
# cluster without them): it needs about 16Mi, plus one and a half times the
# size of `kubectl get secrets -A -o json` (or -n for each namespace), plus
# 15Ki per kflare resource. The memory limit fits about 250Mi of Secrets;
# raise both for more.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Pod security context (restricted Pod Security Standard).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container security context (restricted Pod Security Standard).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Extra annotations for the controller pod.
podAnnotations: {}
# -- Extra labels for the controller pod.
podLabels: {}
# -- Priority class for the controller pod.
priorityClassName: ""
# -- Node selector for the controller pod.
nodeSelector: {}
# -- Tolerations for the controller pod.
tolerations: []
# -- Affinity for the controller pod.
affinity: {}
# -- Topology spread constraints for the controller pod.
topologySpreadConstraints: []

# -- Extra command-line arguments for the controller.
extraArgs: []
# -- Extra environment variables for the controller container.
extraEnv: []
# -- Extra volumes for the controller pod.
extraVolumes: []
# -- Extra volume mounts for the controller container.
extraVolumeMounts: []

# A CA bundle to trust besides the public roots, for an egress proxy that
# inspects TLS: it presents its own certificate for api.cloudflare.com, signed
# by your organization's CA. Name a ConfigMap or a Secret in the release's
# namespace, not both. The controller reads the bundle when it starts: restart
# it after the bundle changes. The connection to the Kubernetes API server uses
# the cluster's own CA and is not affected.
trustedCA:
  # -- ConfigMap holding the PEM bundle.
  configMap: ""
  # -- Secret holding the PEM bundle.
  secret: ""
  # -- Key of the bundle in the ConfigMap or Secret.
  key: ca.crt
