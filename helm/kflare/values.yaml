# Default values for the kflare chart. Every key is documented here; see
# docs/deploy.md for a guided install.

# -- Number of controller replicas. Leader election keeps exactly one active;
# extra replicas only shorten failover.
replicaCount: 1

image:
  # -- Controller image repository.
  repository: ghcr.io/jonathangraniero/kflare
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets for pulling the image from a private registry.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name prefix.
fullnameOverride: ""

crds:
  # -- Install and upgrade the kflare CRDs with the chart. Disable to manage
  # them yourself from config/crd/bases of the matching release.
  enabled: true
  # -- Keep the CRDs when the release is uninstalled. Deleting a CRD deletes
  # every resource of that kind, which (while the controller runs) deletes the
  # matching Cloudflare objects. Only disable this deliberately.
  keep: true

serviceAccount:
  # -- Create the controller's ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the release fullname.
  name: ""
  # -- Annotations for the ServiceAccount.
  annotations: {}

rbac:
  # -- Create the ClusterRole/Role and bindings the controller needs.
  create: true
  # -- Create ClusterRoles that add read access to kflare resources to the
  # built-in `view` role, and write access to the namespaced kinds to `edit`
  # and `admin`. CloudflareAccount is never aggregated into `edit`: it points
  # the controller at a token Secret in any namespace.
  aggregateToDefaultRoles: true

# -- Run with leader election. Keep it on whenever replicaCount > 1, and when
# rolling updates can briefly run two pods.
leaderElection: true

# -- What deleting a kflare resource without a kflare.dev/deletion-policy
# annotation does to the Cloudflare object kflare created for it: delete it,
# or retain it. The annotation always wins, and an object kflare adopted is
# kept unless the annotation says delete.
defaultDeletionPolicy: delete

# -- How long a reconcile may run, as a duration such as 5m or 90s; 0s turns
# the timeout off. A reconcile that runs out of time, such as one waiting on a
# call that gets no answer, ends with reason APIError and is retried with
# back-off, and its controller goes on to the next resource.
reconcileTimeout: 5m
# -- How long after a successful reconcile each resource is checked against
# Cloudflare again, as a duration such as 30m or 1h, so that a change made
# outside kflare (in the dashboard, through the API, by Terraform) is
# corrected within about that long. Empty turns the checks off: a resource is
# then reconciled again only when it, or something it watches, changes, or at
# the 10-hour resync. Each check makes Cloudflare API calls, which count
# against Cloudflare's rate limit: the deploy guide's Configuration says how
# to pick an interval for the number of resources.
driftCheckInterval: ""

logging:
  # -- Log level: debug, info or error.
  level: info
  # -- Log encoding: json or console.
  format: json

metrics:
  # -- Serve Prometheus metrics.
  enabled: true
  # -- Serve metrics over HTTPS, and only to callers whose bearer token the API
  # server authenticates and authorizes for get on /metrics: bind them to the
  # chart's `<fullname>-metrics-reader` ClusterRole. false serves plain HTTP
  # to anyone who can reach the port, as kflare 0.1.0 did.
  secure: true
  # -- Name of a Secret in the release namespace holding the metrics server's
  # certificate (`tls.crt`, `tls.key`, and `ca.crt` for the ServiceMonitor),
  # such as one cert-manager issues for `<fullname>-metrics.<namespace>.svc`.
  # It is reloaded when it changes. Without it, the controller uses a
  # self-signed certificate and the ServiceMonitor skips verification.
  certSecret: ""
  # -- Container port for metrics.
  port: 8080
  service:
    # -- Create a ClusterIP Service for the metrics endpoint.
    enabled: true
    # -- Service port.
    port: 8080
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor (needs its CRDs). With
    # metrics.secure, Prometheus scrapes with its own ServiceAccount token,
    # which must be bound to the metrics-reader ClusterRole.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Extra labels, e.g. to match your Prometheus' serviceMonitorSelector.
    labels: {}
    # -- The scrape's TLS settings (a Prometheus Operator TLSConfig), replacing
    # the default: verify against `ca.crt` of metrics.certSecret, or skip
    # verification without one.
    tlsConfig: {}

# A PodDisruptionBudget that lets a node drain evict one controller pod at a
# time. Only created when replicaCount is above 1, so that a single replica
# never blocks a drain.
podDisruptionBudget:
  # -- Create the PodDisruptionBudget when replicaCount > 1.
  enabled: true
  # -- Pods a disruption may take down at once (a number or a percentage).
  maxUnavailable: 1

# A NetworkPolicy for the controller pods. Off by default: the API server's
# address and port vary by cluster, and a policy that misses them cuts the
# controller off. It needs a CNI that enforces NetworkPolicies.
networkPolicy:
  # -- Create the NetworkPolicy.
  enabled: false
  # -- Sources allowed to reach the metrics port (NetworkPolicy `from` peers),
  # such as your Prometheus' namespace. Empty allows any source. Nothing else
  # may connect, but the kubelet's probes, which policies do not block.
  metricsFrom: []
  dns:
    # -- Where DNS lookups go (NetworkPolicy `to` peers), on port 53.
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
  apiServer:
    # -- Where the Kubernetes API server is (NetworkPolicy `to` peers), such as
    # an ipBlock with the control plane's addresses. Empty allows any address
    # on `apiServer.ports`.
    to: []
    # -- Ports the API server listens on. Most CNIs apply policies after
    # translating the `kubernetes` Service (443) to its endpoints, so include
    # the endpoints' port: `kubectl get endpointslices -n default -l
    # kubernetes.io/service-name=kubernetes`.
    ports:
      - 443
      - 6443
  # -- Extra egress rules (NetworkPolicy egress entries), such as one for an
  # HTTP proxy. Port 443 is always open to any address, for api.cloudflare.com:
  # a NetworkPolicy cannot select a hostname.
  extraEgress: []

# -- Container port for the /healthz and /readyz probes.
healthPort: 8081

# -- Controller resources. The controller is light; raise the memory limit
# for clusters with many Secrets, which it caches.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# -- Pod security context (restricted Pod Security Standard).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container security context (restricted Pod Security Standard).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Extra annotations for the controller pod.
podAnnotations: {}
# -- Extra labels for the controller pod.
podLabels: {}
# -- Priority class for the controller pod.
priorityClassName: ""
# -- Node selector for the controller pod.
nodeSelector: {}
# -- Tolerations for the controller pod.
tolerations: []
# -- Affinity for the controller pod.
affinity: {}
# -- Topology spread constraints for the controller pod.
topologySpreadConstraints: []

# -- Extra command-line arguments for the controller.
extraArgs: []
# -- Extra environment variables for the controller container.
extraEnv: []
