{{- if and .Values.metrics.certSecret (not .Values.metrics.secure) }}
{{- fail "metrics.certSecret needs metrics.secure: the certificate is for HTTPS" }}
{{- end }}
{{- if and .Values.trustedCA.configMap .Values.trustedCA.secret }}
{{- fail "trustedCA takes a configMap or a secret, not both" }}
{{- end }}
{{- $trustedCA := or .Values.trustedCA.configMap .Values.trustedCA.secret }}
{{- if $trustedCA }}
{{- range .Values.extraEnv }}
{{- if eq .name "SSL_CERT_DIR" }}
{{- fail "trustedCA sets SSL_CERT_DIR: remove it from extraEnv" }}
{{- end }}
{{- end }}
{{- end }}
{{- $metricsCerts := and .Values.metrics.enabled .Values.metrics.certSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kflare.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kflare.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kflare.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kflare.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ include "kflare.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/manager"]
          args:
            - --leader-elect={{ .Values.leaderElection }}
            {{- with include "kflare.leaderElectionID" . }}
            - --leader-election-id={{ . }}
            {{- end }}
            {{- with .Values.watchNamespaces }}
            - --watch-namespaces={{ join "," . }}
            {{- end }}
            {{- with .Values.watchSelector }}
            - {{ printf "--watch-selector=%s" . | quote }}
            {{- end }}
            - --default-deletion-policy={{ .Values.defaultDeletionPolicy }}
            - --reconcile-timeout={{ .Values.reconcileTimeout }}
            {{- with .Values.driftCheckInterval }}
            - --drift-check-interval={{ . }}
            {{- end }}
            - --cloudflare-rate-limit={{ int .Values.cloudflareRateLimit }}
            - --health-probe-bind-address=:{{ .Values.healthPort }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- if .Values.metrics.certSecret }}
            - --metrics-cert-path=/etc/kflare/metrics-certs
            {{- end }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --zap-devel=false
            - --zap-log-level={{ .Values.logging.level }}
            - --zap-encoder={{ .Values.logging.format }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $trustedCA .Values.extraEnv }}
          env:
            {{- if $trustedCA }}
            # Go reads the system bundle, then every certificate in these directories.
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/kflare/trusted-ca
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or $metricsCerts $trustedCA .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if $metricsCerts }}
            - name: metrics-certs
              mountPath: /etc/kflare/metrics-certs
              readOnly: true
            {{- end }}
            {{- if $trustedCA }}
            - name: trusted-ca
              mountPath: /etc/kflare/trusted-ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $metricsCerts $trustedCA .Values.extraVolumes }}
      volumes:
        {{- if $metricsCerts }}
        - name: metrics-certs
          secret:
            secretName: {{ .Values.metrics.certSecret }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- if .Values.trustedCA.configMap }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.trustedCA.configMap }}
            items:
              - key: {{ .Values.trustedCA.key }}
                path: ca.crt
        {{- else if .Values.trustedCA.secret }}
        - name: trusted-ca
          secret:
            secretName: {{ .Values.trustedCA.secret }}
            items:
              - key: {{ .Values.trustedCA.key }}
                path: ca.crt
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
