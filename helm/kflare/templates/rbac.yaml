{{- if .Values.rbac.create }}
{{- $namespaced := include "kflare.namespacedRBAC" . }}
# Permissions the controller needs, generated from the kubebuilder RBAC
# markers (config/rbac/role.yaml) by hack/sync-helm-chart.sh.
{{- $secretNamespaces := include "kflare.secretNamespaces" . }}
{{- if $namespaced }}
# With watchNamespaces and rbac.namespaced, only those on what is cluster-wide
# (hack/chartrbac): a Role in each watched namespace grants the others.
{{- else if $secretNamespaces }}
# All but those on Secrets, which a Role grants in the release namespace and in
# each of secretNamespaces.
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kflare.fullname" . }}-manager
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
rules:
{{- if $namespaced }}
{{ .Files.Get "files/manager-cluster-rules.yaml" | trimSuffix "\n" }}
{{- else }}
{{ .Files.Get "files/manager-rules.yaml" | trimSuffix "\n" }}
{{- if not $secretNamespaces }}
{{ .Files.Get "files/manager-secret-rules.yaml" | trimSuffix "\n" }}
{{- end }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.secure }}
# Authenticate and authorize metrics requests (metrics.secure).
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kflare.fullname" . }}-manager
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kflare.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "kflare.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if $namespaced }}
{{- range $namespace := .Values.watchNamespaces }}
---
# The controller's permissions on Secrets, ConfigMaps and kflare's namespaced
# kinds in a namespace it watches (hack/chartrbac).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kflare.fullname" $ }}-manager
  namespace: {{ $namespace }}
  labels:
    {{- include "kflare.labels" $ | nindent 4 }}
rules:
{{ $.Files.Get "files/manager-namespaced-rules.yaml" | trimSuffix "\n" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kflare.fullname" $ }}-manager
  namespace: {{ $namespace }}
  labels:
    {{- include "kflare.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kflare.fullname" $ }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "kflare.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if $secretNamespaces }}
{{- range $namespace := splitList "," $secretNamespaces }}
---
# The controller's permissions on Secrets, in a namespace where it may use
# them: the release's, or one of secretNamespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kflare.fullname" $ }}-manager-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "kflare.labels" $ | nindent 4 }}
rules:
{{ $.Files.Get "files/manager-secret-rules.yaml" | trimSuffix "\n" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kflare.fullname" $ }}-manager-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "kflare.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kflare.fullname" $ }}-manager-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kflare.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.leaderElection }}
---
# Leader election uses a Lease (and Events) in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kflare.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kflare.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kflare.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kflare.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.secure }}
---
# Grants get on /metrics. Bind your Prometheus' ServiceAccount to it so that it
# can scrape the controller (metrics.secure).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kflare.fullname" . }}-metrics-reader
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
{{- end }}
{{- if .Values.rbac.aggregateToDefaultRoles }}
---
# Read access to every kflare kind for anyone with the built-in view role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kflare.fullname" . }}-view
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["kflare.dev"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
# Write access to the namespaced kinds for the built-in edit and admin roles.
# CloudflareAccount is deliberately left out: it can point the controller at a
# token Secret in any namespace where it may use Secrets, so only cluster
# administrators manage it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kflare.fullname" . }}-edit
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["kflare.dev"]
    resources:
      # +kflare-gen:begin The kinds in generator/generator.yaml: make codegen keeps this block.
      - cacherules
      - configurationrules
      - d1databases
      - dnsrecords
      - iplists
      - kvnamespaces
      - managedrulesets
      - managedtransforms
      - originrules
      - r2buckets
      - ratelimitrules
      - redirectrules
      - transformrules
      - tunnels
      - tunnelconfigurations
      - wafcustomrules
      - workerroutes
      - workerscripts
      - zones
      # +kflare-gen:end
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
{{- end }}
{{- end }}
