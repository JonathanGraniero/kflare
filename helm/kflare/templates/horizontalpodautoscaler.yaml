{{- if .Values.autoscaling.enabled }}
{{- $a := .Values.autoscaling }}
{{- if gt (int $a.minReplicas) (int $a.maxReplicas) }}
{{- fail "autoscaling.minReplicas cannot be above autoscaling.maxReplicas" }}
{{- end }}
{{- if and (gt (int $a.maxReplicas) 1) (not .Values.leaderElection) }}
{{- fail "autoscaling with maxReplicas above 1 needs leaderElection: without it, every replica reconciles" }}
{{- end }}
{{- if not (or $a.targetCPUUtilizationPercentage $a.targetMemoryUtilizationPercentage) }}
{{- fail "autoscaling needs targetCPUUtilizationPercentage, targetMemoryUtilizationPercentage or both" }}
{{- end }}
{{- $requests := (.Values.resources).requests | default dict }}
{{- if and $a.targetCPUUtilizationPercentage (not $requests.cpu) }}
{{- fail "autoscaling.targetCPUUtilizationPercentage needs resources.requests.cpu: utilization is a share of it" }}
{{- end }}
{{- if and $a.targetMemoryUtilizationPercentage (not $requests.memory) }}
{{- fail "autoscaling.targetMemoryUtilizationPercentage needs resources.requests.memory: utilization is a share of it" }}
{{- end }}
# Scales the controller's Deployment on its pods' average use of their
# requests. Only the leader reconciles: the replicas it adds are standbys,
# which take over sooner when the leader goes, not more reconcile capacity.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kflare.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kflare.fullname" . }}
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    {{- with $a.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with $a.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  {{- with $a.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
