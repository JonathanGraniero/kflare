{{- if and .Values.metrics.enabled .Values.metrics.service.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kflare.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kflare.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.metrics.secure }}
      scheme: https
      # Prometheus' own ServiceAccount token, which needs get on /metrics: bind
      # it to the {{ include "kflare.fullname" . }}-metrics-reader ClusterRole.
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        {{- if .Values.metrics.serviceMonitor.tlsConfig }}
        {{- toYaml .Values.metrics.serviceMonitor.tlsConfig | nindent 8 }}
        {{- else if .Values.metrics.certSecret }}
        serverName: {{ include "kflare.fullname" . }}-metrics.{{ .Release.Namespace }}.svc
        ca:
          secret:
            name: {{ .Values.metrics.certSecret }}
            key: ca.crt
        {{- else }}
        # The controller's certificate is self-signed (metrics.certSecret is unset).
        insecureSkipVerify: true
        {{- end }}
      {{- end }}
{{- end }}
