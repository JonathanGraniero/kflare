{{- $replicas := ternary .Values.autoscaling.maxReplicas .Values.replicaCount .Values.autoscaling.enabled }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int $replicas) 1) }}
# Lets a node drain evict the controller pods one at a time. It is only
# created when the Deployment can run more than one replica (replicaCount, or
# autoscaling.maxReplicas while autoscaling is on).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kflare.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kflare.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  # A pod that is not ready can always be evicted: it is not doing any work.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "kflare.selectorLabels" . | nindent 6 }}
{{- end }}
