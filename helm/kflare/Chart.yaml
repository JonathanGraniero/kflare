apiVersion: v2
name: kflare
description: >-
  A Kubernetes operator that manages Cloudflare through custom resources: zones, DNS records, tunnels, Workers and
  their storage, WAF rules and the Rules products.
type: application
# Chart and application are released together from a vX.Y.Z tag; the release
# workflow refuses a tag that does not match this version.
version: 0.4.3
appVersion: "0.4.3"
# kflare supports Kubernetes 1.34 and newer.
kubeVersion: ">=1.34.0-0"
home: https://github.com/JonathanGraniero/kflare
sources:
  - https://github.com/JonathanGraniero/kflare
keywords:
  - cloudflare
  - operator
  - dns
  - tunnel
  - workers
  - gitops
maintainers:
  - name: Jonathan Graniero
    url: https://github.com/JonathanGraniero
# What Artifact Hub shows on the chart's page: https://artifacthub.io/docs/topics/annotations/helm/.
# Keep annotations the last key: make helm rewrites everything after the marker line.
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: networking
  artifacthub.io/operator: "true"
  # Raise it with the API's stability: upgrading to v0.3.0 needs manifests rewritten by hand.
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/links: |
    - name: Deploy guide
      url: https://github.com/JonathanGraniero/kflare/blob/main/docs/deploy.md
    - name: Architecture
      url: https://github.com/JonathanGraniero/kflare/blob/main/ARCHITECTURE.md
    - name: Changelog and upgrade steps
      url: https://github.com/JonathanGraniero/kflare/blob/main/CHANGELOG.md
    - name: Discussions
      url: https://github.com/JonathanGraniero/kflare/discussions
    - name: support
      url: https://github.com/JonathanGraniero/kflare/issues/new/choose
  # Generated by hack/chartannotations (make helm). DO NOT EDIT below this line.
  artifacthub.io/changes: |
    - description: 'A renamed resource keeps its Cloudflare object. Changing a resource''s
        `metadata.name`, as a kustomize `namePrefix`, a Helm `fullnameOverride` or a cdk8s
        construct ID does, used to delete the object with the old resource and create
        it again for the new one, up to a minute later: a DNS record left its zone, a
        tunnel got a new ID and token, and a KV namespace or a D1 database lost its data.
        kflare now hands the object to the new resource when the old one is deleted, if
        the new one is in the same namespace and describes the same object. Nothing is
        written to Cloudflare, the object keeps its ID, and the new resource is `Ready`
        within seconds. It applies to `DNSRecord`, `WorkerRoute`, `Tunnel`, `TunnelConfiguration`,
        `WorkerScript`, `KVNamespace`, `D1Database`, `R2Bucket` and `IPList`. An Event
        with reason `HandedOff` on both resources records it (deploy guide, #153)'
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.3/docs/deploy.md#renaming-a-resource
      - name: '#153'
        url: https://github.com/JonathanGraniero/kflare/issues/153
    - description: 'The new resource owns the object as the old one did: one kflare created
        is deleted with it, one it adopted is kept. The old resource''s `kflare.dev/deletion-policy`
        does not stop the hand-off, `delete` included'
    - description: A resource waiting for another's object no longer waits a minute. When
        the resource it conflicts with is deleted, a resource reporting `NameConflict`,
        `TitleConflict`, `PatternConflict` or `TunnelAlreadyConfigured` is reconciled
        at once. A renamed `IPList` whose list a rule uses no longer blocks the old one's
        deletion with `ListInUse`
    - description: 'Not handed off: a `Zone` and a `ManagedTransform`, and a rename that
        moves a resource to another namespace. The deploy guide gives the steps for those'
    - description: 'An installation can be limited to some namespaces. The chart''s `watchNamespaces`
        lists them (the controller''s `--watch-namespaces`): the controller neither watches
        nor caches anything elsewhere, Secrets included, and the chart grants its permissions
        on Secrets, ConfigMaps and the kflare kinds with a Role in each of them, keeping
        its ClusterRole to `CloudflareAccount`s, reading Namespaces and creating Events
        (`rbac.namespaced`, on by default). It manages the `CloudflareAccount`s whose
        token Secret is in one of them (deploy guide, #79)'
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.3/docs/deploy.md#scoping-an-installation
      - name: '#79'
        url: https://github.com/JonathanGraniero/kflare/issues/79
    - description: Or to the resources that carry some labels. With `watchSelector` (`--watch-selector`),
        such as `kflare.dev/instance=team-a`, an installation manages only the kflare
        resources and `CloudflareAccount`s whose labels match, and leaves the others alone,
        their finalizers included
    - description: 'Several installations can share a cluster, each scoped to namespaces
        or labels of its own, for a team''s or an environment''s own token, permissions
        and blast radius. Every release but one sets `crds.enabled: false`, and the chart
        names a scoped installation''s leader election Lease after its release, so that
        installations sharing a namespace each lead: `leaderElectionID` (`--leader-election-id`)
        names it yourself (deploy guide)'
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.3/docs/deploy.md#several-installations-in-one-cluster
    - description: 'A new reason, `NotWatched`, reports a resource whose `CloudflareAccount`,
        `Zone` or other reference is outside its installation''s scope, and kflare makes
        no Cloudflare call for it. The deploy guide''s Argo CD and Flux health checks
        report it Degraded and Failed: update your copies of them before you scope an
        installation'
    - description: 'Where two installations of one Cloudflare account meet, kflare says
        so. `AlreadyExists` names the `CloudflareAccount` through which another installation
        may manage the object, rather than only advising to adopt it, which would have
        both manage it. A rule resource whose phase holds rules kflare wrote for resources
        its installation does not manage records a Warning Event with reason `OtherKflareRules`:
        kflare orders only its own rules in a phase. Any installation records it, for
        another cluster''s rules or those a deletion with the retain policy kept'
    - description: Nothing else changes without them. An installation with neither value
        renders as before, and keeps its leader election Lease, so upgrading it never
        runs two leaders
    - description: 'A `CloudflareAccount` shows its token''s status and expiry. `status.tokenStatus`
        (`active`, `disabled` or `expired`) and `status.tokenExpiresAt`, which `kubectl
        get cloudflareaccounts` shows as `TOKEN EXPIRES`, come from Cloudflare''s token
        verification, for account-owned and user tokens alike, which takes no permission
        beyond the token (deploy guide, #74)'
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.3/docs/deploy.md#3-connect-your-cloudflare-account
      - name: '#74'
        url: https://github.com/JonathanGraniero/kflare/issues/74
    - description: 'An expired or disabled token turns its account `Ready=False` with
        a reason of its own, `TokenExpired` or `TokenDisabled`, where it was `TerminalError`
        with Cloudflare''s "Invalid access token". The deploy guide''s Argo CD and Flux
        health checks report both Degraded and Failed: update your copies of them'
    - description: Each account is validated again every hour (`tokenCheckInterval`, the
        controller's `--token-check-interval`; `0s` turns it off), and just after its
        token expires, so a token disabled, expired or deleted in Cloudflare shows within
        the hour, where it could take until the 10-hour resync. Each check makes two Cloudflare
        API calls
    - description: A warning before the token expires. From 14 days before (`tokenExpiryWarning`,
        `--token-expiry-warning`; `0s` turns it off), each check records a `TokenExpiresSoon`
        Warning Event on the account, and the new metric `kflare_account_token_expiry_timestamp_seconds{account}`
        holds the expiry for an alert of your own (Monitoring)
      links:
      - name: Monitoring
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.3/docs/deploy.md#monitoring
    - description: 'Each controller can reconcile several resources at once. The chart''s
        `maxConcurrentReconciles` (the controller''s `--max-concurrent-reconciles`), 1
        by default as before, sets how many resources of one kind a controller reconciles
        at once. A restart or a change of leader then gets through many accounts'' resources
        sooner: measured against a stand-in for Cloudflare answering in 200 ms, 1,000
        resources over 20 accounts with tokens of their own took 3 minutes 24 seconds
        one at a time and 13 seconds 16 at once. Every call still goes through its token''s
        budget, so it never sends more than `cloudflareRateLimit` allows (deploy guide,
        #70)'
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.3/docs/deploy.md#reconciles-at-once
      - name: '#70'
        url: https://github.com/JonathanGraniero/kflare/issues/70
    - description: The rules of one zone and phase are still written one at a time, whatever
        their kind, so that each goes where a fresh read of the ruleset puts it, and resources
        of a kind that find, adopt or create an object by the same key take turns, so
        that only one creates it and the other reports the conflict
    - description: '`hack/resync` (`make resync`) times a full resync with each setting,
        running the manager against an envtest API server and a stand-in for Cloudflare''s
        API reached through a proxy, as the deploy guide''s table was measured'
    - description: 'Merging a version bump releases it. Once CI and E2E pass on the merge
        commit, the `Tag release` workflow tags it, and the `Release` workflow publishes
        the GitHub release after checking the image''s and the chart''s signatures as
        the deploy guide''s Verifying a release does. The notes now keep each paragraph
        on one line and link to CHANGELOG.md at the tag: a release page shows every line
        break, and gives its headings no anchors for a link to go to'
      links:
      - name: Verifying a release
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.3/docs/deploy.md#verifying-a-release
    - description: Upgrades from the last release are tested in CI. The `E2E` workflow
        installs the last release's chart with a resource of each kind, upgrades it to
        the new chart and checks that every resource is kept, still applies as a GitOps
        sync would, and is reconciled again. A release is tagged only once it passes.
        The `Live E2E` workflow runs it against Cloudflare too, where the new controller
        must find each resource in sync and write nothing to Cloudflare
    - description: A breaking change to a CRD is listed under "Breaking changes". CI compares
        the CRDs with the last release's and fails on a change that a manifest written
        for it may not fit, such as a field removed or a tighter enum, unless the release
        notes name its kind under that heading and say how to upgrade
    - description: A versioning and support policy. Versioning and support says what a
        patch and a minor release may change, which Kubernetes versions a release supports
        (the four newest minors), how long a release gets fixes (the minor before the
        latest gets security fixes for three months after the latest comes out), how kflare's
        API versions are deprecated, and what a kind needs to become `v1beta1` (#87)
      links:
      - name: Versioning and support
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.3/docs/versioning.md
      - name: '#87'
        url: https://github.com/JonathanGraniero/kflare/issues/87
    - description: Security fixes for the minor release before the latest. Its patch releases
        come from a `release-0.Y` branch, protected as `main` is, whose pull requests
        CI, the dependency review and the E2E tests check, the upgrade from the minor
        release's last patch included. The weekly scan of the released images now covers
        the newest patch of the minor release before the latest during its three months
        of security fixes, and the `Release` workflow refuses a tag on a commit that is
        on neither `main` nor its minor release's branch (#157)
      links:
      - name: '#157'
        url: https://github.com/JonathanGraniero/kflare/issues/157
    - description: 'Argo CD without the metrics API. On a cluster without metrics-server,
        Argo CD reports the application that installs kflare Degraded, though the controller
        runs: the chart''s autoscaler cannot read its CPU. The deploy guide now says so,
        and how to avoid it (deploy guide)'
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.3/docs/deploy.md#with-argo-cd-or-flux
    - description: The live suite checks the Argo CD and Flux health checks. Every resource
        the live specs wait for must be Healthy and Current for its current generation,
        and one Cloudflare refuses or that exists without an adoption policy Degraded
        and Failed, so both checks are tested on what kflare writes against Cloudflare.
        Their test inputs hold statuses from a run against Cloudflare (#83)
      links:
      - name: '#83'
        url: https://github.com/JonathanGraniero/kflare/issues/83
    - description: A live run leaves no empty entry points in the test zone. The live
        suite and the upgrade specs delete the ruleset entry points their rules made,
        once those are empty; one the zone had before the run, or one that holds a rule
        the run did not write, stays (#57)
      links:
      - name: '#57'
        url: https://github.com/JonathanGraniero/kflare/issues/57
  artifacthub.io/crds: |
    - description: 'CacheRule manages one cache rule in a zone: how Cloudflare caches
        the responses to the requests its expression matches, at the edge and in browsers.'
      displayName: CacheRule
      kind: CacheRule
      name: cacherules.kflare.dev
      version: v1alpha1
    - description: CloudflareAccount is cluster-scoped and holds credentials for a single
        Cloudflare account.
      displayName: CloudflareAccount
      kind: CloudflareAccount
      name: cloudflareaccounts.kflare.dev
      version: v1alpha1
    - description: 'ConfigurationRule manages one configuration rule in a zone: settings,
        such as the SSL mode or the security level, changed for the requests its expression
        matches.'
      displayName: ConfigurationRule
      kind: ConfigurationRule
      name: configurationrules.kflare.dev
      version: v1alpha1
    - description: D1Database represents a Cloudflare D1 database.
      displayName: D1Database
      kind: D1Database
      name: d1databases.kflare.dev
      version: v1alpha1
    - description: DNSRecord represents a DNS record within a Cloudflare-managed zone.
      displayName: DNSRecord
      kind: DNSRecord
      name: dnsrecords.kflare.dev
      version: v1alpha1
    - description: IPList manages a custom IP list in a Cloudflare account.
      displayName: IPList
      kind: IPList
      name: iplists.kflare.dev
      version: v1alpha1
    - description: KVNamespace represents a Cloudflare Workers KV namespace.
      displayName: KVNamespace
      kind: KVNamespace
      name: kvnamespaces.kflare.dev
      version: v1alpha1
    - description: ManagedRuleset deploys a Cloudflare managed ruleset to a zone, as an
        execute rule in its http_request_firewall_managed phase; the expression selects
        the requests the ruleset inspects, and "true" selects every request.
      displayName: ManagedRuleset
      kind: ManagedRuleset
      name: managedrulesets.kflare.dev
      version: v1alpha1
    - description: 'ManagedTransform turns a zone''s managed transforms on and off: the
        request and response headers Cloudflare adds or removes for the zone.'
      displayName: ManagedTransform
      kind: ManagedTransform
      name: managedtransforms.kflare.dev
      version: v1alpha1
    - description: 'OriginRule manages one origin rule in a zone: the requests its expression
        matches reach the origin on another destination port.'
      displayName: OriginRule
      kind: OriginRule
      name: originrules.kflare.dev
      version: v1alpha1
    - description: R2Bucket represents a Cloudflare R2 bucket.
      displayName: R2Bucket
      kind: R2Bucket
      name: r2buckets.kflare.dev
      version: v1alpha1
    - description: 'RateLimitRule manages one rate limiting rule in a zone, in its http_ratelimit
        phase: the rule counts the requests its expression matches, and once a client
        sends more than requestsPerPeriod of them in a period, the action applies to the
        client''s matching requests for the mitigation timeout.'
      displayName: RateLimitRule
      kind: RateLimitRule
      name: ratelimitrules.kflare.dev
      version: v1alpha1
    - description: 'RedirectRule manages one single redirect in a zone: Cloudflare answers
        the requests its expression matches with a redirect to a URL, a static one or
        one an expression computes.'
      displayName: RedirectRule
      kind: RedirectRule
      name: redirectrules.kflare.dev
      version: v1alpha1
    - description: 'TransformRule manages one transform rule in a zone: a rewrite of the
        URL a request reaches the origin with, or a change to its request or response
        headers.'
      displayName: TransformRule
      kind: TransformRule
      name: transformrules.kflare.dev
      version: v1alpha1
    - description: Tunnel represents a remotely-managed Cloudflare Tunnel and the Secret
        holding the token a cloudflared connector needs to run it.
      displayName: Tunnel
      kind: Tunnel
      name: tunnels.kflare.dev
      version: v1alpha1
    - description: TunnelConfiguration owns the complete ingress configuration of one
        remotely-managed Tunnel.
      displayName: TunnelConfiguration
      kind: TunnelConfiguration
      name: tunnelconfigurations.kflare.dev
      version: v1alpha1
    - description: 'WAFCustomRule manages one WAF custom rule in a zone, in its http_request_firewall_custom
        phase: the rule blocks or challenges the requests its expression matches, or lets
        them skip other security features.'
      displayName: WAFCustomRule
      kind: WAFCustomRule
      name: wafcustomrules.kflare.dev
      version: v1alpha1
    - description: WorkerRoute routes requests matching a URL pattern in a zone to a WorkerScript,
        or, without one, excludes the pattern from a broader route.
      displayName: WorkerRoute
