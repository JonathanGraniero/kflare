apiVersion: v2
name: kflare
description: >-
  A Kubernetes operator that manages Cloudflare through custom resources: zones, DNS records, tunnels, Workers and
  their storage, WAF rules and the Rules products.
type: application
# Chart and application are released together from a vX.Y.Z tag; the release
# workflow refuses a tag that does not match this version.
version: 0.4.2
appVersion: "0.4.2"
# kflare supports Kubernetes 1.34 and newer.
kubeVersion: ">=1.34.0-0"
home: https://github.com/JonathanGraniero/kflare
sources:
  - https://github.com/JonathanGraniero/kflare
keywords:
  - cloudflare
  - operator
  - dns
  - tunnel
  - workers
  - gitops
maintainers:
  - name: Jonathan Graniero
    url: https://github.com/JonathanGraniero
# What Artifact Hub shows on the chart's page: https://artifacthub.io/docs/topics/annotations/helm/.
# Keep annotations the last key: make helm rewrites everything after the marker line.
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: networking
  artifacthub.io/operator: "true"
  # Raise it with the API's stability: upgrading to v0.3.0 needs manifests rewritten by hand.
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/links: |
    - name: Deploy guide
      url: https://github.com/JonathanGraniero/kflare/blob/main/docs/deploy.md
    - name: Architecture
      url: https://github.com/JonathanGraniero/kflare/blob/main/ARCHITECTURE.md
    - name: Changelog and upgrade steps
      url: https://github.com/JonathanGraniero/kflare/blob/main/CHANGELOG.md
    - name: Discussions
      url: https://github.com/JonathanGraniero/kflare/discussions
    - name: support
      url: https://github.com/JonathanGraniero/kflare/issues/new/choose
  # Generated by hack/chartannotations (make helm). DO NOT EDIT below this line.
  artifacthub.io/changes: |
    - description: kflare keeps to Cloudflare's API rate limit, per API token. All of
        a token's calls share one budget, across both Cloudflare SDKs and every controller,
        where before each reconcile had a limiter of its own, on one SDK only. Set it
        with the chart's new `cloudflareRateLimit`, or `spec.rateLimit` on a `CloudflareAccount`,
        for an account whose limit Cloudflare raised (deploy guide). (#73)
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.2/docs/deploy.md#cloudflares-api-rate-limit
      - name: '#73'
        url: https://github.com/JonathanGraniero/kflare/issues/73
    - description: An account past its limit no longer holds up the others. A 429 could
        keep a kind's only worker asleep inside a reconcile for the length of Cloudflare's
        block, up to the 5-minute reconcile timeout, for every account the manager serves.
        kflare now stops calling with that token and moves on, and also gives way when
        Cloudflare reports that a limit is nearly spent. Reconciles that wait take turns,
        with resources that have a change to make ahead of those only being checked, so
        a restart's backlog does not delay a change
    - description: A rate limit no longer turns resources `Ready=False`. A resource that
        was `Ready` stays so, a `CloudflareAccount` included, whose going not-ready used
        to stop everything using it. Any other reports the new reason `RateLimited`
    - description: 'Two metrics: `kflare_cloudflare_api_rate_limited_total` and `kflare_cloudflare_reconciles_deferred_total`,
        by account'
    - description: kflare's own metrics. `kflare_cloudflare_api_requests_total` and `kflare_cloudflare_api_request_duration_seconds`
        show what each controller sends to Cloudflare and how it answers, for both SDKs,
        `kflare_resources` how many resources are `Ready` and why not, by kind, and `kflare_drift_corrections_total`
        how often kflare undoes a change made outside it. So an alert no longer needs
        kube-state-metrics to see a resource that is not `Ready`, and can tell Cloudflare
        failing from the Kubernetes API failing. The deploy guide's alert examples use
        them. (#75)
      links:
      - name: alert examples
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.2/docs/deploy.md#monitoring
      - name: '#75'
        url: https://github.com/JonathanGraniero/kflare/issues/75
    - description: 'A failure now gives Cloudflare''s `cf-ray` ID, which Cloudflare support
        asks for: the log for each response with an error status, and a `TerminalError`
        or `APIError` condition for the first response that failed that way'
    - description: A `CloudflareAccount` can limit which namespaces may use it. With `spec.allowedNamespaces`,
        a label selector picks the namespaces, the way a Gateway API listener's `allowedRoutes`
        does. A resource in any other namespace reports reason `AccountNotAllowed`, and
        kflare makes no Cloudflare call for it, so a team that can edit its own namespace
        can no longer use another team's token (deploy guide). (#77)
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.2/docs/deploy.md#limiting-which-namespaces-may-use-an-account
      - name: '#77'
        url: https://github.com/JonathanGraniero/kflare/issues/77
    - description: 'Trust your organization''s CA, for a proxy that inspects TLS. Behind
        an egress proxy that presents its own certificate for `api.cloudflare.com`, every
        call failed with `x509: certificate signed by unknown authority`, since the image
        trusts only the public roots. `trustedCA` names a ConfigMap or Secret holding
        a PEM bundle, which the controller trusts besides the public roots. `extraVolumes`
        and `extraVolumeMounts` are new too (deploy guide, #89)'
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.2/docs/deploy.md#network-access
      - name: '#89'
        url: https://github.com/JonathanGraniero/kflare/issues/89
    - description: 'Health checks for Argo CD and Flux. Argo CD judged no kflare resource,
        and Flux''s default check took one for ready before kflare had reconciled it.
        The deploy guide now has a health check for every kflare kind in Argo CD (a Lua
        script for `argocd-cm`) and in Flux (`healthCheckExprs`, Flux 2.9 or newer for
        one entry): a resource is Healthy once `Ready` is `True` for its current spec,
        Degraded when Cloudflare refused it or a conflict or setting needs a person, Suspended
        while paused, and Progressing otherwise. So an application turns Degraded when
        Cloudflare refuses a record, and sync waves and `dependsOn` wait for a `Zone`
        to be ready (deploy guide, #83)'
      links:
      - name: deploy guide
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.2/docs/deploy.md#health-checks-in-argo-cd-and-flux
      - name: '#83'
        url: https://github.com/JonathanGraniero/kflare/issues/83
    - description: '`local/setup.sh` installs Argo CD and Prometheus too. Argo CD comes
        with kflare''s health check, to watch kflare resources sync in its UI, and Prometheus
        and Grafana with a kflare dashboard, which shows an e2e run as it goes however
        the suite runs the manager. `INSTALL_ARGOCD=0` and `INSTALL_PROMETHEUS=0` leave
        them out (CONTRIBUTING.md)'
      links:
      - name: CONTRIBUTING.md
        url: https://github.com/JonathanGraniero/kflare/blob/v0.4.2/CONTRIBUTING.md#running-kflare-against-a-real-account
  artifacthub.io/crds: |
    - description: 'CacheRule manages one cache rule in a zone: how Cloudflare caches
        the responses to the requests its expression matches, at the edge and in browsers.'
      displayName: CacheRule
      kind: CacheRule
      name: cacherules.kflare.dev
      version: v1alpha1
    - description: CloudflareAccount is cluster-scoped and holds credentials for a single
        Cloudflare account.
      displayName: CloudflareAccount
      kind: CloudflareAccount
      name: cloudflareaccounts.kflare.dev
      version: v1alpha1
    - description: 'ConfigurationRule manages one configuration rule in a zone: settings,
        such as the SSL mode or the security level, changed for the requests its expression
        matches.'
      displayName: ConfigurationRule
      kind: ConfigurationRule
      name: configurationrules.kflare.dev
      version: v1alpha1
    - description: D1Database represents a Cloudflare D1 database.
      displayName: D1Database
      kind: D1Database
      name: d1databases.kflare.dev
      version: v1alpha1
    - description: DNSRecord represents a DNS record within a Cloudflare-managed zone.
      displayName: DNSRecord
      kind: DNSRecord
      name: dnsrecords.kflare.dev
      version: v1alpha1
    - description: IPList manages a custom IP list in a Cloudflare account.
      displayName: IPList
      kind: IPList
      name: iplists.kflare.dev
      version: v1alpha1
    - description: KVNamespace represents a Cloudflare Workers KV namespace.
      displayName: KVNamespace
      kind: KVNamespace
      name: kvnamespaces.kflare.dev
      version: v1alpha1
    - description: ManagedRuleset deploys a Cloudflare managed ruleset to a zone, as an
        execute rule in its http_request_firewall_managed phase; the expression selects
        the requests the ruleset inspects, and "true" selects every request.
      displayName: ManagedRuleset
      kind: ManagedRuleset
      name: managedrulesets.kflare.dev
      version: v1alpha1
    - description: 'ManagedTransform turns a zone''s managed transforms on and off: the
        request and response headers Cloudflare adds or removes for the zone.'
      displayName: ManagedTransform
      kind: ManagedTransform
      name: managedtransforms.kflare.dev
      version: v1alpha1
    - description: 'OriginRule manages one origin rule in a zone: the requests its expression
        matches reach the origin on another destination port.'
      displayName: OriginRule
      kind: OriginRule
      name: originrules.kflare.dev
      version: v1alpha1
    - description: R2Bucket represents a Cloudflare R2 bucket.
      displayName: R2Bucket
      kind: R2Bucket
      name: r2buckets.kflare.dev
      version: v1alpha1
    - description: 'RateLimitRule manages one rate limiting rule in a zone, in its http_ratelimit
        phase: the rule counts the requests its expression matches, and once a client
        sends more than requestsPerPeriod of them in a period, the action applies to the
        client''s matching requests for the mitigation timeout.'
      displayName: RateLimitRule
      kind: RateLimitRule
      name: ratelimitrules.kflare.dev
      version: v1alpha1
    - description: 'RedirectRule manages one single redirect in a zone: Cloudflare answers
        the requests its expression matches with a redirect to a URL, a static one or
        one an expression computes.'
      displayName: RedirectRule
      kind: RedirectRule
      name: redirectrules.kflare.dev
      version: v1alpha1
    - description: 'TransformRule manages one transform rule in a zone: a rewrite of the
        URL a request reaches the origin with, or a change to its request or response
        headers.'
      displayName: TransformRule
      kind: TransformRule
      name: transformrules.kflare.dev
      version: v1alpha1
    - description: Tunnel represents a remotely-managed Cloudflare Tunnel and the Secret
        holding the token a cloudflared connector needs to run it.
      displayName: Tunnel
      kind: Tunnel
      name: tunnels.kflare.dev
      version: v1alpha1
    - description: TunnelConfiguration owns the complete ingress configuration of one
        remotely-managed Tunnel.
      displayName: TunnelConfiguration
      kind: TunnelConfiguration
      name: tunnelconfigurations.kflare.dev
      version: v1alpha1
    - description: 'WAFCustomRule manages one WAF custom rule in a zone, in its http_request_firewall_custom
        phase: the rule blocks or challenges the requests its expression matches, or lets
        them skip other security features.'
      displayName: WAFCustomRule
      kind: WAFCustomRule
      name: wafcustomrules.kflare.dev
      version: v1alpha1
    - description: WorkerRoute routes requests matching a URL pattern in a zone to a WorkerScript,
        or, without one, excludes the pattern from a broader route.
      displayName: WorkerRoute
      kind: WorkerRoute
      name: workerroutes.kflare.dev
      version: v1alpha1
    - description: WorkerScript represents a Cloudflare Worker script and its bindings.
      displayName: WorkerScript
      kind: WorkerScript
      name: workerscripts.kflare.dev
      version: v1alpha1
    - description: Zone represents a DNS zone managed in Cloudflare.
      displayName: Zone
      kind: Zone
      name: zones.kflare.dev
      version: v1alpha1
  artifacthub.io/crdsExamples: |
    - apiVersion: kflare.dev/v1alpha1
      kind: CacheRule
      metadata:
        name: example-cacherule
        namespace: default
      spec:
        browserTTL:
          default: 3600
          mode: override_origin
        cache: true
        cacheKey:
          customKey:
            queryString:
              exclude:
                all: true
        description: Cache static assets, whose names carry their version, for a day
        edgeTTL:
          default: 86400
          mode: override_origin
          statusCodeTTL:
          - statusCode: 404
            value: 60
          - statusCodeRange:
              from: 500
            value: 0
        expression: http.request.uri.path.extension in {"css" "js" "png" "jpg" "svg" "woff2"}
        vary:
          default:
            action: passthrough
          headers:
          - action: normalize
            mediaTypes:
            - image/avif
            - image/webp
            name: accept
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: CloudflareAccount
      metadata:
        name: my-account
      spec:
        accountID: <your account ID>
        tokenSecretRef:
          name: cloudflare-token
          namespace: kflare-system
    - apiVersion: kflare.dev/v1alpha1
      kind: ConfigurationRule
      metadata:
        name: example-configurationrule
        namespace: default
      spec:
        bic: true
        description: Challenge more readily, and leave scripts alone, on the admin pages
        expression: starts_with(http.request.uri.path, "/admin/")
        rocketLoader: false
        securityLevel: high
        ssl: strict
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: D1Database
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-d1database
        namespace: default
      spec:
        accountRef:
          name: my-account
        name: example-db
    - apiVersion: kflare.dev/v1alpha1
      kind: DNSRecord
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-dnsrecord
        namespace: default
      spec:
        comment: The web server.
        content: 192.0.2.1
        name: www.example.com
        type: A
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: IPList
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-iplist
        namespace: default
      spec:
        accountRef:
          name: my-account
        description: Addresses of example.com's offices.
        items:
        - comment: Head office
          ip: 192.0.2.1
        - comment: Branch office
          ip: 198.51.100.0/24
        - ip: 2001:db8::/48
        name: example_ips
    - apiVersion: kflare.dev/v1alpha1
      kind: KVNamespace
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-kvnamespace
        namespace: default
      spec:
        accountRef:
          name: my-account
        title: example-kv
    - apiVersion: kflare.dev/v1alpha1
      kind: ManagedRuleset
      metadata:
        name: example-managedruleset
        namespace: default
      spec:
        description: Free Managed Ruleset, the WordPress rules only logging
        expression: "true"
        id: 77454fe2d30c4220b5701f6fdfb893ba
        overrides:
          categories:
          - action: log
            category: wordpress
          rules:
          - enabled: false
            id: 7dfd111a6bad4b86bf3522cce6c5792f
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: ManagedTransform
      metadata:
        name: example-managedtransform
        namespace: default
      spec:
        managedRequestHeaders:
        - enabled: true
          id: add_visitor_location_headers
        managedResponseHeaders:
        - enabled: true
          id: remove_x-powered-by_header
        - enabled: true
          id: add_security_headers
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: OriginRule
      metadata:
        name: example-originrule
        namespace: default
      spec:
        description: Send API requests to the origin's port 8443
        expression: starts_with(http.request.uri.path, "/api/")
        origin:
          port: 8443
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: R2Bucket
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-r2bucket
        namespace: default
      spec:
        accountRef:
          name: my-account
        name: example-bucket
    - apiVersion: kflare.dev/v1alpha1
      kind: RateLimitRule
      metadata:
        name: example-ratelimitrule
        namespace: default
      spec:
        action: block
        description: Limit each client to 100 API requests every 10 seconds
        expression: starts_with(http.request.uri.path, "/api/")
        ratelimit:
          characteristics:
          - cf.colo.id
          - ip.src
          mitigationTimeout: 10
          period: 10
          requestsPerPeriod: 100
        response:
          content: '{"error":"rate limited, try again in 10 seconds"}'
          contentType: application/json
          statusCode: 429
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: RedirectRule
      metadata:
        name: example-redirectrule
        namespace: default
      spec:
        description: Send www.example.com to example.com, keeping the path and query
        expression: http.host eq "www.example.com"
        fromValue:
          preserveQueryString: true
          statusCode: 301
          targetURL:
            expression: concat("https://example.com", http.request.uri.path)
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: TransformRule
      metadata:
        name: example-transformrule-url-rewrite
        namespace: default
      spec:
        description: Serve /old from /new
        expression: http.request.uri.path eq "/old"
        type: urlRewrite
        uri:
          path:
            value: /new
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: Tunnel
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-tunnel
        namespace: default
      spec:
        accountRef:
          name: my-account
        credentialsSecretRef:
          name: example-tunnel-token
        name: example-tunnel
    - apiVersion: kflare.dev/v1alpha1
      kind: TunnelConfiguration
      metadata:
        name: example-tunnel-config
        namespace: default
      spec:
        defaultService: http_status:404
        ingress:
        - hostname: app.example.com
          service: http://my-app.default.svc.cluster.local:80
        - hostname: api.example.com
          originRequest:
            originServerName: api.example.com
          path: ^/v1/
          service: https://my-api.default.svc.cluster.local:443
        tunnelRef:
          name: example-tunnel
    - apiVersion: kflare.dev/v1alpha1
      kind: WAFCustomRule
      metadata:
        name: example-wafcustomrule
        namespace: default
      spec:
        action: block
        description: Block the admin pages from outside the office
        expression: http.request.uri.path wildcard "/admin*" and not ip.src in {192.0.2.0/24}
        priority: 10
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: WorkerRoute
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-workerroute
        namespace: default
      spec:
        pattern: example.com/api/*
        workerScriptRef:
          name: example-worker
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: WorkerScript
      metadata:
        name: example-worker
        namespace: default
      spec:
        accountRef:
          name: my-account
        bindings:
        - name: GREETING
          plainText: Hello
        - name: API_KEY
          secretKeyRef:
            key: api-key
            name: example-worker-secrets
        compatibilityDate: "2024-09-23"
        format: module
        name: example-worker
        script: |
          export default {
            async fetch(request, env) {
              return new Response(`${env.GREETING} from kflare`);
            },
          };
    - apiVersion: kflare.dev/v1alpha1
      kind: Zone
      metadata:
        annotations:
          kflare.dev/adoption-policy: adopt
        name: example-zone
        namespace: default
      spec:
        accountRef:
          name: my-account
        name: example.com
        type: full
  artifacthub.io/images: |
    - image: ghcr.io/jonathangraniero/kflare:0.4.2
      name: kflare
      platforms:
      - linux/amd64
      - linux/arm64
