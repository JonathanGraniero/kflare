  artifacthub.io/crdsExamples: |
    - apiVersion: kflare.dev/v1alpha1
      kind: CacheRule
      metadata:
        name: example-cacherule
        namespace: default
      spec:
        browserTTL:
          default: 3600
          mode: override_origin
        cache: true
        cacheKey:
          customKey:
            queryString:
              exclude:
                all: true
        description: Cache static assets, whose names carry their version, for a day
        edgeTTL:
          default: 86400
          mode: override_origin
          statusCodeTTL:
          - statusCode: 404
            value: 60
          - statusCodeRange:
              from: 500
            value: 0
        expression: http.request.uri.path.extension in {"css" "js" "png" "jpg" "svg" "woff2"}
        vary:
          default:
            action: passthrough
          headers:
          - action: normalize
            mediaTypes:
            - image/avif
            - image/webp
            name: accept
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: CloudflareAccount
      metadata:
        name: my-account
      spec:
        accountID: <your account ID>
        tokenSecretRef:
          name: cloudflare-token
          namespace: kflare
    - apiVersion: kflare.dev/v1alpha1
      kind: ConfigurationRule
      metadata:
        name: example-configurationrule
        namespace: default
      spec:
        bic: true
        description: Challenge more readily, and leave scripts alone, on the admin pages
        expression: starts_with(http.request.uri.path, "/admin/")
        rocketLoader: false
        securityLevel: high
        ssl: strict
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: D1Database
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-d1database
        namespace: default
      spec:
        accountRef:
          name: my-account
        name: example-db
    - apiVersion: kflare.dev/v1alpha1
      kind: DNSRecord
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-dnsrecord
        namespace: default
      spec:
        comment: The web server.
        content: 192.0.2.1
        name: www.example.com
        type: A
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: IPList
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-iplist
        namespace: default
      spec:
        accountRef:
          name: my-account
        description: Addresses of example.com's offices.
        items:
        - comment: Head office
          ip: 192.0.2.1
        - comment: Branch office
          ip: 198.51.100.0/24
        - ip: 2001:db8::/48
        name: example_ips
    - apiVersion: kflare.dev/v1alpha1
      kind: KVNamespace
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-kvnamespace
        namespace: default
      spec:
        accountRef:
          name: my-account
        title: example-kv
    - apiVersion: kflare.dev/v1alpha1
      kind: ManagedRuleset
      metadata:
        name: example-managedruleset
        namespace: default
      spec:
        description: Free Managed Ruleset, the WordPress rules only logging
        expression: "true"
        id: 77454fe2d30c4220b5701f6fdfb893ba
        overrides:
          categories:
          - action: log
            category: wordpress
          rules:
          - enabled: false
            id: 7dfd111a6bad4b86bf3522cce6c5792f
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: ManagedTransform
      metadata:
        name: example-managedtransform
        namespace: default
      spec:
        managedRequestHeaders:
        - enabled: true
          id: add_visitor_location_headers
        managedResponseHeaders:
        - enabled: true
          id: remove_x-powered-by_header
        - enabled: true
          id: add_security_headers
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: OriginRule
      metadata:
        name: example-originrule
        namespace: default
      spec:
        description: Send API requests to the origin's port 8443
        expression: starts_with(http.request.uri.path, "/api/")
        origin:
          port: 8443
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: R2Bucket
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-r2bucket
        namespace: default
      spec:
        accountRef:
          name: my-account
        name: example-bucket
    - apiVersion: kflare.dev/v1alpha1
      kind: RateLimitRule
      metadata:
        name: example-ratelimitrule
        namespace: default
      spec:
        action: block
        description: Limit each client to 100 API requests every 10 seconds
        expression: starts_with(http.request.uri.path, "/api/")
        ratelimit:
          characteristics:
          - cf.colo.id
          - ip.src
          mitigationTimeout: 10
          period: 10
          requestsPerPeriod: 100
        response:
          content: '{"error":"rate limited, try again in 10 seconds"}'
          contentType: application/json
          statusCode: 429
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: RedirectRule
      metadata:
        name: example-redirectrule
        namespace: default
      spec:
        description: Send www.example.com to example.com, keeping the path and query
        expression: http.host eq "www.example.com"
        fromValue:
          preserveQueryString: true
          statusCode: 301
          targetURL:
            expression: concat("https://example.com", http.request.uri.path)
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: TransformRule
      metadata:
        name: example-transformrule-url-rewrite
        namespace: default
      spec:
        description: Serve /old from /new
        expression: http.request.uri.path eq "/old"
        type: urlRewrite
        uri:
          path:
            value: /new
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: Tunnel
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-tunnel
        namespace: default
      spec:
        accountRef:
          name: my-account
        credentialsSecretRef:
          name: example-tunnel-token
        name: example-tunnel
    - apiVersion: kflare.dev/v1alpha1
      kind: TunnelConfiguration
      metadata:
        name: example-tunnel-config
        namespace: default
      spec:
        defaultService: http_status:404
        ingress:
        - hostname: app.example.com
          service: http://my-app.default.svc.cluster.local:80
        - hostname: api.example.com
          originRequest:
            originServerName: api.example.com
          path: ^/v1/
          service: https://my-api.default.svc.cluster.local:443
        tunnelRef:
          name: example-tunnel
    - apiVersion: kflare.dev/v1alpha1
      kind: WAFCustomRule
      metadata:
        name: example-wafcustomrule
        namespace: default
      spec:
        action: block
        description: Block the admin pages from outside the office
        expression: http.request.uri.path wildcard "/admin*" and not ip.src in {192.0.2.0/24}
        priority: 10
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: WorkerRoute
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-workerroute
        namespace: default
      spec:
        pattern: example.com/api/*
        workerScriptRef:
          name: example-worker
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: WorkerScript
      metadata:
        name: example-worker
        namespace: default
      spec:
        accountRef:
          name: my-account
        bindings:
        - name: GREETING
          plainText: Hello
        - name: API_KEY
          secretKeyRef:
            key: api-key
            name: example-worker-secrets
        compatibilityDate: "2024-09-23"
        format: module
        name: example-worker
        script: |
          export default {
            async fetch(request, env) {
              return new Response(`${env.GREETING} from kflare`);
            },
          };
    - apiVersion: kflare.dev/v1alpha1
      kind: Zone
      metadata:
        annotations:
          kflare.dev/adoption-policy: adopt
        name: example-zone
        namespace: default
      spec:
        accountRef:
          name: my-account
        name: example.com
        type: full
  artifacthub.io/images: |
    - image: ghcr.io/jonathangraniero/kflare:0.6.0
      name: kflare
      platforms:
      - linux/amd64
      - linux/arm64
