apiVersion: v2
name: kflare
description: >-
  A Kubernetes operator that manages Cloudflare through custom resources: zones, DNS records, tunnels, Workers and
  their storage, WAF rules and the Rules products.
type: application
# Chart and application are released together from a vX.Y.Z tag; the release
# workflow refuses a tag that does not match this version.
version: 0.6.0
appVersion: "0.6.0"
# kflare supports Kubernetes 1.34 and newer.
kubeVersion: ">=1.34.0-0"
home: https://github.com/JonathanGraniero/kflare
sources:
  - https://github.com/JonathanGraniero/kflare
keywords:
  - cloudflare
  - operator
  - dns
  - tunnel
  - workers
  - gitops
maintainers:
  - name: Jonathan Graniero
    url: https://github.com/JonathanGraniero
# What Artifact Hub shows on the chart's page: https://artifacthub.io/docs/topics/annotations/helm/.
# Keep annotations the last key: make helm rewrites everything after the marker line.
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: networking
  artifacthub.io/operator: "true"
  # Raise it with the API's stability: upgrading to v0.3.0 needs manifests rewritten by hand.
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/links: |
    - name: Deploy guide
      url: https://github.com/JonathanGraniero/kflare/blob/main/docs/deploy.md
    - name: Architecture
      url: https://github.com/JonathanGraniero/kflare/blob/main/ARCHITECTURE.md
    - name: Changelog and upgrade steps
      url: https://github.com/JonathanGraniero/kflare/blob/main/CHANGELOG.md
    - name: Discussions
      url: https://github.com/JonathanGraniero/kflare/discussions
    - name: support
      url: https://github.com/JonathanGraniero/kflare/issues/new/choose
  # Generated by hack/chartannotations (make helm). DO NOT EDIT below this line.
  artifacthub.io/changes: |
    - description: 'kflare reads and writes Secrets only in its release namespace and
        the chart''s new `secretNamespaces` (#152). The controller''s ClusterRole no longer
        grants Secrets: a Role in each of those namespaces does, and the controller caches
        no other Secret. A `CloudflareAccount` whose token Secret, a `Tunnel`, or a `WorkerScript`
        with secret bindings elsewhere reports the new reason `SecretNamespaceNotAllowed`,
        which names the namespace, and kflare makes no Cloudflare call for it: a Tunnel''s
        token Secret is no longer updated, and a Worker is no longer uploaded, until the
        namespace is listed. No manifest changes, and installations with `watchNamespaces`
        are unchanged: they use the Secrets of the namespaces they watch, as before.'
      links:
      - name: '#152'
        url: https://github.com/JonathanGraniero/kflare/issues/152
    - description: 'The chart refuses to install into the `default` namespace unless `allowDefaultNamespace:
        true`. Helm installs there when `--namespace` is left out, and the release namespace
        is now where kflare may write Secrets. An installation in `default` sets the value
        to upgrade.'
    - description: 'The chart checks every resource against Cloudflare every hour (`driftCheckInterval:
        1h`, which was empty: #135). A change made outside kflare to an object it manages,
        in the dashboard, through the API or by Terraform, is now reverted at the object''s
        next check, at most 66 minutes later, not at the 10-hour resync. That includes
        a fix made by hand during an incident, whose check can be seconds away: annotate
        the resource `kflare.dev/paused: "true"` first, then make the fix, or put the
        fix in the spec. An installation that already sets `driftCheckInterval` is unchanged.'
      links:
      - name: '#135'
        url: https://github.com/JonathanGraniero/kflare/issues/135
    - description: 'A resource annotated `kflare.dev/management-policy: observe` is only
        observed (#82): kflare finds its Cloudflare object by name, records it in status
        and reports `InSync`, `DriftDetected` with the spec fields that differ, or `NotFound`.
        It never creates, updates or deletes the object, and deleting the resource leaves
        it. Every kind supports it but `WorkerScript` (#191, #195): a resource of it reports
        `ObserveNotSupported`, and kflare makes no Cloudflare call for it. A `DNSRecord`
        whose `tunnelRef` names an observed `Tunnel` is observed too, and an `IPList`
        compares its items. Removing the annotation manages the object as one kflare adopted.
        For moving to kflare a manifest at a time: see Observing without writing.'
      links:
      - name: '#82'
        url: https://github.com/JonathanGraniero/kflare/issues/82
      - name: '#191'
        url: https://github.com/JonathanGraniero/kflare/issues/191
      - name: '#195'
        url: https://github.com/JonathanGraniero/kflare/issues/195
      - name: Observing without writing
        url: https://github.com/JonathanGraniero/kflare/blob/v0.6.0/docs/deploy.md#observing-without-writing
    - description: 'A rule kflare did not create can be observed with the annotation `kflare.dev/rule-id:
        <the rule''s ID>` on a rule kind''s resource (#195). Switching it to `manage`
        reports `AlreadyExists` until that rule is deleted: Cloudflare does not let a
        rule''s ref change, so kflare cannot take it over in place.'
      links:
      - name: '#195'
        url: https://github.com/JonathanGraniero/kflare/issues/195
    - description: The chart's `observeOnly` (`--observe-only`) runs a whole installation
        that way, for an audit with a read-only token.
    - description: 'New `Ready` reasons, which the Argo CD and Flux health checks in `docs/deploy.md`
        now list: copy them again if you use them. `InSync` (healthy), and `DriftDetected`,
        `ObserveNotSupported` and `InvalidManagementPolicy` (degraded).'
    - description: 'A `TunnelConfiguration` rule sets cloudflared''s timeouts to its origin:
        `originRequest.connectTimeout`, `tlsTimeout`, `tcpKeepAlive` and `keepAliveTimeout`,
        in seconds. Its calls moved to cloudflare-go v7, whose integer timeouts lift the
        limitation of v0.119 (#134). Nothing changes for existing manifests: a configuration
        kflare wrote reads as unchanged, and is not written again'
      links:
      - name: '#134'
        url: https://github.com/JonathanGraniero/kflare/issues/134
    - description: 'Alerts and a Grafana dashboard (#76), both off by default. `metrics.prometheusRule.enabled`
        creates a Prometheus Operator PrometheusRule with eight alerts: `KflareDown`,
        `KflareReconcileErrors`, `KflareWorkqueueBacklog`, `KflareCloudflareErrors`, `KflareRateLimited`,
        `KflareResourcesNotReady`, `KflareDriftCorrected` and `KflareTokenExpiresSoon`.
        Each has a runbook in the deploy guide, and its `enabled`, `for` and `severity`
        are values. `metrics.grafanaDashboard.enabled` creates a ConfigMap with kflare''s
        dashboard, labelled for the sidecar kube-prometheus-stack''s Grafana runs. Both
        read what the ServiceMonitor scrapes (`metrics.serviceMonitor.enabled`). See Alerts
        and a dashboard.'
      links:
      - name: '#76'
        url: https://github.com/JonathanGraniero/kflare/issues/76
      - name: Alerts and a dashboard
        url: https://github.com/JonathanGraniero/kflare/blob/v0.6.0/docs/deploy.md#alerts-and-a-dashboard
    - description: '`kflare_cloudflare_api_rate_limited_total` starts at 0 for each `CloudflareAccount`,
        with the account''s first call. It first appeared with the account''s first 429,
        at 1, which `increase()` does not see, so an alert on it missed that one.'
    - description: 'A default install runs two pods, a leader and a standby (#136): `autoscaling.minReplicas`
        is now `2` (it was `1`) and `autoscaling.maxReplicas` `3` (it was `10`). With
        one pod, reconciling waited for a new pod to start when the leader''s went; the
        standby takes over within about 20 seconds. It costs one idle pod: about 1m CPU
        and 9 MiB in use, 100m and 64Mi requested. Only the leader reconciles, so the
        replicas the autoscaler added up to 10 were idle requests, not capacity: `maxConcurrentReconciles`
        is what raises throughput. `autoscaling.minReplicas: 1` runs a single pod as before.
        Values that set `autoscaling.minReplicas` above 3 without `maxReplicas` no longer
        render ("minReplicas cannot be above maxReplicas"): set `autoscaling.maxReplicas`
        too. Other values that set either number are unchanged. With two pods, `kubectl
        logs deploy/kflare` and a port-forward to the metrics Service reach either: the
        deploy guide''s commands now read every pod''s log, and the leader''s metrics.'
      links:
      - name: '#136'
        url: https://github.com/JonathanGraniero/kflare/issues/136
    - description: 'The pods go on different nodes where the cluster has them (#192):
        while there can be more than one replica and `topologySpreadConstraints` is empty,
        the chart spreads them over nodes (`kubernetes.io/hostname`, `whenUnsatisfiable:
        ScheduleAnyway`), so that a node''s loss does not take the standby with the leader.
        A one-node cluster still runs both. Your own `topologySpreadConstraints` replace
        it, and `topologySpreadDefault: false` turns it off. A spread over zones is yours
        to add (Configuration).'
      links:
      - name: '#192'
        url: https://github.com/JonathanGraniero/kflare/issues/192
      - name: Configuration
        url: https://github.com/JonathanGraniero/kflare/blob/v0.6.0/docs/deploy.md#configuration
    - description: 'The docs install into `kflare` (`--namespace kflare --create-namespace`),
        not `kflare-system`, and so does `config/default`''s kustomization, which still
        said `cloudflare-operator-system`. An existing installation keeps its namespace:
        `helm upgrade -n kflare-system` works as before.'
    - description: A smaller cache. The controller caches the Secrets of the namespaces
        it may use, not the whole cluster's, so Helm's release Secrets elsewhere no longer
        count toward its memory (deploy.md's Scaling and resources).
    - description: An `IPList` no longer starts a second replacement of its items while
        Cloudflare is still applying the first, which a reconcile could do when the controller's
        cache had not yet seen the status that records the running one (#190).
      links:
      - name: '#190'
        url: https://github.com/JonathanGraniero/kflare/issues/190
    - description: 'A `ManagedTransform` with `kflare.dev/adoption-policy: adopt-or-create`
        no longer marks itself adopted for the settings it wrote itself, which a reconcile
        could do on the same lag. A resource marked so kept its settings when it was deleted,
        rather than reset them. One you created with `adopt-or-create` in a zone nobody
        had configured, and that carries `kflare.dev/adopted: "true"`, may be one: annotate
        it `kflare.dev/deletion-policy: delete` to have its settings reset when it goes
        (#190).'
      links:
      - name: '#190'
        url: https://github.com/JonathanGraniero/kflare/issues/190
    - description: 'kflare no longer deletes another resource''s object for a resource
        that names it only by its claim label (#189). A resource whose status recorded
        no object was deleted with the object its claim label (`kflare.dev/<kind>-id`)
        named, and anyone who may create a resource can write that label: someone allowed
        one namespace could have kflare delete a KV namespace, an R2 bucket or a tunnel
        that a resource in another namespace manages, through the same Cloudflare account.
        kflare now leaves such an object, with a Warning Event, when another resource
        claims it.'
      links:
      - name: '#189'
        url: https://github.com/JonathanGraniero/kflare/issues/189
  artifacthub.io/crds: |
    - description: 'CacheRule manages one cache rule in a zone: how Cloudflare caches
        the responses to the requests its expression matches, at the edge and in browsers.'
      displayName: CacheRule
      kind: CacheRule
      name: cacherules.kflare.dev
      version: v1alpha1
    - description: CloudflareAccount is cluster-scoped and holds credentials for a single
        Cloudflare account.
      displayName: CloudflareAccount
      kind: CloudflareAccount
      name: cloudflareaccounts.kflare.dev
      version: v1alpha1
    - description: 'ConfigurationRule manages one configuration rule in a zone: settings,
        such as the SSL mode or the security level, changed for the requests its expression
        matches.'
      displayName: ConfigurationRule
      kind: ConfigurationRule
      name: configurationrules.kflare.dev
      version: v1alpha1
    - description: D1Database represents a Cloudflare D1 database.
      displayName: D1Database
      kind: D1Database
      name: d1databases.kflare.dev
      version: v1alpha1
    - description: DNSRecord represents a DNS record within a Cloudflare-managed zone.
      displayName: DNSRecord
      kind: DNSRecord
      name: dnsrecords.kflare.dev
      version: v1alpha1
    - description: IPList manages a custom IP list in a Cloudflare account.
      displayName: IPList
      kind: IPList
      name: iplists.kflare.dev
      version: v1alpha1
    - description: KVNamespace represents a Cloudflare Workers KV namespace.
      displayName: KVNamespace
      kind: KVNamespace
      name: kvnamespaces.kflare.dev
      version: v1alpha1
    - description: ManagedRuleset deploys a Cloudflare managed ruleset to a zone, as an
        execute rule in its http_request_firewall_managed phase; the expression selects
        the requests the ruleset inspects, and "true" selects every request.
      displayName: ManagedRuleset
      kind: ManagedRuleset
      name: managedrulesets.kflare.dev
      version: v1alpha1
    - description: 'ManagedTransform turns a zone''s managed transforms on and off: the
        request and response headers Cloudflare adds or removes for the zone.'
      displayName: ManagedTransform
      kind: ManagedTransform
      name: managedtransforms.kflare.dev
      version: v1alpha1
    - description: 'OriginRule manages one origin rule in a zone: the requests its expression
        matches reach the origin on another destination port.'
      displayName: OriginRule
      kind: OriginRule
      name: originrules.kflare.dev
      version: v1alpha1
    - description: R2Bucket represents a Cloudflare R2 bucket.
      displayName: R2Bucket
      kind: R2Bucket
      name: r2buckets.kflare.dev
      version: v1alpha1
    - description: 'RateLimitRule manages one rate limiting rule in a zone, in its http_ratelimit
        phase: the rule counts the requests its expression matches, and once a client
        sends more than requestsPerPeriod of them in a period, the action applies to the
        client''s matching requests for the mitigation timeout.'
      displayName: RateLimitRule
      kind: RateLimitRule
      name: ratelimitrules.kflare.dev
      version: v1alpha1
    - description: 'RedirectRule manages one single redirect in a zone: Cloudflare answers
        the requests its expression matches with a redirect to a URL, a static one or
        one an expression computes.'
      displayName: RedirectRule
      kind: RedirectRule
      name: redirectrules.kflare.dev
      version: v1alpha1
    - description: 'TransformRule manages one transform rule in a zone: a rewrite of the
        URL a request reaches the origin with, or a change to its request or response
        headers.'
      displayName: TransformRule
      kind: TransformRule
      name: transformrules.kflare.dev
      version: v1alpha1
    - description: Tunnel represents a remotely-managed Cloudflare Tunnel and the Secret
        holding the token a cloudflared connector needs to run it.
      displayName: Tunnel
      kind: Tunnel
      name: tunnels.kflare.dev
