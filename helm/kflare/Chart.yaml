apiVersion: v2
name: kflare
description: >-
  A Kubernetes operator that manages Cloudflare through custom resources: zones, DNS records, tunnels, Workers and
  their storage, WAF rules and the Rules products.
type: application
# Chart and application are released together from a vX.Y.Z tag; the release
# workflow refuses a tag that does not match this version.
version: 0.3.0
appVersion: "0.3.0"
# kflare supports Kubernetes 1.34 and newer.
kubeVersion: ">=1.34.0-0"
home: https://github.com/JonathanGraniero/kflare
sources:
  - https://github.com/JonathanGraniero/kflare
keywords:
  - cloudflare
  - operator
  - dns
  - tunnel
  - workers
  - gitops
maintainers:
  - name: Jonathan Graniero
    url: https://github.com/JonathanGraniero
# What Artifact Hub shows on the chart's page: https://artifacthub.io/docs/topics/annotations/helm/.
# Keep annotations the last key: make helm rewrites everything after the marker line.
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: networking
  artifacthub.io/operator: "true"
  # Raise it with the API's stability: upgrading to v0.3.0 needs manifests rewritten by hand.
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/links: |
    - name: Deploy guide
      url: https://github.com/JonathanGraniero/kflare/blob/main/docs/deploy.md
    - name: Architecture
      url: https://github.com/JonathanGraniero/kflare/blob/main/ARCHITECTURE.md
    - name: Changelog and upgrade steps
      url: https://github.com/JonathanGraniero/kflare/blob/main/CHANGELOG.md
    - name: Discussions
      url: https://github.com/JonathanGraniero/kflare/discussions
    - name: support
      url: https://github.com/JonathanGraniero/kflare/issues/new/choose
  # Generated by hack/chartannotations (make helm). DO NOT EDIT below this line.
  artifacthub.io/changes: |
    - description: 'ManagedRuleset: `rulesetID` is now `id`, the API''s name for the ruleset
        an execute rule runs. A ManagedRuleset stored with `rulesetID` has no `id` after
        the upgrade, and cannot be updated until it gets one: apply your ManagedRuleset
        manifests with `id` right after upgrading'
    - description: 'ManagedRuleset: `id` can change in place, which updates the deployment''s
        rule to run the other ruleset; it was immutable'
    - description: 'ManagedRuleset: The category and rule overrides are sent in the spec''s
        order rather than sorted. Cloudflare keeps that order, so reordering them in the
        spec writes the rule again'
    - description: 'ManagedRuleset: An empty `overrides.categories` or `overrides.rules`
        is refused: leave it out'
    - description: 'ManagedRuleset: For Go clients: `ManagedRulesetCategoryOverride` and
        `ManagedRulesetRuleOverride` are now `ManagedRulesetOverridesCategory` and `ManagedRulesetOverridesRule`,
        and an override''s `action` is a `string`'
    - description: 'RateLimitRule: The rate limit moves under `ratelimit`, the API''s
        name for it: `characteristics`, `period`, `requestsPerPeriod`, `mitigationTimeout`,
        `countingExpression` and `requestsToOrigin`. `blockResponse` is now `response`.
        A RateLimitRule stored with the old fields has no rate limit after the upgrade,
        and cannot be updated until it gets one: apply your RateLimitRule manifests in
        the new shape right after upgrading. Until then its Cloudflare rule is left as
        it was'
    - description: 'RateLimitRule: Nothing defaults any more: set `action` (was `block`),
        `ratelimit.characteristics` (was `[ip.src]`), `ratelimit.period` (was 10), `ratelimit.mitigationTimeout`
        (was the period; 0 throttles, on Enterprise plans) and `response.statusCode` (was
        429)'
    - description: 'RateLimitRule: `ratelimit.characteristics` must list `cf.colo.id`,
        which kflare no longer adds for you, and at least one other field. They are sent
        sorted'
    - description: 'RateLimitRule: For Go clients: `RateLimitRuleBlockResponse` is now
        `RateLimitRuleResponse`, the rate limit is a `RateLimitRuleRatelimit`, its characteristics
        are `[]string`, and its integers are `int64`, the optional ones pointers'
    - description: 'WAFCustomRule: A skip rule''s parameters move to the spec''s root,
        as the API names them: `skip.remainingRules: true` is now `ruleset: current`,
        and `skip.phases` and `skip.products` are `phases` and `products`. `skip.log`
        is now `logging.enabled`, and `blockResponse` is now `response`'
    - description: 'WAFCustomRule: A WAFCustomRule stored with the old fields loses them
        after the upgrade: A skip rule then has no parameters, which Cloudflare refuses
        (20115): kflare reports `TerminalError` and leaves the Cloudflare rule as it was
        until you apply the manifest in the new shape; A block rule with a `blockResponse`
        becomes a plain block rule, and kflare writes its Cloudflare rule again without
        the response. Pause such rules (`kflare.dev/paused: "true"`) before upgrading,
        apply them in the new shape, then remove the annotation'
    - description: 'WAFCustomRule: Nothing defaults any more: set `response.statusCode`
        (was 403). A skip rule without `logging` still logs its matches, Cloudflare''s
        default, which kflare no longer sends itself'
    - description: 'WAFCustomRule: New: `phase: current` skips the rest of the phase,
        the custom rulesets that run later in it included. It combines with `products`,
        but not with `phases` or `ruleset`'
    - description: 'WAFCustomRule: For Go clients: `WAFCustomRuleSkip`, `WAFCustomRuleSkipPhase`,
        `WAFCustomRuleSkipProduct` and `WAFCustomRuleBlockResponse` are gone. The phases
        and products are `[]string`, the response is a `WAFCustomRuleResponse` whose `statusCode`
        is an `int64`, and logging is a `WAFCustomRuleLogging`'
    - description: 'A Ready condition no longer ends in a blank message when Cloudflare''s
        error holds only spaces: it names the HTTP status, as it does for an error without
        a message. Found by the new fuzz tests (#108)'
      links:
      - name: '#108'
        url: https://github.com/JonathanGraniero/kflare/issues/108
  artifacthub.io/crds: |
    - description: 'CacheRule manages one cache rule in a zone: how Cloudflare caches
        the responses to the requests its expression matches, at the edge and in browsers.'
      displayName: CacheRule
      kind: CacheRule
      name: cacherules.kflare.dev
      version: v1alpha1
    - description: CloudflareAccount is cluster-scoped and holds credentials for a single
        Cloudflare account.
      displayName: CloudflareAccount
      kind: CloudflareAccount
      name: cloudflareaccounts.kflare.dev
      version: v1alpha1
    - description: 'ConfigurationRule manages one configuration rule in a zone: settings,
        such as the SSL mode or the security level, changed for the requests its expression
        matches.'
      displayName: ConfigurationRule
      kind: ConfigurationRule
      name: configurationrules.kflare.dev
      version: v1alpha1
    - description: D1Database represents a Cloudflare D1 database.
      displayName: D1Database
      kind: D1Database
      name: d1databases.kflare.dev
      version: v1alpha1
    - description: DNSRecord represents a DNS record within a Cloudflare-managed zone.
      displayName: DNSRecord
      kind: DNSRecord
      name: dnsrecords.kflare.dev
      version: v1alpha1
    - description: IPList manages a custom IP list in a Cloudflare account.
      displayName: IPList
      kind: IPList
      name: iplists.kflare.dev
      version: v1alpha1
    - description: KVNamespace represents a Cloudflare Workers KV namespace.
      displayName: KVNamespace
      kind: KVNamespace
      name: kvnamespaces.kflare.dev
      version: v1alpha1
    - description: ManagedRuleset deploys a Cloudflare managed ruleset to a zone, as an
        execute rule in its http_request_firewall_managed phase; the expression selects
        the requests the ruleset inspects, and "true" selects every request.
      displayName: ManagedRuleset
      kind: ManagedRuleset
      name: managedrulesets.kflare.dev
      version: v1alpha1
    - description: 'ManagedTransform turns a zone''s managed transforms on and off: the
        request and response headers Cloudflare adds or removes for the zone.'
      displayName: ManagedTransform
      kind: ManagedTransform
      name: managedtransforms.kflare.dev
      version: v1alpha1
    - description: 'OriginRule manages one origin rule in a zone: the requests its expression
        matches reach the origin on another destination port.'
      displayName: OriginRule
      kind: OriginRule
      name: originrules.kflare.dev
      version: v1alpha1
    - description: R2Bucket represents a Cloudflare R2 bucket.
      displayName: R2Bucket
      kind: R2Bucket
      name: r2buckets.kflare.dev
      version: v1alpha1
    - description: 'RateLimitRule manages one rate limiting rule in a zone, in its http_ratelimit
        phase: the rule counts the requests its expression matches, and once a client
        sends more than requestsPerPeriod of them in a period, the action applies to the
        client''s matching requests for the mitigation timeout.'
      displayName: RateLimitRule
      kind: RateLimitRule
      name: ratelimitrules.kflare.dev
      version: v1alpha1
    - description: 'RedirectRule manages one single redirect in a zone: Cloudflare answers
        the requests its expression matches with a redirect to a URL, a static one or
        one an expression computes.'
      displayName: RedirectRule
      kind: RedirectRule
      name: redirectrules.kflare.dev
      version: v1alpha1
    - description: 'TransformRule manages one transform rule in a zone: a rewrite of the
        URL a request reaches the origin with, or a change to its request or response
        headers.'
      displayName: TransformRule
      kind: TransformRule
      name: transformrules.kflare.dev
      version: v1alpha1
    - description: Tunnel represents a remotely-managed Cloudflare Tunnel and the Secret
        holding the token a cloudflared connector needs to run it.
      displayName: Tunnel
      kind: Tunnel
      name: tunnels.kflare.dev
      version: v1alpha1
    - description: TunnelConfiguration owns the complete ingress configuration of one
        remotely-managed Tunnel.
      displayName: TunnelConfiguration
      kind: TunnelConfiguration
      name: tunnelconfigurations.kflare.dev
      version: v1alpha1
    - description: 'WAFCustomRule manages one WAF custom rule in a zone, in its http_request_firewall_custom
        phase: the rule blocks or challenges the requests its expression matches, or lets
        them skip other security features.'
      displayName: WAFCustomRule
      kind: WAFCustomRule
      name: wafcustomrules.kflare.dev
      version: v1alpha1
    - description: WorkerRoute routes requests matching a URL pattern in a zone to a WorkerScript.
      displayName: WorkerRoute
      kind: WorkerRoute
      name: workerroutes.kflare.dev
      version: v1alpha1
    - description: WorkerScript represents a Cloudflare Worker script and its bindings.
      displayName: WorkerScript
      kind: WorkerScript
      name: workerscripts.kflare.dev
      version: v1alpha1
    - description: Zone represents a DNS zone managed in Cloudflare.
      displayName: Zone
      kind: Zone
      name: zones.kflare.dev
      version: v1alpha1
  artifacthub.io/crdsExamples: |
    - apiVersion: kflare.dev/v1alpha1
      kind: CacheRule
      metadata:
        name: example-cacherule
        namespace: default
      spec:
        browserTTL:
          default: 3600
          mode: override_origin
        cache: true
        cacheKey:
          customKey:
            queryString:
              exclude:
                all: true
        description: Cache static assets, whose names carry their version, for a day
        edgeTTL:
          default: 86400
          mode: override_origin
          statusCodeTTL:
          - statusCode: 404
            value: 60
          - statusCodeRange:
              from: 500
            value: 0
        expression: http.request.uri.path.extension in {"css" "js" "png" "jpg" "svg" "woff2"}
        vary:
          default:
            action: passthrough
          headers:
          - action: normalize
            mediaTypes:
            - image/avif
            - image/webp
            name: accept
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: CloudflareAccount
      metadata:
        name: my-account
      spec:
        accountID: <your account ID>
        tokenSecretRef:
          name: cloudflare-token
          namespace: kflare-system
    - apiVersion: kflare.dev/v1alpha1
      kind: ConfigurationRule
      metadata:
        name: example-configurationrule
        namespace: default
      spec:
        bic: true
        description: Challenge more readily, and leave scripts alone, on the admin pages
        expression: starts_with(http.request.uri.path, "/admin/")
        rocketLoader: false
        securityLevel: high
        ssl: strict
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: D1Database
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-d1database
        namespace: default
      spec:
        accountRef:
          name: my-account
        name: example-db
    - apiVersion: kflare.dev/v1alpha1
      kind: DNSRecord
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: www-a-record
        namespace: default
      spec:
        content: 1.2.3.4
        name: www.example.com
        proxied: true
        ttl: 1
        type: A
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: IPList
      metadata:
        name: office-ips
        namespace: default
      spec:
        accountRef:
          name: my-account
        description: Office egress addresses
        items:
        - comment: Head office
          ip: 192.0.2.1
        - comment: Branch office
          ip: 198.51.100.0/24
        - ip: 2001:db8::/48
        name: office_ips
    - apiVersion: kflare.dev/v1alpha1
      kind: KVNamespace
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-kvnamespace
        namespace: default
      spec:
        accountRef:
          name: my-account
        title: example-kv
    - apiVersion: kflare.dev/v1alpha1
      kind: ManagedRuleset
      metadata:
        name: example-managedruleset
        namespace: default
      spec:
        description: Free Managed Ruleset, the WordPress rules only logging
        expression: "true"
        id: 77454fe2d30c4220b5701f6fdfb893ba
        overrides:
          categories:
          - action: log
            category: wordpress
          rules:
          - enabled: false
            id: 7dfd111a6bad4b86bf3522cce6c5792f
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: ManagedTransform
      metadata:
        name: example-managedtransform
        namespace: default
      spec:
        managedRequestHeaders:
        - enabled: true
          id: add_visitor_location_headers
        managedResponseHeaders:
        - enabled: true
          id: remove_x-powered-by_header
        - enabled: true
          id: add_security_headers
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: OriginRule
      metadata:
        name: example-originrule
        namespace: default
      spec:
        description: Send API requests to the origin's port 8443
        expression: starts_with(http.request.uri.path, "/api/")
        origin:
          port: 8443
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: R2Bucket
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-r2bucket
        namespace: default
      spec:
        accountRef:
          name: my-account
        name: example-bucket
    - apiVersion: kflare.dev/v1alpha1
      kind: RateLimitRule
      metadata:
        name: example-ratelimitrule
        namespace: default
      spec:
        action: block
        description: Limit each client to 100 API requests every 10 seconds
        expression: starts_with(http.request.uri.path, "/api/")
        ratelimit:
          characteristics:
          - cf.colo.id
          - ip.src
          mitigationTimeout: 10
          period: 10
          requestsPerPeriod: 100
        response:
          content: '{"error":"rate limited, try again in 10 seconds"}'
          contentType: application/json
          statusCode: 429
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: RedirectRule
      metadata:
        name: example-redirectrule
        namespace: default
      spec:
        description: Send www.example.com to example.com, keeping the path and query
        expression: http.host eq "www.example.com"
        fromValue:
          preserveQueryString: true
          statusCode: 301
          targetURL:
            expression: concat("https://example.com", http.request.uri.path)
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: TransformRule
      metadata:
        name: example-transformrule-url-rewrite
        namespace: default
      spec:
        description: Serve /old from /new
        expression: http.request.uri.path eq "/old"
        type: urlRewrite
        uri:
          path:
            value: /new
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: Tunnel
      metadata:
        annotations:
          kflare.dev/deletion-policy: retain
        name: example-tunnel
        namespace: default
      spec:
        accountRef:
          name: my-account
        credentialsSecretRef:
          name: example-tunnel-token
        name: example-tunnel
    - apiVersion: kflare.dev/v1alpha1
      kind: TunnelConfiguration
      metadata:
        name: example-tunnel-config
        namespace: default
      spec:
        defaultService: http_status:404
        ingress:
        - hostname: app.example.com
          service: http://my-app.default.svc.cluster.local:80
        - hostname: api.example.com
          originRequest:
            originServerName: api.example.com
          path: ^/v1/
          service: https://my-api.default.svc.cluster.local:443
        tunnelRef:
          name: example-tunnel
    - apiVersion: kflare.dev/v1alpha1
      kind: WAFCustomRule
      metadata:
        name: example-wafcustomrule
        namespace: default
      spec:
        action: block
        description: Block the admin pages from outside the office
        expression: http.request.uri.path wildcard "/admin*" and not ip.src in {192.0.2.0/24}
        priority: 10
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: WorkerRoute
      metadata:
        name: example-api-route
        namespace: default
      spec:
        pattern: example.com/api/*
        workerScriptRef:
          name: example-worker
        zoneRef:
          name: example-zone
    - apiVersion: kflare.dev/v1alpha1
      kind: WorkerScript
      metadata:
        name: example-worker
        namespace: default
      spec:
        accountRef:
          name: my-account
        bindings:
        - name: GREETING
          plainText: Hello
        - name: API_KEY
          secretKeyRef:
            key: api-key
            name: example-worker-secrets
        compatibilityDate: "2024-09-23"
        format: module
        name: example-worker
        script: |
          export default {
            async fetch(request, env) {
              return new Response(`${env.GREETING} from kflare`);
            },
          };
    - apiVersion: kflare.dev/v1alpha1
      kind: Zone
      metadata:
        annotations:
          kflare.dev/adoption-policy: adopt
        name: example-zone
        namespace: default
      spec:
        accountRef:
          name: my-account
        name: example.com
        type: full
  artifacthub.io/images: |
    - image: ghcr.io/jonathangraniero/kflare:0.3.0
      name: kflare
      platforms:
      - linux/amd64
      - linux/arm64
