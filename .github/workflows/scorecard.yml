name: Scorecard

# OpenSSF Scorecard checks the repository's security practices (branch
# protection, pinned dependencies, token permissions, signed releases and
# more), publishes the score the README's badge shows, and sends what it finds
# to code scanning. Publishing restricts this workflow: no write permission or
# env at the workflow level, and in the job only the actions used here.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 6"
  # Checks branch protection again when its rules change.
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      # Scorecard's API checks this workflow's identity before it publishes.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
