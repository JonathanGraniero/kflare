name: Scorecard

# OpenSSF Scorecard checks the repository's security practices (branch
# protection, pinned dependencies, token permissions, signed releases and
# more), publishes the score the README's badge shows, and sends what it finds
# to code scanning. Publishing restricts this workflow: no write permission or
# env at the workflow level, and in the job only the actions used here.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 6"
  # Checks branch protection again when its rules change.
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      # Scorecard's API checks this workflow's identity before it publishes.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
