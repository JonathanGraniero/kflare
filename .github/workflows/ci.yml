name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: these jobs only check out and test.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # Fail instead of silently downloading a newer Go when a tool needs one.
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The newest 1.26 patch, which the Dockerfile's golang:1.26 builder also
      # uses: without check-latest, setup-go takes the older patch the runner
      # image has cached, and govulncheck checks that patch's standard library.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      # Runs manifests, generate, fmt and vet first, then the unit and envtest
      # suites against the oldest supported Kubernetes (ENVTEST_K8S_VERSION).
      - name: Test
        run: make test

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Also regenerates the chart's CRDs and RBAC rules from config/, so the
      # diff check below catches a chart that was not re-synced.
      - name: Lint Helm chart
        run: make helm-lint

      - name: Check generated and formatted files are committed
        run: git diff --exit-code

      - name: Lint
        run: make lint

      # Fails on a known vulnerability in the modules or the Go standard
      # library that the code calls (govulncheck, with this job's Go).
      - name: Check for vulnerabilities
        run: make vulncheck

      # The image copies source directories explicitly, so a new top-level
      # package must be added to the Dockerfile; this catches it.
      - name: Build image
        run: make docker-build IMG=kflare:ci

      # Fails on a vulnerability of high or critical severity that has a fix,
      # in the image's base files or in the Go modules and standard library
      # its binary was built with. The report is in the step's log.
      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kflare:ci
          only-fixed: true
          severity-cutoff: high
          output-format: table
          cache-db: true

  envtest-latest:
    name: Test (newest Kubernetes)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      # The envtest suites again, on the newest Kubernetes release kflare supports.
      - name: Test
        run: make test ENVTEST_K8S_VERSION=1.37.0
