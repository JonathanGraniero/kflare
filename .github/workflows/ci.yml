name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # Fail instead of silently downloading a newer Go when a tool needs one.
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      # Runs manifests, generate, fmt and vet first, then the unit and envtest
      # suites against the oldest supported Kubernetes (ENVTEST_K8S_VERSION).
      - name: Test
        run: make test

      - name: Check generated and formatted files are committed
        run: git diff --exit-code

      - name: Lint
        run: make lint

      # The image copies source directories explicitly, so a new top-level
      # package must be added to the Dockerfile; this catches it.
      - name: Build image
        run: make docker-build IMG=kflare:ci

  envtest-latest:
    name: Test (newest Kubernetes)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # The envtest suites again, on the newest Kubernetes release kflare supports.
      - name: Test
        run: make test ENVTEST_K8S_VERSION=1.37.0
