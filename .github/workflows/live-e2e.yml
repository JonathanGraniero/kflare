name: Live E2E

# The whole e2e suite against the Cloudflare account in the CF_API_TOKEN and
# CF_ACCOUNT_ID secrets and the zone in the CF_E2E_ZONE variable (a zone the
# token can edit, adopted and never deleted), then the upgrade specs against the
# same account. A workflow of its own, apart from the E2E workflow's smoke and
# upgrade jobs, so that its one-at-a-time queue holds up nothing else.
on:
  # Every pull request, as merged into its base, and every push to main and to
  # the release-X.Y branches. A change to the docs alone runs nothing: no spec
  # reads them.
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main, "release-*"]
    paths-ignore: ["**.md", "docs/**"]
  # By hand, on the selected branch: gh workflow run live-e2e.yml --ref <branch>
  workflow_dispatch:

# Read-only: the job only checks out and tests.
permissions:
  contents: read

jobs:
  # A pull request event runs from the pull request's own copy of this file,
  # with the secrets only when its branch is in this repository, which takes
  # write access to push. So the job skips where the secrets are missing: a pull
  # request from a fork (push its branch to this repository to run it) and one
  # of Dependabot's (run it by hand on its branch). No ruleset requires the
  # check. The upgrade specs run after the suite: a step of this job rather
  # than a job of its own, since a concurrency group keeps only one pending
  # job, and a second live job pending in it would cancel another run's.
  live:
    name: Live E2E (Kubernetes v1.37.0)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One live run at a time across every run of this workflow, never
    # cancelled halfway: the specs share one zone and account, whose Free plan
    # holds one rate limiting rule and one IP list, and a cancelled run cannot
    # clean up. Only one more run waits behind it: a newer one takes its place
    # and the older shows as cancelled, to re-run once the queue is empty.
    # Local live runs (hack/e2e-live.sh) must not overlap with it either.
    concurrency:
      group: e2e-cloudflare
      cancel-in-progress: false
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release tags, for the upgrade specs.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      # The suite installs the manager with the Helm chart.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0
          cluster_name: kflare-e2e
          config: local/kind-config.yaml

      - name: Run e2e tests
        env:
          KIND_CLUSTER: kflare-e2e
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_E2E_ZONE: ${{ vars.CF_E2E_ZONE }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" || -z "$CF_E2E_ZONE" ]]; then
            echo "::error::The CF_API_TOKEN and CF_ACCOUNT_ID secrets and the CF_E2E_ZONE variable are not set" \
              "(a run that Dependabot starts gets no secrets): without them every live spec skips"
            exit 1
          fi
          make test-e2e

      # After the suite, which leaves the cluster and the account as it found
      # them, whether it passed or not.
      - name: Run the upgrade specs
        if: ${{ !cancelled() }}
        env:
          KIND_CLUSTER: kflare-e2e
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_E2E_ZONE: ${{ vars.CF_E2E_ZONE }}
        run: make test-e2e-upgrade
