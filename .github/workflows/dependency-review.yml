name: Dependency review

# Fails a pull request that adds a dependency with a known vulnerability, to
# main or to a minor release's release-X.Y branch.
on:
  pull_request:
    branches: [main, "release-*"]

permissions:
  contents: read

# The `protect main` and `protect release branches` rulesets require the `review` job by name: rename it there too.
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
