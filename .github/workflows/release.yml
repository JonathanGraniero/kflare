name: Release

# Releases a vX.Y.Z tag: publishes the controller image and the Helm chart to
# GitHub Container Registry, signs both with cosign, checks the signatures as
# users do, and publishes the GitHub release with the image's SBOMs and
# CHANGELOG.md's section as its notes. Tag release tags a merge to main that
# bumps version and appVersion in helm/kflare/Chart.yaml and starts this
# workflow on the tag; a tag pushed by hand starts it too. The tag must match
# the chart.
on:
  push:
    tags: ["v*.*.*"]
  # A tag the workflow token creates starts no workflow, so Tag release starts
  # this one on its tag. Started on a branch, it stops at the first step.
  workflow_dispatch:

permissions:
  contents: read

# One run per tag at a time, never cancelled halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jonathangraniero/kflare
  CHART_REPO: oci://ghcr.io/jonathangraniero/charts

jobs:
  release:
    name: Publish image and chart
    runs-on: ubuntu-latest
    permissions:
      # Drafts the GitHub release, attaches the SBOMs and publishes it.
      contents: write
      # Pushes the image, the chart and their signatures.
      packages: write
      # Signs keyless: cosign trades the job's OpenID Connect token for a
      # short-lived Sigstore certificate that names this workflow and the tag.
      id-token: write
    steps:
      # No git credentials left on disk: nothing here pushes to git, and the
      # Docker build context would include them.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the chart
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Release runs on a vX.Y.Z tag, not on $GITHUB_REF"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          chart="$(awk '/^version:/ {print $2}' helm/kflare/Chart.yaml)"
          app="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' helm/kflare/Chart.yaml)"
          if [ "$version" != "$chart" ] || [ "$version" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Chart.yaml (version $chart, appVersion $app)"
            exit 1
          fi
          # A published release's image and chart are public and signed, and
          # stay as they are. This endpoint returns only a published release,
          # so a rerun after a failed step goes on with its draft.
          if gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" --silent 2> "$RUNNER_TEMP/release.err"; then
            echo "::error::$GITHUB_REF_NAME is published already"
            exit 1
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release.err"; then
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi
          # A release is made from main, or from its minor release's
          # release-X.Y branch once main has moved on (CONTRIBUTING.md,
          # Releasing), so the tagged commit must be in the history of one of
          # them: a tag pushed by hand on any other commit is refused.
          #
          # in_history reports whether the tagged commit is in the history of
          # branch $1. A branch that does not exist has none.
          in_history() {
            local status
            if status="$(gh api "repos/$GH_REPO/compare/$1...$GITHUB_SHA" --jq .status \
              2> "$RUNNER_TEMP/compare.err")"; then
              [ "$status" = identical ] || [ "$status" = behind ]
            elif grep -q 'HTTP 404' "$RUNNER_TEMP/compare.err"; then
              return 1
            else
              cat "$RUNNER_TEMP/compare.err" >&2
              exit 1
            fi
          }
          release_branch="release-${version%.*}"
          if in_history main; then
            # Main releases only its newest version. A patch release of an
            # older minor release comes from its release branch, without
            # what main has had since.
            set -o pipefail
            newest="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref' |
              sed 's|^refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            if [ "$newest" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$GITHUB_REF_NAME is older than $newest: tag it on $release_branch, not on main"
              exit 1
            fi
            branch=main
          elif in_history "$release_branch"; then
            branch="$release_branch"
          else
            echo "::error::$GITHUB_REF_NAME is on neither main nor $release_branch"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Before anything is published, so that a section CHANGELOG.md lacks
      # stops the release here.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          # Nothing a release runs comes from a cache.
          cache: false

      - name: Write the release notes
        run: go run ./hack/releasenotes > "$RUNNER_TEMP/notes.md"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each platform's image gets an SPDX SBOM and SLSA provenance (mode=max:
      # the whole build definition), stored in the image index next to it, so
      # the index's signature covers them too.
      - name: Build and push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      # cosign 3.1.3 rather than the installer's default (3.0.6), which leaves
      # the bundle's type out of GHCR's referrers index: Kyverno's ClusterPolicy
      # check (type: SigstoreBundle) then finds no signature. Dependabot doesn't
      # update this input.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Keyless, in cosign's default format: a Sigstore bundle, recorded in
      # Sigstore's public transparency log. GHCR has no referrers API, so cosign
      # stores the bundle under the tag sha256-<digest> next to the image.
      - name: Sign image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push chart
        id: chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package helm/kflare --destination dist
          set -o pipefail
          helm push "dist/kflare-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee dist/push.log
          digest="$(awk '$1 == "Digest:" {print $2}' dist/push.log)"
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::helm push printed no digest to sign"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO#oci://}/kflare@$DIGEST"

      # The SBOMs from the image index, each with the Sigstore bundle that
      # cosign verify-blob checks it with. The release stays a draft until
      # the signatures verify. Its target is the branch it was made from,
      # which the release page and OpenSSF Scorecard read: Scorecard checks
      # the protection of each branch that a release names.
      - name: Draft the GitHub release with the SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          mkdir -p dist/sbom
          for platform in linux/amd64 linux/arm64; do
            file="dist/sbom/kflare-$VERSION-${platform/\//-}.spdx.json"
            docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{ json (index .SBOM \"$platform\").SPDX }}" > "$file"
            # The template prints null for a platform without an SBOM.
            jq -e .spdxVersion "$file" > /dev/null
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          # A rerun replaces the assets and notes of the release it drafted.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/sbom/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "kflare $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/sbom/* --draft --verify-tag --target "$BRANCH" \
              --title "kflare $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # What deploy.md's Verifying a release tells users to run, without a
      # login to ghcr.io: the image and the chart at the version's tags,
      # signed by this workflow for this tag, are what was pushed, and so are
      # the SBOM files.
      - name: Verify the signatures
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous"
          mkdir -p "$DOCKER_CONFIG"
          echo '{}' > "$DOCKER_CONFIG/config.json"
          identity="https://github.com/JonathanGraniero/kflare/.github/workflows/release.yml@refs/tags/v$VERSION"
          issuer=https://token.actions.githubusercontent.com
          verify() {
            local verified
            if ! verified="$(cosign verify "$1" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" |
              jq -r '.[0].critical.image."docker-manifest-digest"')"; then
              echo "::error::$1 is not signed by this workflow for v$VERSION"
              exit 1
            fi
            if [ "$verified" != "$2" ]; then
              echo "::error::$1 is $verified, but the workflow pushed $2"
              exit 1
            fi
          }
          verify "$IMAGE:$VERSION" "$IMAGE_DIGEST"
          verify "${CHART_REPO#oci://}/kflare:$VERSION" "$CHART_DIGEST"
          for file in dist/sbom/*.spdx.json; do
            cosign verify-blob "$file" --bundle "$file.sigstore.json" \
              --certificate-identity "$identity" --certificate-oidc-issuer "$issuer"
          done

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          # Latest, unless a newer version is tagged, as when a fix goes out
          # for an older release.
          newest="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref' |
            sed 's|^refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          latest=false
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            latest=true
          fi
          id="$(TAG="$GITHUB_REF_NAME" gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | .id')"
          if [ -z "$id" ]; then
            echo "::error::found no draft release for $GITHUB_REF_NAME"
            exit 1
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f make_latest="$latest" --silent
          echo "Published $GITHUB_REF_NAME (latest: $latest)."

  scan:
    name: Start the release scan
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Starts Release scan on main, whose code scanning results it reports.
      actions: write
    steps:
      - name: Start the release scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-scan.yml --repo "$GITHUB_REPOSITORY" --ref main
