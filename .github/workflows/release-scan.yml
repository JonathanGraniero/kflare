name: Release scan

# Scans the latest release's image every week, so that a vulnerability found
# after the release shows up without a new commit: in the image's base files
# or in the Go modules and standard library its binary was built with. Grype's
# report goes to code scanning, and a fixable vulnerability of high or critical
# severity fails the run. govulncheck then checks the binary against the Go
# project's own advisories, which reach it before they reach Grype's sources.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan the latest release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find the latest release's image
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "image=ghcr.io/jonathangraniero/kflare:${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Scan the image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.release.outputs.image }}
          only-fixed: true
          severity-cutoff: high
          output-format: sarif
          cache-db: true

      - name: Upload the report to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: release-image

      - name: Set up Go
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Check the binary for vulnerabilities
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          docker create --name release --platform linux/amd64 "$IMAGE"
          docker cp release:/manager manager
          make vulncheck VULNCHECK_ARGS="-mode=binary manager"
