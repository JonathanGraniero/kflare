name: E2E

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for running e2e tests"
        required: false
        default: "manual"

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: kflare-e2e
          config: local/kind-config.yaml

      # Builds the manager image, deploys it with config/default and checks
      # that the manager starts. No Cloudflare credentials are needed.
      - name: Run e2e tests
        env:
          KIND_CLUSTER: kflare-e2e
        run: go test ./test/e2e/ -v -ginkgo.v -timeout 20m
