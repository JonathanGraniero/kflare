name: E2E

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for running e2e tests"
        required: false
        default: "manual"

jobs:
  e2e:
    name: E2E Tests (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the newest one.
        kubernetes: [v1.34.11, v1.37.0]
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:${{ matrix.kubernetes }}
          cluster_name: kflare-e2e
          config: local/kind-config.yaml

      # Builds the manager image, deploys it with config/default and checks
      # that the manager starts. With the CF_API_TOKEN and CF_ACCOUNT_ID
      # secrets set, it then drives the manager against the Cloudflare API;
      # the CF_E2E_ZONE variable (a zone the token can edit, never deleted)
      # adds the Zone and DNSRecord specs. Without them those specs skip.
      - name: Run e2e tests
        env:
          KIND_CLUSTER: kflare-e2e
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_E2E_ZONE: ${{ vars.CF_E2E_ZONE }}
        run: make test-e2e
