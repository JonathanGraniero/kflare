name: E2E

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for running e2e tests"
        required: false
        default: "manual"

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: kflare-e2e
          config: local/kind-config.yaml

      - name: Install CRDs
        run: make manifests && kubectl apply -k config/crd/

      - name: Run e2e tests
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: go test ./test/e2e/... -tags e2e -v -timeout 10m
