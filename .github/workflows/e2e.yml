name: E2E

# The live suite, against Cloudflare, is the Live E2E workflow (live-e2e.yml).
# Pushes to main and to the release-X.Y branches run it, so that a release's
# merge commit has passed it before its tag.
on:
  pull_request:
  push:
    branches: [main, "release-*"]
  workflow_dispatch:

# Read-only by default: the jobs only check out and test.
permissions:
  contents: read

jobs:
  # Builds the manager image, installs it on kind with the Helm chart and
  # checks that the manager starts and serves its metrics securely. It has no Cloudflare credentials, so the
  # live specs skip.
  smoke:
    name: E2E Tests (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the newest one. The `protect main`
        # ruleset requires each job by name, and `protect release branches` as
        # the release branch names them: change its versions there too.
        kubernetes: [v1.34.11, v1.37.0]
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      # The suite installs the manager with the Helm chart.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:${{ matrix.kubernetes }}
          cluster_name: kflare-e2e
          config: local/kind-config.yaml

      - name: Run e2e tests
        env:
          KIND_CLUSTER: kflare-e2e
        run: make test-e2e

  # Installs the last release's chart from its registry and applies the
  # resources of test/e2e/testdata/upgrade.yaml as that release has them, then
  # upgrades the chart to this checkout's and checks that the CRDs and the
  # manager are its, that every resource still applies as GitOps would sync it,
  # and that the new manager reconciles each one and keeps what the release
  # stored. Without Cloudflare credentials, the resources wait for them; the
  # Live E2E workflow runs the same specs against Cloudflare. On a release
  # branch, the last release is the newest patch of its minor release. The
  # `protect main` and `protect release branches` rulesets require the job by
  # name, which holds its Kubernetes version: change it there too.
  upgrade:
    name: Upgrade from the last release (Kubernetes v1.37.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release tags, and the last release's copy of the resources.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0
          cluster_name: kflare-e2e
          config: local/kind-config.yaml

      - name: Run the upgrade specs
        env:
          KIND_CLUSTER: kflare-e2e
        run: make test-e2e-upgrade
